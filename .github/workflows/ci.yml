# CI — البوابات السبع على كل دفعة وطلب دمج (المرحلة ٥ من خطة الإطلاق).
# لا npm إطلاقًا: كل الأدوات Node خالص، والاختبارات المتصفحية عبر CDP على كروم العدّاء.
# صورة العدّاء مثبّتة (لا ubuntu-latest) كي تتكرّر النتيجة، والإجراءات على إصداراتها
# العاملة بـNode 24 (إصدارات Node 20 أُهملت في GitHub Actions).
name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: "البوابة ١ — صياغة كل ملفات JS"
        run: node tools/check-syntax.mjs

      - name: "البوابة ٢ — سلامة القاموس (lint-dict)"
        run: node tools/lint-dict.mjs

      # حارس «الفائز الخاطئ على الحصاد الكامل» يجري في مجلد التطوير وحده — ملف
      # الحصاد خاص لا يُنشر، والبوابة هنا تفحص التظليل على القاموس كاملًا وتصرّح بذلك
      - name: "البوابة ٣ — الأنماط: لا تظليل ولا فائز خاطئ"
        run: node tools/cross-check-patterns.mjs

      - name: "البوابة ٤ — الاختبارات المتصفحية كاملة (CDP بلا واجهة)"
        run: node tools/run-tests-cdp.mjs
        env:
          CI: "true"

      - name: "البوابة ٥ — سلامة الحزمة (المانيفست والصلاحيات والمصنوعات)"
        run: node tools/verify-package.mjs

      # المولَّد المودَع (القاموس المبنيّ والمانيفست) يطابق ما يولّده مصدره الآن —
      # تعديلُ المصدر بلا إعادة بناءٍ يُكشف هنا لا في المتجر
      - name: "البوابة ٦ — البناء طازج"
        run: node tools/check-fresh.mjs

      # الإضافة نفسها محمَّلةً في كروم (Extensions.loadUnpacked عبر الأنابيب)، وعناوين المواقع
      # الأربعة موجَّهةٌ إلى خادمٍ محلي بشهادةٍ تُولَّد عند التشغيل: المانيفست وسكربتات المحتوى
      # وعامل الخدمة والرسائل وترتيب CSS وحارس المسار — بلا شبكةٍ خارجية ولا حساب
      - name: "البوابة ٧ — دخان الإضافة المحمَّلة"
        run: node tools/smoke-extension.mjs
        env:
          CI: "true"
