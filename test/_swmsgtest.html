<!--
  اختبار رسائل عامل الخدمة عبر مستمع onMessage الحقيقي في sw.js (المراجعة المستقلة):
   ١) أمر إدارة المزامنة من صفحة الإعدادات — وهي تُفتح في تبويب فيحمل مرسلُها tab — يُقبل.
      (كان اشتراط غياب tab يرفض كل أوامرها في المتصفح الحقيقي.)
   ٢) الأمر نفسه من سكربت محتوى (أصلُه صفحة الموقع) يُرفض.
   ٣) طلب الورقة الحيّة من مرسلٍ خارج النطاقات، أو بورقةٍ من مضيفٍ غريب، يُرفض بلا جلب.
   ٤) ميزانية ذاكرة الأوراق الحيّة عبر النطاقات: الأقدم يُطرد متى تجاوز المجموع.
   ٥) تعديل التصحيحات أمرًا جزئيًّا: من صفحات الإضافة وحدها، على القراءة الطازجة، بالمعقِّم الواحد.
   ٦) الورقة المضمَّنة (<style> من المستند — وثائق Claude Code): بلا جلب، وبصمتها ببصمة نصّها، وحدودها كالروابط.
   ٧) نسخة الخط العربي (DESIGN-fonts §٤.٢، §٥.٤): العامل كاتبها الوحيد — عند التثبيت، وتغيّر الاختيار، وحذفها، وطلب
      الإصلاح من مرسلٍ مأذون — بالتسلسل، وفي ميزانية صنف cache، وعند امتلاء التخزين لا يُمسّ صنف data.
   ٨) (ر24-و) جزر الورقة النقطية للنطاق: اسمها من مدخله في المانيفست الحقيقي، والقراءة الناجحة تُحفظ والفاشلة تُعاد، والجزيرة داخل @ ترفض الجزر،
      وبصمتها في بصمة الورقة الحيّة.
  العقد: document.title = "swmsg N/N".
-->
