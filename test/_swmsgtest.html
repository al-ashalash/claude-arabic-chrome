<!--
  اختبار رسائل عامل الخدمة عبر مستمع onMessage الحقيقي في sw.js (المراجعة المستقلة):
   ١) أمر إدارة المزامنة من صفحة الإعدادات — وهي تُفتح في تبويب فيحمل مرسلُها tab — يُقبل.
      (كان اشتراط غياب tab يرفض كل أوامرها في المتصفح الحقيقي.)
   ٢) الأمر نفسه من سكربت محتوى (أصلُه صفحة الموقع) يُرفض.
   ٣) طلب الورقة الحيّة من مرسلٍ خارج النطاقات، أو بورقةٍ من مضيفٍ غريب، يُرفض بلا جلب.
   ٤) ميزانية ذاكرة الأوراق الحيّة عبر النطاقات: الأقدم يُطرد متى تجاوز المجموع.
   ٥) تعديل التصحيحات أمرًا جزئيًّا: من صفحات الإضافة وحدها، على القراءة الطازجة، بالمعقِّم الواحد.
   ٦) الورقة المضمَّنة (<style> من المستند — وثائق Claude Code): بلا جلب، وبصمتها ببصمة نصّها، وحدودها كالروابط.
   ٧) نسخة الخط العربي (DESIGN-fonts §٤.٢، §٥.٤): العامل كاتبها الوحيد — عند التثبيت، وتغيّر الاختيار، وحذفها، وطلب
      الإصلاح من مرسلٍ مأذون — بالتسلسل، وفي ميزانية صنف cache، وعند امتلاء التخزين لا يُمسّ صنف data.
  العقد: document.title = "swmsg N/N".
-->

  // ملفات الخطوط من الحزمة نفسها (getURL) تُقرأ من مجلد الإضافة الحقيقي — وما سواها لا شبكة
  window.fetch = function (u) {
    var s2 = String(u), pre = "chrome-extension://" + EXT_ID + "/";

    if (s2.indexOf(pre + "fonts/") === 0) return REAL_FETCH("../extension/" + s2.slice(pre.length));
    return Promise.reject(new Error("لا شبكة في الاختبار"));
  };
  function fdata() { return MOCK.localStore[K.FONT_DATA]; }
  // سلسلة العامل (fontChain): ما يطلقه حدثٌ ينضمّ إليها في الحال، فانتظارها مرتين يغطي دورًا أطلقته كتابةُ الدور السابق
  function settle() { return window.fontChain.then(function () { return window.fontChain; }); }
  function decoded(d) { try { var u = new Uint8Array(CMLShared.b64ToBuf(d.b64)); return String.fromCharCode(u[0], u[1], u[2], u[3]) + "/" + u.length; } catch (e) { return "x"; } }
  check("العامل سجّل onInstalled وonStartup", "1/1", LISTENERS.installed.length + "/" + LISTENERS.startup.length);
  LISTENERS.installed[0]({ reason: "install" });
  await settle();
  check("★ onInstalled يكتب نسخة الافتراضي: المعرّف والبصمة، والبايتات المفكوكة wOF2 بطول الفهرس", "cairo/" + CAIRO.sha + "/wOF2/" + CAIRO.bytes,
    fdata() && (fdata().id + "/" + fdata().v + "/" + decoded(fdata())));
  MOCK.chrome.storage.local.set({ cml_font: CMLConst.FONT_SITE });
  await settle();
  check("★ «خط الموقع» يحذف النسخة", "false", K.FONT_DATA in MOCK.localStore);
  MOCK.chrome.storage.local.set({ cml_font: "zz-not-in-catalogue" });
  await settle();
  check("معرّفٌ مجهول يُحسم إلى الافتراضي", "cairo", fdata() && fdata().id);
  MOCK.localStore[K.FONT_DATA] = { id: "cairo", v: "ffffffffffffffff", b64: "AAAA" };
  MOCK.fireChanged({ cml_font_data: { newValue: MOCK.localStore[K.FONT_DATA] } }, "local");
  await settle();
  check("بصمةٌ مختلفة تعيد الكتابة", CAIRO.sha + "/true", fdata().v + "/" + (fdata().b64.length === Math.ceil(CAIRO.bytes / 3) * 4));
  MOCK.localStore[K.FONT_DATA] = { id: "cairo", v: CAIRO.sha, err: "file" };
  var nf0 = FFETCH.length;
  MOCK.fireChanged({ cml_font_data: { newValue: MOCK.localStore[K.FONT_DATA] } }, "local");
  await settle();
  check("★ سجلُّ err لا يُعاد على البصمة نفسها من تلقاء نفسه (لا جلب)", "file/0", fdata().err + "/" + (FFETCH.length - nf0));
  var BAD_SENDER = { id: EXT_ID, url: "https://evil.example/x", origin: "https://evil.example", tab: { id: 11 } };
  var fe0 = await send({ type: "font-ensure" }, BAD_SENDER);
  await settle();
  check("★ font-ensure من مرسلٍ غير مأذون يُتجاهل", "null/file/0", String(fe0) + "/" + fdata().err + "/" + (FFETCH.length - nf0));
  var fe1 = await send({ type: "font-ensure" }, CONTENT_SENDER);
  check("★ وfont-ensure من تبويبٍ في نطاقٍ معروف يعيده، والردّ بلا حمولة", '{"ok":true}/true/undefined',
    JSON.stringify(fe1) + "/" + (typeof fdata().b64 === "string") + "/" + fdata().err);
  var nf1 = FFETCH.length;
  var fe2 = await send({ type: "font-ensure" }, OPTIONS_SENDER);
  check("ومن صفحة الإعدادات («إعادة المحاولة») يُقبل، ولا يُعاد جلبُ نسخةٍ سليمة", '{"ok":true}/0', JSON.stringify(fe2) + "/" + (FFETCH.length - nf1));
  // ★ (المراجعة العدائية S6-B) نسخةٌ بالطول الصحيح وبايتاتٍ تالفة (المعرّف والبصمة صحيحان): onChanged لا يعيدها، وfont-ensure
  // (المحرّك رفضها) يتحقق من بصمة بايتاتها فيعيد الجلب — وكانت تبقى تالفةً أبدًا
  var goodB64 = fdata().b64;
  MOCK.localStore[K.FONT_DATA] = { id: "cairo", v: CAIRO.sha, b64: new Array(goodB64.length + 1).join("A") };
  var nf2 = FFETCH.length;
  MOCK.fireChanged({ cml_font_data: { newValue: MOCK.localStore[K.FONT_DATA] } }, "local");
  await settle();
  var stillBad = fdata().b64 !== goodB64;
  var fe3 = await send({ type: "font-ensure" }, CONTENT_SENDER);
  await settle();
  check("★ نسخةٌ تامّة الطول تالفة البايتات: font-ensure يتحقق من بصمتها فيعيد جلبها وكتابتها", '{"ok":true}/true/1/true',
    JSON.stringify(fe3) + "/" + stillBad + "/" + (FFETCH.length - nf2) + "/" + (fdata().b64 === goodB64));
  var wn0 = MOCK.localWrites.length;
  MOCK.chrome.storage.local.set({ cml_font: "noto-naskh-arabic" });
  MOCK.chrome.storage.local.set({ cml_font: "markazi-text" });
  await settle();
  var fw = MOCK.localWrites.slice(wn0).filter(function (w) { return w[K.FONT_DATA]; }).map(function (w) { return w[K.FONT_DATA].id + (w[K.FONT_DATA].b64 ? "" : "!"); });
  check("★ تغييران سريعان: الكتابات متسلسلة وتنتهي إلى الأخير", "markazi-text/markazi-text/true",
    fdata().id + "/" + fw[fw.length - 1] + "/" + fw.every(function (x) { return x.indexOf("!") < 0; }));
  // إعادة الضبط تحذف المفتاحين (والمتصفح يبثّ الحذف): تُعاد الكتابة بالافتراضي
  delete MOCK.localStore[K.FONT]; delete MOCK.localStore[K.FONT_DATA];
  MOCK.fireChanged({ cml_font: { oldValue: "markazi-text" }, cml_font_data: { oldValue: {} } }, "local");
  await settle();
  check("★ بعد إعادة الضبط تُعاد كتابة النسخة (الافتراضي)", "cairo", fdata() && fdata().id);

  // ★ التخزين القريب من الامتلاء (م٢): الأوراق الحيّة تملأ ميزانية cache ⇒ تُطرد الأقدم وتُكتب النسخة
  var DOCS_LV = CMLConst.key(K.RTL_LIVE, "docs"), APP_LV = CMLConst.key(K.RTL_LIVE, "app");
  var budget0 = CMLConst.RTL_LIVE_BUDGET_BYTES;
  CMLConst.RTL_LIVE_BUDGET_BYTES = 200000;
  MOCK.localStore[DOCS_LV] = { fp: "d", css: "d{}", at: 1, bytes: 60000 };
  MOCK.localStore[APP_LV] = { fp: "a", css: "a{}", at: 2, bytes: 60000 };
  delete MOCK.localStore[K.FONT_DATA];
  MOCK.chrome.storage.local.set({ cml_font: "noto-naskh-arabic" });
  await settle();
  check("★ أوراقٌ حيّة تملأ ميزانية cache مع النسخة: تُطرد الأقدم وحدها وتُكتب النسخة", "noto-naskh-arabic/false/true",
    (fdata() && fdata().id) + "/" + (DOCS_LV in MOCK.localStore) + "/" + (APP_LV in MOCK.localStore));
  CMLConst.RTL_LIVE_BUDGET_BYTES = budget0;
  // ★ تخزينٌ ممتلئ ببيانات صنف data: حصّةٌ مقلَّدة على المجموع (كخطأ QUOTA_BYTES في المتصفح، والرفض ذرّي)
  var realSet = MOCK.chrome.storage.local.set, QUOTA = 0;
  function used(extra) {
    var t = 0, k2, all = Object.assign({}, MOCK.localStore, extra || {});
    for (k2 in all) if (all[k2] !== undefined) t += k2.length + JSON.stringify(all[k2]).length;
    return t;
  }
  MOCK.chrome.storage.local.set = function (obj, cb) {
    if (used(obj) > QUOTA) {
      // كما في المتصفح: الردّ لاحقٌ (لا متداخلٌ في نداء الكتابة)، وlastError منصوبٌ أثناءه وحده
      setTimeout(function () {
        MOCK.chrome.runtime.lastError = { message: "QUOTA_BYTES quota exceeded" };
        try { if (cb) cb(); } finally { MOCK.chrome.runtime.lastError = undefined; }
      }, 0);
      return;
    }
    return realSet(obj, function () { setTimeout(function () { if (cb) cb(); }, 0); });
  };
  var OV = { ar: {} };
  for (var oi = 0; oi < 1500; oi++) OV.ar["Zq data term " + oi] = "مصطلحٌ للاختبار رقم " + oi;
  MOCK.localStore.cml_overrides = OV;
  var ovBefore = JSON.stringify(MOCK.localStore.cml_overrides);
  var cairoChars = Math.ceil(CAIRO.bytes / 3) * 4;
  MOCK.localStore.cml_font = "cairo";
  MOCK.localStore[APP_LV] = { fp: "a", css: "a{}", at: 2, bytes: 20000, pad: new Array(20001).join("x") };
  delete MOCK.localStore[K.FONT_DATA];
  QUOTA = used() + cairoChars - 5000;   // لا تسع النسخة إلا بطرد الأوراق
  await ensureFontCache();
  check("★ امتلاءٌ يسعه طرد الأوراق كلها: تُطرد وتُكتب النسخة، وبيانات data كما هي بايتًا بايتًا", "cairo/true/false/true",
    (fdata() && fdata().id) + "/" + (typeof (fdata() || {}).b64 === "string") + "/" + (APP_LV in MOCK.localStore) + "/" +
    (JSON.stringify(MOCK.localStore.cml_overrides) === ovBefore));
  MOCK.localStore[APP_LV] = { fp: "a", css: "a{}", at: 2, bytes: 20000, pad: new Array(20001).join("x") };
  delete MOCK.localStore[K.FONT_DATA];
  QUOTA = used() - 20000 + cairoChars - 5000;   // ولا يسعها ولو طُردت الأوراق
  await ensureFontCache();
  check("★ امتلاءٌ لا يسعه شيء: سجلّ err quota، والأوراق مطرودة، وبيانات data كما هي بايتًا بايتًا", "quota/false/true",
    (fdata() && fdata().err) + "/" + (APP_LV in MOCK.localStore) + "/" + (JSON.stringify(MOCK.localStore.cml_overrides) === ovBefore));
  MOCK.chrome.storage.local.set = realSet;
  delete MOCK.localStore.cml_overrides;
  window.fetch = realFetch;
  check("لا أخطاء JS غير ملتقطة", "0", jsErrors);
  document.title = "swmsg " + pass + "/" + total;
  var h = document.createElement("p");
  h.className = pass === total ? "ok" : "bad";
  h.textContent = "SWMSG: " + pass + "/" + total + (pass === total ? " — all pass" : " — FAIL");
  document.body.appendChild(h);
})();
