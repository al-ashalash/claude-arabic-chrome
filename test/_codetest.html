<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>code test</title>
<!--
  اختبار نطاق وثائق Claude Code (code.claude.com/docs — Mintlify فوق Next.js): ما أُضيف للمحرّك لأجله،
  كلٌّ في إطارٍ مستقل (_codeframe.html) لأن لكل حالةٍ محرّكها:
   ١) حارس نوع المستند: نسخ ‎.md‎ وllms.txt (نصٌّ خام تحت المطابقة) خاملةٌ تمامًا — لا سمات ولا إخفاء ولا ترجمة.
   ٢) سقف الترطيب لكل نطاق (meta.hydrateMaxMs) يحلّ محلّ العام (HYDRATE_MAX_MS) ولو كان أطول منه.
   ٣) meta.skipSel: أجوبة المساعد المولَّدة لا تُعرَّب نصًّا ولا سمة، ولا تُحصد (الحاصد والمحرّك متطابقان
      في الاتجاهين)، وما عُرِّب ثم نُقل إليها يُرجع أصله.
   ٤) الورقة الحيّة تحمل أوراق <style> المضمَّنة (CSS الموقع الخاص في المتن) بترتيب المستند.
   ٥) code-point.css: الحشوة السطرية في الشريط والفهرس، والرموز الاتجاهية، وجزيرة الشيفرة، ومحاذاة الخلايا.
   ٩) ★ (ر6-ب) حارس المتن المختلط (meta.bodyGuard): صفحةٌ تزيد حصّة كتلها غير المغطّاة على العتبة يبقى متنها إنجليزيًّا كلّه والواجهة عربية،
      والحكم ثابتٌ للصفحة (لوحةٌ متأخرة تتبعه)، ويُعاد بالتنقّل وحده، والإطفاء يرفعه؛ والعتبة في جدول النطاقات لـcode وحده.
      ★ (ر6-ج) وتوقيته: بعد التنقّل يُحكم حين تتبدّل هويّة الشجرة وبهدوءٍ يُعدّ من لحظة التبدّل (لا تعيده إضافات الموقع الصغيرة)،
      وفورًا عند التشغيل إن تبدّلت والإضافة مطفأة، ولا حكم على شجرة الصفحة السابقة ولو بلغ السقف.
      ★ (ر6-د) والعتبة 5٪ في مواقع المتون الخمسة (القرار 83)، والصفحة بلا قطعة تُحكم بقطعةٍ فارغة فتُحجب بسببها «none» إلا أن يغطّي قاموسُ
      الواجهة متنَها أو لا كتلة فيه (القرار 84)؛ والصفحات السابقة المخبوءة في المستند (display:none مضمَّن) لا تُعدّ ولا يُكتب فيها.
  العقد: document.title = "codetest N/N".
-->
<style>body{font-family:system-ui;padding:16px;max-width:900px;margin:auto}
table{border-collapse:collapse;width:100%;margin-top:12px}
td,th{border:1px solid #ccc;padding:6px 8px;font-size:14px;text-align:right}
.ok{color:#127a2b;font-weight:700}.bad{color:#b00;font-weight:700}
iframe{width:600px;height:220px;border:1px solid #ddd}</style>
<h1>اختبار نطاق وثائق Claude Code</h1>
<table id="tbl"><thead><tr><th>الحالة</th><th>المتوقَّع</th><th>الناتج</th><th></th></tr></thead><tbody></tbody></table>
<div id="frames"></div>
<script>var jsErrors = 0; window.onerror = function () { jsErrors++; };</script>
<script>
var tb = document.querySelector("#tbl tbody"), pass = 0, total = 0;
function check(name, expect, got) {
  total++; var ok = String(expect) === String(got); if (ok) pass++;
  var tr = document.createElement("tr");
  [name, expect, got].forEach(function (v) { var td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
  var s = document.createElement("td"); s.className = ok ? "ok" : "bad"; s.textContent = ok ? "✓" : "✗"; tr.appendChild(s);
  tb.appendChild(tr);
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function noBidi(s) { return String(s).replace(new RegExp("[" + String.fromCharCode(0x2066) + "-" + String.fromCharCode(0x2069) + "]", "g"), ""); }
// إطارٌ بحالته، ويُنتظر حتى يحمّل محرّكه (أو يخرج — حارس نوع المستند)
function frame(q) {
  return new Promise(function (res) {
    var f = document.createElement("iframe");
    f.src = "_codeframe.html?" + q;
    f.onload = function () { res(f.contentWindow); };
    document.getElementById("frames").appendChild(f);
  });
}
function attrs(w) {
  var h = w.document.documentElement;
  return ["data-cml", "dir", "data-cml-rtl", "data-cml-boot", "data-cml-hold"].map(function (a) { return String(h.getAttribute(a)); }).join("/");
}

(async function () {
  // ١) حارس نوع المستند
  var md = await frame("ct=md"), pl = await frame("ct=plain"), ctl = await frame("");
  await wait(900);
  check("★ ‎.md‎ (text/markdown): المحرّك خاملٌ تمامًا — لا سمات ولا إخفاء ولا ترجمة", "null/null/null/null/null/Settings/true",
        attrs(md) + "/" + md.document.getElementById("out").textContent + "/" + md.__ready);
  check("★ llms.txt (text/plain): خاملٌ كذلك", "null/null/null/null/null/Settings",
        attrs(pl) + "/" + pl.document.getElementById("out").textContent);
  check("والمستند HTML نفسه يعمل (الإطار سليم)، وبلا skipSel يُعرَّب ما في #chat-content (فاختبار الاستثناء ليس فارغًا)",
        "on/rtl/v2/null/null/الإعدادات/الإعدادات",
        attrs(ctl) + "/" + noBidi(ctl.document.getElementById("out").textContent) + "/" + noBidi(ctl.document.getElementById("ans").textContent));

  // ٥) code-point.css على المستند العامل
  var D = ctl.document, cs = function (id) { return ctl.getComputedStyle(D.getElementById(id)); };
  check("★ حشوة الشريط السطرية (padding-left:1rem) تُنقل إلى البداية: يسار 12 ويمين 16", "12px/16px",
        cs("sideA").paddingLeft + "/" + cs("sideA").paddingRight);
  check("★ تداخل الفهرس بقيمته المرصودة (--toc-padding-left:2rem) من اليمين", "0px/32px",
        cs("tocA").paddingLeft + "/" + cs("tocA").paddingRight);
  // ★ (فحص الاتجاه ١–٣، ١٦ ربيع الآخر ١٤٤٨هـ) البند الإنجليزي (LTR) تداخلُه من بدايته هو: اليسار
  check("★ بند الفهرس الإنجليزي (dir=ltr) تداخلُه من اليسار (لا يُقلب إلى اليمين)", "16px/0px",
        cs("tocEn").paddingLeft + "/" + cs("tocEn").paddingRight);
  check("★ بند المجموعة المتداخلة (padding-left: 1.75rem) يُنقل إلى البداية: يسار 12 ويمين 28", "12px/28px",
        cs("sideN").paddingLeft + "/" + cs("sideN").paddingRight);
  check("★ درج التنقّل على الجوال (#navigation-items خارج #sidebar): الحشوة إلى البداية وسهم المجموعة معكوس", "12px/16px/-1 1",
        cs("drawA").paddingLeft + "/" + cs("drawA").paddingRight + "/" + cs("drawChev").scale);
  check("★ الرموز الاتجاهية معكوسة بـscale وتدويرُ الموقع باقٍ؛ والمُدار لأسفل (قائمةٌ منسدلة) لا يُعكس",
        "-1 1/-1 1/none/-1 1/180deg/-1 1/-1 1/none",
        [cs("ctaSvg").scale, cs("pgPrev").scale, cs("pgPrev").rotate, cs("pgNext").scale, cs("pgNext").rotate,
         cs("caret").scale, cs("sideChev").scale, cs("selSvg").scale].join("/"));
  // ★ (فحص الاتجاه ٦) لا قصّ لمنطقة المحتوى (كان يقصّ الجداول العريضة القابلة للتمرير): سببُ الفيض وحده يُخفى — مرساة
  // العنوان الإنجليزي دون 1024 (الإطار بعرض 600)
  check("★ كتلة الشيفرة جزيرة LTR، ومنطقة المحتوى لا تُقصّ، ومرساة العنوان الإنجليزي مخفيّةٌ دون 1024", "ltr/visible/none",
        cs("cb").direction + "/" + cs("content-area").overflowX + "/" + cs("ancEn").display);
  // ★ (التحقق النهائي، ١٧ ربيع الآخر ١٤٤٨هـ) ومرساة الإصدار في سجلّ الإصدارات (‎.update > div > div > a‎) سببُ الفيض نفسه على الجوال
  check("★ مرساة الإصدار الإنجليزي في سجلّ الإصدارات (‎.update‎) مخفيّةٌ دون 1024 كمرساة العنوان", "none", cs("ancUpd").display);
  // (رمز السهم بعدده السداسي: 2190 ← و2192 →؛ والمحتوى المحسوب بين علامتي تنصيص)
  var aft = function (id) { var c = ctl.getComputedStyle(D.getElementById(id), "::after").content; return c.length === 3 ? c.charCodeAt(1).toString(16) : c; };
  check("★ رابط «ما الجديد» المعرَّب سهمُه في اتجاهه (2190) والإنجليزي بجواره على حاله (2192) — فحص الاتجاه ٥", "2190/2192",
        aft("dgAr") + "/" + aft("dgEn"));
  var FT = D.getElementById("ft");
  check("★ رابط التذييل يلتفّ بدل القصّ (فحص الاتجاه ٨)", "normal/true", cs("ft").whiteSpace + "/" + (FT.scrollWidth <= FT.clientWidth));
  check("احتياط أوراق المكوّنات قبل الورقة الحيّة: إعلاناتها الفيزيائية منطقيةٌ هنا (نهاية 6، وبداية 10 من اليمين)", "6px/0px/0px/10px",
        cs("plNeeds").marginLeft + "/" + cs("plNeeds").marginRight + "/" + cs("sscFm").marginLeft + "/" + cs("sscFm").marginRight);
  check("محاذاة الخلية السطرية: العربية إلى بدايتها والإنجليزية يسارًا", "start/left", cs("cellAr").textAlign + "/" + cs("cellEn").textAlign);

  // ٢) سقف الترطيب لكل نطاق
  var hy = await frame("hyd=1");
  var t0 = performance.now();
  while (hy.__dcl === null && performance.now() - t0 < 5000) await wait(50);
  var sinceDcl = function () { return hy.performance.now() - hy.__dcl; };
  while (sinceDcl() < 1300) await wait(50);
  var early = hy.document.getElementById("out").textContent;
  t0 = performance.now();
  while (hy.__tr === null && performance.now() - t0 < 6000) await wait(50);
  var at = hy.__tr === null ? -1 : Math.round(hy.__tr - hy.__dcl);
  check("★ سقف النطاق (2000) يحلّ محلّ العامّ (600): لا نصَّ عند 1300 مث، ويُفتح عند سقفه", "Settings/true",
        early + "/" + (at >= 1900 && at < 4500) + (at >= 1900 && at < 4500 ? "" : " (" + at + " مث)"));
  check("وبعد الفتح يُعرَّب النص", "الإعدادات", noBidi(hy.document.getElementById("out").textContent));

  // ٣) meta.skipSel
  var sk = await frame("skip=1");
  await wait(700);
  var SD = sk.document;
  check("★ أجوبة المساعد (#chat-content) لا تُعرَّب نصًّا ولا سمة، وما خارجها يُعرَّب", "Settings/Settings/Answer text/الإعدادات/اطرح سؤالًا...",
        [SD.getElementById("ans").textContent, SD.getElementById("ansBtn").getAttribute("aria-label"), SD.getElementById("ansOther").textContent,
         noBidi(SD.getElementById("out").textContent), noBidi(SD.querySelector("textarea").getAttribute("placeholder"))].join("/"));
  // هوية الحاصد والمحرّك بمستثنى النطاق (CMLShared.harvestSkip)
  var sig = function (k, kind) { return kind + "|" + k; };
  var hs = {}, chg = {};
  sk.__harvest.forEach(function (h) { hs[sig(h.key, h.kind)] = 1; });
  sk.__snap.forEach(function (x) {
    var now = x.node ? x.node.nodeValue : x.el.getAttribute(x.attr);
    if (now !== x.orig) chg[sig(x.orig.trim(), x.node ? "text" : "attr:" + x.attr)] = 1;
  });
  var onlyH = Object.keys(hs).filter(function (k) { return !chg[k]; }), onlyC = Object.keys(chg).filter(function (k) { return !hs[k]; });
  check("★ الحاصد والمحرّك متطابقان بمستثنى النطاق في الاتجاهين", "/", onlyH.join(" ، ") + "/" + onlyC.join(" ، "));
  check("والحاصد لا يقرأ من الأجوبة شيئًا", "false", sk.__harvest.some(function (h) { return h.key === "Answer text"; }));
  // ما يُضاف إلى الجواب لاحقًا (بثّ) لا يُعرَّب، وعنصرٌ مُعرَّب يُنقل إليه يعود أصله
  var np = SD.createElement("p"); np.textContent = "Settings"; SD.getElementById("chat-content").appendChild(np);
  var nb = SD.createElement("button"); nb.setAttribute("aria-label", "Settings"); SD.getElementById("chat-content").appendChild(nb);
  SD.getElementById("chat-content").appendChild(SD.getElementById("out"));
  await wait(900);
  check("★ ما يُبثّ في الجواب لا يُعرَّب، والمُعرَّب المنقول إليه يعود أصله", "Settings/Settings/Settings",
        np.textContent + "/" + nb.getAttribute("aria-label") + "/" + SD.getElementById("out").textContent);

  // ٤) الورقة الحيّة: <style> المضمَّنة في المتن بترتيب المستند
  var lv = await frame("live=1");
  await wait(900);
  var rq = lv.__reqs[0], sheets = rq ? rq.sheets : [];
  var inl = sheets.filter(function (x) { return !x.url; }).map(function (x) { return x.inline; }).join("\n");
  // ★ (مراجعتا القيود والمحرّك، ١٦ ربيع الآخر ١٤٤٨هـ) المضمَّنة بمحدِّد النطاق وحده (meta.liveInline — CSS الموقع الثابت):
  // ورقةُ الرأس بلا السمة (.pr3) وأوراق المكوّنات خارجها — فلا تتبدّل البصمة من صفحةٍ إلى صفحة
  check("الإطار يختار المضمَّنة بمحدِّد الجدول نفسه", "true", lv.CLAUDE_L10N.meta.liveInline === lv.CMLConst.domain("code").meta.liveInline);
  check("★ الورقة الحيّة تحمل CSS الموقع المضمَّن (style[data-custom-css-path]) بعد الروابط، لا ورقة رأسٍ أخرى ولا متغيّرات :root",
        "LLS/true/false/false",
        sheets.map(function (x) { return x.url ? "L" : "S"; }).join("") + "/" + (inl.indexOf(".zq-site{margin-left:7px}") >= 0) + "/" +
        (inl.indexOf(".pr3{") >= 0) + "/" + (inl.indexOf("--banner-height") >= 0));

  // ٦) اتجاه الكتل (dirSel) خارج المحادثة: مالكٌ بلا حرفٍ قويّ (مرساة العنوان) يرث اتجاه عنوانه المعرَّب لا auto=LTR
  var dr = await frame("dir=1");
  await wait(700);
  var DD = dr.document;
  check("★ مرساة العنوان (بلا حرفٍ قويّ) ترث اتجاه العنوان المعرَّب: لا dir عليها ومحسوبها rtl", "الإعدادات/rtl/null/rtl",
        noBidi(DD.getElementById("hdt").textContent) + "/" + DD.getElementById("hd").getAttribute("dir") + "/" +
        DD.getElementById("anc").getAttribute("dir") + "/" + dr.getComputedStyle(DD.getElementById("anc")).direction);
  // ★ (فحص الاتجاه ٤، ١٦ ربيع الآخر ١٤٤٨هـ) أجوبة المساعد في dirSel: الجواب الإنجليزي LTR بترقيمه لا RTL موروثًا، ونصُّه على
  // حاله (skipSel)؛ ونصٌّ يُبثّ في عقدةٍ قائمة من الجواب (يكبر حرفًا حرفًا) يُعاد حكم اتجاهه
  var AO = DD.getElementById("ansOther");
  check("★ جواب المساعد الإنجليزي LTR (اتجاهٌ لكل كتلة) ونصُّه لا يُمسّ", "ltr/Answer text", dr.getComputedStyle(AO).direction + "/" + AO.textContent);
  AO.firstChild.nodeValue = "Claude Code أداةٌ تعمل في الطرفية وتفهم المستودع كلّه وتنفّذ المهام";
  await wait(900);
  check("★ نصٌّ يُبثّ في عقدةٍ قائمة من الجواب يُعاد حكم اتجاهه (عربيٌّ بدأ باسمٍ لاتيني ⇒ RTL)", "rtl", dr.getComputedStyle(AO).direction);
  // ٧) وضع الكتلة: لافتةٌ بنسختين متطابقتين من نصّها (Mintlify يحفظ عرض الزرّ بنسخةٍ خفيّة) تُعرَّب كلّها،
  // وجملةٌ من عقدتين مختلفتين تبقى إنجليزيةً كلّها (لا خلط)
  var bd = await frame("body=1");
  await wait(800);
  var BD = bd.document, cps = BD.querySelectorAll("#cp span span");
  check("★ «Copy page» بنسختيه (الخفيّة والظاهرة) يُعرَّب كلّه، والجملة المختلطة تبقى إنجليزيةً كلّها", "نسخ الصفحة/نسخ الصفحة/Copy page and more",
        noBidi(cps[0].textContent) + "/" + noBidi(cps[1].textContent) + "/" + BD.getElementById("mix").textContent);
  // ٨) ورقة <style> يُدرجها الترطيب في المتن (أدوات Mintlify التفاعلية — قِيس في صفحة settings: تُدرَج لحظةَ إشارة الترطيب)
  // لا يراها مراقب الرأس، وتدخل الورقة الحيّة بمعاودة applyChrome عند فتح بوابة الترطيب
  var lh = await frame("live=1&hyd=1");
  await wait(900);
  // (ورقة CSS الموقع — بسمتها — تدخل؛ وورقةُ مكوّنٍ تفاعلي في المتن تدخل كذلك: خارجها كانت قواعد الورقة الحيّة المعاد بثّها
  // بخصوصيةٍ عالية تمحو حشوة أدواتها وحدودها — التحقق النهائي، ١٧ ربيع الآخر ١٤٤٨هـ؛ وورقةٌ في الرأس بلا السمة لا تدخل)
  var n0 = lh.__reqs.length, late = lh.document.createElement("style"), comp = lh.document.createElement("style");
  late.setAttribute("data-custom-css-path", "late.css");
  late.textContent = ".zq-late{margin-left:5px}";
  comp.textContent = ".zq-comp{margin-left:6px}";
  lh.document.getElementById("content").appendChild(late);
  lh.document.getElementById("content").appendChild(comp);
  await wait(3800);
  var lastReq = lh.__reqs[lh.__reqs.length - 1];
  check("★ <style> CSS الموقع تُدرَج في المتن قبل الترطيب تدخل الورقة الحيّة بعده، وورقةُ المكوّن في المتن تدخل معها", "true/true/true",
        (lh.__reqs.length > n0) + "/" + !!(lastReq && JSON.stringify(lastReq.sheets).indexOf(".zq-late{margin-left:5px}") >= 0) + "/" +
        lh.__reqs.some(function (q) { return JSON.stringify(q.sheets).indexOf("zq-comp") >= 0; }));
  // ٩) ★ (ر6-ب، ٢٩ ربيع الآخر ١٤٤٨هـ) حارس المتن المختلط — إطار guard=1 (العتبة 20٪؛ الصفحات A وB وC في _codeframe.html)
  var AR = new RegExp("[" + String.fromCharCode(0x0621) + "-" + String.fromCharCode(0x064A) + "]");
  var gd = await frame("guard=1");
  await wait(1000);
  var G = gd.document, GH = gd.location.pathname + gd.location.search;
  var gt = function (id) { var e = G.getElementById(id); return e ? noBidi(e.textContent).trim() : "(لا عنصر)"; };
  var gAr = function (pre, n) { var c = 0; for (var i = 1; i <= n; i++) if (AR.test(gt(pre + i))) c++; return c; };
  var gAttr = function () { return G.documentElement.getAttribute("data-cml-body") || "-"; };
  var gReqs = function () { return gd.__reqs.filter(function (m) { return m && m.type === "bodies"; }).length; };
  // (الكتل: العنوان «Settings» والخلية «Yes» يعرّبهما قاموس الواجهة، وسمة title «Settings» كذلك — فبقاؤها إنجليزيةً هو الحجب لا غياب القاموس)
  check("★ (ر6-ب) صفحةٌ حصّة كتلها غير المغطّاة 27٪ (3 من 11) والعتبة 20٪: محجوبة، والمتن إنجليزيٌّ كلّه (الفقرات التسع والعنوان والخلية وسمة title " +
        "ولو عرّبها قاموس الواجهة)، والواجهة خارج المتن عربية، وقد وصلت القطعة",
