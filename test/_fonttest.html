<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>font test</title>
<!--
  اختبار الخط العربي (DESIGN-fonts §٥.٤؛ S6-B): وحدة الخط cml-font.js والمحرّك engine.js الحقيقيان، وملفات الخطوط
  المحزومة الحقيقية تُقرأ بـ fetch من مجلد الإضافة وتُكتب نسخها base64 كما يكتبها عامل الخدمة.
  - أوجه «الموقع» مقلَّدة بـ local("Arial"), local("DejaVu Sans"), local("Liberation Sans") (وأخواتها للمذيَّل والأحادي)
    فيصحّ على ويندوز ولينكس، وبمدى U+0000-00FF كوجوه العلامة التي لا عربية فيها: فيُمتحن سقوط العربية إلى وجهنا.
  - كل سيناريو إطارٌ (_fontframe.html) بتخزينه وقاموسه، والوحدات فيه بترتيب المانيفست في <head> كأنها عند document_start.
  - والصفحة نفسها إطارٌ أعلى يُقلع المحرّك فيه بنسخةٍ تالفة: طلبُ إصلاحٍ واحدٌ بالضبط، ثم «يكتب العامل» فتظهر الأوجه.
  العقد: document.title = "fonttest N/N".
-->
<style>body{font-family:system-ui;padding:16px;max-width:1000px;margin:auto}
table{border-collapse:collapse;width:100%;margin-top:12px}
td,th{border:1px solid #ccc;padding:6px 8px;font-size:13px;text-align:right;vertical-align:top}
.ok{color:#127a2b;font-weight:700}.bad{color:#b00;font-weight:700}
#frames iframe{width:420px;height:220px;border:1px solid #999;display:inline-block;margin:4px}
@font-face{font-family:"anthropic-sans";src:local("Arial"),local("DejaVu Sans"),local("Liberation Sans");font-weight:300 800;font-style:normal;unicode-range:U+0000-00FF}
#tb{font-family:"anthropic-sans",system-ui}</style>
<h1>اختبار الخط العربي</h1>
<p><button id="tb">New chat</button></p>
<table id="tbl"><thead><tr><th>الحالة</th><th>المتوقَّع</th><th>الناتج</th><th></th></tr></thead><tbody></tbody></table>
<p id="notes"></p>
<div id="frames"></div>
<script>var jsErrors = 0; window.onerror = function () { jsErrors++; };</script>
<script src="_chrome-mock.js"></script>
<script>
// ── الإطار الأعلى: المحرّك يُقلع بنسخةٍ تالفة (بصمةٌ أخرى) فيطلب الإصلاح مرةً من الإطار الأعلى وحده ──
var TOP = { sent: [], onMsg: null };
var MOCK = makeChromeMock({ session: false });
Object.assign(MOCK.localStore, { cml_enabled: true, cml_rtl: true, cml_font_data: { id: "cairo", v: "0000000000000000", b64: "AAAA" } });
MOCK.chrome.runtime.sendMessage = function (msg, cb) { TOP.sent.push(msg && msg.type); if (cb) setTimeout(function () { cb(undefined); }, 0); };
MOCK.chrome.runtime.onMessage = { addListener: function (fn) { TOP.onMsg = fn; } };
window.chrome = MOCK.chrome;
var DICT = { "New chat": "محادثة جديدة", "Settings": "الإعدادات", "Projects": "المشاريع" };
window.CLAUDE_L10N = { domain: "app", meta: { scan: "none", live: false, chat: true, hydrate: "none", siteLang: true,
    fontFamilies: { "anthropic-sans": "ui", "anthropic-serif": "read", "anthropic-mono": "mono" } },
  default: "ar", langs: [{ code: "ar" }], dicts: { ar: { dir: "rtl", strings: DICT, patterns: [], plurals: {} } } };
</script>
<script src="../extension/cml-const.js"></script>
<script src="../extension/cml-shared.js"></script>
<script src="../extension/cml-rtl.js"></script>
<script src="../extension/cml-font.js"></script>
<script src="../extension/engine.js"></script>
<script>
var TOPF = window.CMLFont.last, TOP_BOOT = TOPF ? TOPF.stats() : null;
var C = CMLConst, SH = CMLShared;
var tb = document.querySelector("#tbl tbody"), pass = 0, total = 0;
function check(name, expect, got) {
  total++; var ok = String(expect) === String(got); if (ok) pass++;
  var tr = document.createElement("tr");
  [name, expect, got].forEach(function (v) { var td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
  var s = document.createElement("td"); s.className = ok ? "ok" : "bad"; s.textContent = ok ? "✓" : "✗"; tr.appendChild(s);
  tb.appendChild(tr);
  document.title = "fonttest " + pass + "/" + total + " …";
}
function note(t) { var n = document.getElementById("notes"); n.appendChild(document.createTextNode(t)); n.appendChild(document.createElement("br")); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function until(pred, ms) {
  var t0 = Date.now();
  return new Promise(function (res) {
    (function tick() {
      var v = false; try { v = pred(); } catch (e) {}
      if (v || Date.now() - t0 > (ms || 5000)) { res(v); return; }
      setTimeout(tick, 30);
    })();
  });
}
function frames2(win) { return new Promise(function (r) { win.requestAnimationFrame(function () { win.requestAnimationFrame(function () { r(); }); }); }); }
// المدى بصيغةٍ واحدة: المتصفح يكتبه بلا أصفار بادئة (U+600-6FF) والفهرس بها (U+0600-06FF)
function normRange(s) {
  return String(s || "").split(",").map(function (p) {
    p = p.trim().toUpperCase().replace(/^U\+/, "");
    var ab = p.split("-"), a = parseInt(ab[0], 16), b = ab.length > 1 ? parseInt(ab[1], 16) : a;
    return a.toString(16) + "-" + b.toString(16);
  }).join(",");
}
var AR = normRange(C.FONT_AR_RANGE);
function arFaces(win) { var out = []; win.document.fonts.forEach(function (f) { if (normRange(f.unicodeRange) === AR) out.push(f); }); return out; }
function famsOf(list) { return list.map(function (f) { return SH.normFamily(f.family); }).sort().join(","); }
function med(a) { a = a.slice().sort(function (x, y) { return x - y; }); return a[Math.floor(a.length / 2)]; }

// ── الخطوط المحزومة الحقيقية ونسخها كما يكتبها عامل الخدمة ──
var FDATA = {};
function entryOf(id) { return C.FONTS.filter(function (e) { return e.id === id; })[0]; }
function loadFonts() {
  return Promise.all(C.FONTS.map(function (e) {
    return fetch("../extension/" + e.file).then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
      FDATA[e.id] = { id: e.id, v: e.sha, b64: SH.bufToB64(buf) };
    });
  }));
}

// ── السيناريوهات: إطارٌ بتخزينه ونطاقه ──
var LOCAL_SANS = 'local("Arial"),local("DejaVu Sans"),local("Liberation Sans")';
var LOCAL_SERIF = 'local("Times New Roman"),local("DejaVu Serif"),local("Liberation Serif")';
var LOCAL_MONO = 'local("Courier New"),local("DejaVu Sans Mono"),local("Liberation Mono")';
function face(fam, srcs, more) { return '@font-face{font-family:' + fam + ';src:' + srcs + ';unicode-range:U+0000-00FF;' + (more || "") + '}'; }
var APP_CSS = '<style>' +
  face('"anthropic-sans"', LOCAL_SANS, 'font-weight:300 800;font-style:normal') +
  face('"anthropic-sans"', LOCAL_SANS, 'font-weight:300 800;font-style:italic') +
  face('"anthropic-serif"', LOCAL_SERIF, 'font-weight:300 800;font-style:normal') +
  face('"anthropic-serif"', LOCAL_SERIF, 'font-weight:300 800;font-style:italic') +
  face('"anthropic-mono"', LOCAL_MONO, 'font-weight:300 800') +
  face('"Anthropicons"', LOCAL_SANS) + face('"KaTeX_Main"', LOCAL_SERIF) +
  face('"anthropic-sans Fallback"', LOCAL_SANS, 'size-adjust:103%') +
  ':root{--font-ui:"anthropic-sans", system-ui, sans-serif}body{font-family:var(--font-ui)}' +
  '.serif{font-family:"anthropic-serif",serif}.mono{font-family:"anthropic-mono",monospace}</style>';
var APP_BODY = '<button id="b1">New chat</button> <div id="d1">Settings</div> <p class="serif" id="s1">Projects</p>';
var CFGS = {}, ENV = {}, seq = 0;
window.__fsetup = function (win) {
  var n = new URL(win.location.href).searchParams.get("n");
  var cfg = CFGS[n], env = ENV[n];
  var mock = makeChromeMock({ session: false });
  Object.assign(mock.localStore, { cml_enabled: true, cml_rtl: cfg.rtl !== false }, cfg.seed || {});
  env.win = win; env.mock = mock; env.sent = []; env.fetches = 0;
  mock.chrome.runtime.sendMessage = function (msg, cb) { env.sent.push(msg && msg.type); if (cb) setTimeout(function () { cb(undefined); }, 0); };
  mock.chrome.runtime.onMessage = { addListener: function (fn) { env.onMsg = fn; } };
  win.chrome = mock.chrome;
  var d = cfg.domain || "app";
  var meta = Object.assign({}, C.domain(d).meta, { live: false, scan: "none" }, cfg.meta || {});
  win.CLAUDE_L10N = { domain: d, meta: meta, default: "ar", langs: [{ code: "ar" }, { code: "xx" }],
    dicts: { ar: { dir: "rtl", strings: DICT, patterns: [], plurals: {} }, xx: { dir: "ltr", strings: {}, patterns: [], plurals: {} } } };
  var rf = win.fetch;
  win.fetch = function () { env.fetches++; return rf.apply(win, arguments); };
  win.addEventListener("error", function () { jsErrors++; });
  var after = cfg.afterEngine;
  cfg.afterEngine = function (w) { env.F = w.CMLFont && w.CMLFont.last; env.boot = env.F ? env.F.stats() : null; env.bootAr = arFaces(w); if (after) after(w); };
  return cfg;
};
var FETCHES = 0;
function frame(cfg, path) {
  var n = "f" + (++seq);
  CFGS[n] = cfg; ENV[n] = { name: n };
  var ifr = document.createElement("iframe");
  ifr.src = (path || "_fontframe.html") + "?n=" + n;
  document.getElementById("frames").appendChild(ifr);
  var env = ENV[n];
  env.el = ifr;
  env.done = function () { FETCHES += env.fetches; try { ifr.remove(); } catch (e) {} };
  return until(function () { return env.win && env.win.document.readyState === "complete" && env.F; }, 15000).then(function () { return env; });
}
function set(env, obj) { env.mock.chrome.storage.local.set(obj); }
function stats(env) { return env.F.stats(); }
function settled(env) { return until(function () { var s = stats(env); return s.pending === 0 && s.tier >= 1; }, 5000); }

(async function () {
  try {
    await loadFonts();
    var CAIRO = entryOf("cairo"), NASKH = entryOf("noto-naskh-arabic"), MARK = entryOf("markazi-text");

    // ══ ١ (★) الإقلاع: وجه الإقلاع وحده، ثم المنتظم للقراءة والشيفرة، بواصفات الموقع حرفًا ومدًى عربي ══
    var E = await frame({ headEarly: APP_CSS, body: APP_BODY, seed: { cml_font_data: FDATA.cairo } });
    // «الإقلاع» نداء sync الأول في استدعاء loadSettings قبل endBoot (الوحدة تسجّل ما بنته فيه)؛ وأول نداءٍ لمراقب الترجمة
    // بعده بلحظة يرفع الدرجة، فالأطر هنا لا تُقرأ إلا بعده
    var bootFam = arFaces(E.win).filter(function (f) { return SH.normFamily(f.family) === "anthropic-sans" && f.style === "normal"; }).length;
    check("★ ١ في الإقلاع وجه الإقلاع وحده: الدلو المنتظم للدور ui", "1/1", E.boot.bootFaces + "/" + bootFam);
    await settled(E);
    check("★ ١ ثم الدلاء المنتظمة للقراءة والشيفرة عند أول check أو في الإطار التالي", "3/3/anthropic-mono,anthropic-sans,anthropic-serif",
      stats(E).faces + "/" + stats(E).families + "/" + famsOf(arFaces(E.win)));
    var siteFaces = []; E.win.document.fonts.forEach(function (f) { if (normRange(f.unicodeRange) !== AR) siteFaces.push(f); });
    var copied = arFaces(E.win).every(function (f) {
      return siteFaces.some(function (s) { return SH.normFamily(s.family) === SH.normFamily(f.family) && s.weight === f.weight && s.style === f.style && s.stretch === f.stretch; });
    });
    check("★ ١ weight/style/stretch منسوخةٌ من وجه الموقع حرفًا، والمدى هو FONT_AR_RANGE", "true/true",
      copied + "/" + arFaces(E.win).every(function (f) { return normRange(f.unicodeRange) === AR; }));
    check("★ السمة data-cml-font على <html> ما دام لنا وجه", "true", E.win.document.documentElement.hasAttribute(C.FONT_ATTR));
    // ٢ لا وجه لعائلةٍ خارج القائمة
    check("★ ٢ لا وجه للأيقونات ولا KaTeX ولا «… Fallback»", "true",
      arFaces(E.win).every(function (f) { return ["anthropic-sans", "anthropic-serif", "anthropic-mono"].indexOf(SH.normFamily(f.family)) >= 0; }));
    // ١٤ الواصفات المترية بحسب الدور، وصندوق العلامة بالبناء
    var roleOf = { "anthropic-sans": "ui", "anthropic-serif": "read", "anthropic-mono": "mono" };
    var metricsOk = arFaces(E.win).every(function (f) {
      var d = SH.fontFaceDesc(CAIRO, roleOf[SH.normFamily(f.family)]);
      return f.sizeAdjust === d.sizeAdjust && f.ascentOverride === d.ascentOverride && f.descentOverride === d.descentOverride && f.lineGapOverride === d.lineGapOverride;
    });
    var box = ["ui", "read"].every(function (r) { var m = CAIRO.m[r]; return Math.abs(m.a * m.s - 0.9925) <= 0.005 && Math.abs(m.d * m.s - 0.2575) <= 0.005; });
    check("١٤ الواصفات المترية تساوي الفهرس بحسب الدور (read غير ui)، وa×s وd×s صندوق العلامة", "true/true/true",
      metricsOk + "/" + (SH.fontFaceDesc(CAIRO, "read").ascentOverride !== SH.fontFaceDesc(CAIRO, "ui").ascentOverride) + "/" + box);
    // ١٥ لا عنصر يُضاف، ولا سمة إلا data-cml-font على <html>
    check("★ ١٥ الوحدة لا تضيف <style> ولا <link>، ولا سمة إلا data-cml-font على <html> وحده", "1/1/true",
      E.win.document.querySelectorAll("style,link").length + "/" + E.win.document.querySelectorAll("[" + C.FONT_ATTR + "]").length + "/" +
      (E.win.document.querySelector("[" + C.FONT_ATTR + "]") === E.win.document.documentElement));
    // ١٩ البلوغ: ok بعد أن كتب المحرّك ترجمته
    var reachOk = stats(E).reach;
    // ١١ الدلاء غير المنتظمة عند الاستعمال وحده، و١٠ المائل يُعلَن italic ويطابق رسمُه القائمَ بكسلًا بكسلًا
    var italBefore = arFaces(E.win).some(function (f) { return f.style === "italic"; });
    await E.win.document.fonts.load("italic 16px anthropic-sans", "A");
    await until(function () { return arFaces(E.win).some(function (f) { return f.style === "italic"; }); }, 3000);
    var italAfter = arFaces(E.win).some(function (f) { return f.style === "italic" && SH.normFamily(f.family) === "anthropic-sans"; });
    check("١١ الدلاء غير المنتظمة لا تُعكس إلا بعد أن يصير وجه الموقع loading", "false/true", italBefore + "/" + italAfter);
    function ink(win, font) {
      var c = win.document.createElement("canvas"); c.width = 360; c.height = 48;
      var x = c.getContext("2d"); x.font = font; x.fillStyle = "#000"; x.fillText("محادثة جديدة · الإعدادات", 4, 34);
      return Array.prototype.join.call(x.getImageData(0, 0, 360, 48).data, "");
    }
    await sleep(50);
    var inkN = ink(E.win, "normal 400 24px anthropic-sans"), inkI = ink(E.win, "italic 400 24px anthropic-sans");
    check("١٠ الدلو المائل يُعكس italic، والعربية فيه ترسم كالقائمة بكسلًا بكسلًا (لا ميل مصطنع)", "true/true",
      arFaces(E.win).some(function (f) { return f.style === "italic"; }) + "/" + (inkN === inkI && inkN.length > 0));
    // ٤ (★) لكل خط: العرض غير خط النظام، والوزن متغيّر (700 ≠ 400، و500 بينهما)
    function arWidth(win, w, fam) {
      var s = win.document.createElement("span");
      s.style.cssText = "font:" + w + " 22px " + fam + ";white-space:nowrap";
      s.textContent = "محادثة جديدة والإعدادات والمشاريع";
      win.document.body.appendChild(s);
      var r = s.getBoundingClientRect().width; s.remove(); return r;
    }
    for (var fi = 0; fi < C.FONTS.length; fi++) {
      var fe = C.FONTS[fi];
      if (stats(E).id !== fe.id) {
        var w1 = {}; w1.cml_font = fe.id; w1.cml_font_data = FDATA[fe.id];
        set(E, w1);
        await until(function () { return stats(E).id === fe.id && stats(E).pending === 0; }, 4000);
        await frames2(E.win);
      }
      var sys = arWidth(E.win, 400, "sans-serif"), a4 = arWidth(E.win, 400, "anthropic-sans"), a5 = arWidth(E.win, 500, "anthropic-sans"), a7 = arWidth(E.win, 700, "anthropic-sans");
      check("★ ٤ " + fe.family + ": العربية بوجهنا لا بخط النظام، ومحور الوزن يعمل (700 ≠ 400، و500 بينهما)", "true/true/true",
        (Math.abs(sys - a4) > 0.5) + "/" + (Math.abs(a7 - a4) > 0.5) + "/" + (Math.min(a4, a7) <= a5 && a5 <= Math.max(a4, a7)));
    }
    var eCompact = stats(E).compact;
    // lostVars: محوُ السمة يعيده watchHtml
    E.win.document.documentElement.removeAttribute(C.FONT_ATTR);
    await sleep(60);
    check("watchHtml يعيد data-cml-font إن محاه الموقع (F.lostVars)", "true", E.win.document.documentElement.hasAttribute(C.FONT_ATTR));
    // ١٦ (★) document.fonts.clear() من الصفحة: يُعاد عند المحفِّز التالي فقط، ولا حلقة
    var nBefore = arFaces(E.win).length, p0 = stats(E).passes;
    E.win.document.fonts.clear();
    var afterClear = arFaces(E.win).length;
    await sleep(80);
    var stillGone = arFaces(E.win).length;
    E.win.document.body.appendChild(E.win.document.createElement("i")); // محفِّزٌ طبيعي: طفرةٌ يراها مراقب الترجمة
    await until(function () { return arFaces(E.win).length === nBefore; }, 2000);
    await sleep(300);
    check("★ ١٦ document.fonts.clear() من الصفحة: لا إعادة إلا عند المحفِّز التالي، وتمريراتٌ محدودة", "0/0/true/true",
      afterClear + "/" + stillGone + "/" + (arFaces(E.win).length === nBefore) + "/" + (stats(E).passes - p0 <= 3));
    E.done();

    // ══ ١٩ البلوغ none: قاعدة :root:lang(ar) من الموقع تحذف العائلة من متغيّرها ══
    var EL = await frame({ seed: { cml_font_data: FDATA.cairo }, headEarly: '<style>' + face('"anthropic-sans"', LOCAL_SANS, 'font-weight:300 800') +
      ':root{--font-ui:"anthropic-sans", system-ui, sans-serif}:root:lang(ar){--font-ui:system-ui, sans-serif}button,div{font-family:var(--font-ui)}</style>',
      body: APP_BODY });
    await settled(EL);
    var reachNone = stats(EL).reach;
    set(EL, { cml_font: C.FONT_SITE });
    var reachSite = stats(EL).reach;
    set(EL, { cml_font: "cairo" });
    set(EL, { cml_enabled: false });
    var reachOff = stats(EL).reach;
    EL.done();
    // err: نسخةٌ سليمة الطول والترويسة والبصمة، فاسدة الجسم ⇒ فشل التحليل
    var junk = new Uint8Array(CAIRO.bytes); junk.set([0x77, 0x4f, 0x46, 0x32]);
    for (var ji = 4; ji < junk.length; ji++) junk[ji] = (ji * 7) & 255;
    var EE = await frame({ headEarly: APP_CSS, body: APP_BODY, seed: { cml_font_data: { id: "cairo", v: CAIRO.sha, b64: SH.bufToB64(junk.buffer) } } });
    await sleep(100);
    check("★ ١٩ البلوغ: ok بأوجهنا، وnone بقاعدة :lang(ar) تحذف العائلة، وoff مع «خط الموقع» والإطفاء، وerr عند فشل التحليل",
      "ok/none/off/off/err", reachOk + "/" + reachNone + "/" + reachSite + "/" + reachOff + "/" + stats(EE).reach);
    check("وفشل التحليل لا يترك وجهًا ولا سمة، ولا يُعاد", "0/false/0",
      stats(EE).faces + "/" + EE.win.document.documentElement.hasAttribute(C.FONT_ATTR) + "/" + arFaces(EE.win).length);
    EE.done();

    // ══ ٢ لاسمٍ في القائمة لم تعلنه الصفحة لا وجه، وFONT_MONO=false يُسقط دور mono ══
    var ED = await frame({ domain: "docs", meta: { routes: null, hydrate: "none" }, seed: { cml_font_data: FDATA.cairo },
      headEarly: '<style>' + face("anthropicSans", LOCAL_SANS, 'font-weight:300 800') + '</style>', body: APP_BODY });
    await settled(ED);
    check("★ ٢ عائلاتٌ في القائمة لم يعلنها الموقع (anthropicSerif وanthropicMono) بلا وجه", "1/anthropicsans",
      stats(ED).faces + "/" + famsOf(arFaces(ED.win)));
    ED.done();
    var EM = await frame({ headEarly: APP_CSS, body: APP_BODY, seed: { cml_font_data: FDATA.cairo }, afterConst: function (w) { w.CMLConst.FONT_MONO = false; } });
    await settled(EM);

         " (العرض، والارتفاع، و1ch، و1ex)");
    check("★ ٣ بعد تحميل وجه الموقع: عرض السطر الإنجليزي وارتفاعه تحت normal و1ch و1ex لا تتغيّر بأوجهنا", "true/true/true",
      (mOn.faces > 0 && mOff.faces === 0) + "/" + (k4(mOn.post) === k4(mOff.post)) + "/" + (k4(mOn.sansPost) === k4(mOff.sansPost) && k4(mOn.sansPre) === k4(mOff.sansPre)));
    check("★ ٣ قبل تحميله: العرض لا يتغيّر، وصندوق السطر صندوق العلامة نفسه فلا قفزة عند التحميل (a×s = B.asc)", "true/true/true",
      (mOn.pre.w === mOff.pre.w) + "/" + (mOn.pre.h === mOff.pre.h) + "/" + (mOn.pre.h === mOn.post.h));

    // ══ ١٧ الميزانية: الإقلاع (فكٌّ ووجه الإقلاع) ≤ 10 + 0.15 × KiB (وسيط 5)، ولا مهمة فوق 50 مث، و24 دلوًا على مهامّ ══
    var benchCss = '<style>' + face('"anthropic-sans"', LOCAL_SANS, 'font-weight:300 800') +
      Array.apply(null, Array(24)).map(function (x, i) { return face('"Anthropic Sans"', LOCAL_SANS, "font-weight:" + (100 + i * 12) + " " + (400 + i * 20)); }).join("") + '</style>';
    var EBn = await frame({ headEarly: benchCss, body: '<p>x</p>', seed: { cml_font: C.FONT_SITE } });
    var BW = EBn.win;
    for (var bi = 0; bi < C.FONTS.length; bi++) {
      var be = C.FONTS[bi], times = [];
      for (var run = 0; run < 7; run++) {
        var inst = BW.CMLFont.create({ families: { "anthropic-sans": "ui" }, range: C.FONT_AR_RANGE, attr: "data-zz-bench", ctx: null });
        var t0 = BW.performance.now();
        inst.sync(true, be, FDATA[be.id].b64);
        var dt = BW.performance.now() - t0;
        if (inst.stats().faces !== 1) dt = 1e9;
        inst.clear();
        if (run >= 2) times.push(dt); // إحماءان ثم خمسة
      }
      var budget = 10 + 0.15 * (be.bytes / 1024);
      note("١٧ " + be.family + ": إقلاعٌ وسيطه " + med(times).toFixed(1) + " مث، والميزانية " + budget.toFixed(1));
      check("١٧ ميزانية الإقلاع لـ" + be.family + " (فكٌّ ووجه الإقلاع، وسيط 5) ≤ 10 + 0.15 × KiB", "true", med(times) <= budget);
    }
    var big = BW.CMLFont.create({ families: { "Anthropic Sans": "ui" }, range: C.FONT_AR_RANGE, attr: "data-zz-bench", ctx: null });
    var tb0 = BW.performance.now();
    big.sync(true, NASKH, FDATA["noto-naskh-arabic"].b64);
    await until(function () { return big.stats().pending === 0; }, 8000);
    var bs = big.stats();
    note("١٧ أربعةٌ وعشرون دلوًا بـNoto Naskh Arabic: " + bs.faces + " وجهًا في " + bs.tasks + " مهامّ، أطولها " + bs.maxTask + " مث، والمجموع " + (BW.performance.now() - tb0).toFixed(0) + " مث");
    check("١٧ أربعةٌ وعشرون دلوًا تُبنى على مهامّ متعددة، ولا مهمة للخط تتجاوز 50 مث", "24/true/true", bs.faces + "/" + (bs.tasks > 1) + "/" + (bs.maxTask <= 50));
    big.clear();
    EBn.done();

    // ══ ١٨ (★) تطبيع الأسماء (م٣) ══
    var nf = SH.normFamily;
    check("★ ١٨ normFamily يطابق المنصَّص وغير المنصَّص والمهروب وما يعيده FontFace.family", "true/true/true/true/true",
      (nf("anthropic-sans") === nf('"anthropic-sans"')) + "/" + (nf("'Tiempos Text Regular'") === "tiempos text regular") + "/" +
      (nf('"Atkinson Hyperlegible Next"') === nf("Atkinson  Hyperlegible Next")) + "/" + (nf('"A\\"B"') === 'a"b') + "/" +
      (function () { var ok = false; document.fonts.forEach(function (f) { if (nf(f.family) === "anthropic-sans") ok = true; }); return ok; })());

    // ══ ٨ (★) الإطار الأعلى: طلب إصلاحٍ واحدٌ بالضبط، ثم «يكتب العامل» فتظهر الأوجه بلا إعادة تحميل ══
    check("★ ٨ الإطار الأعلى بنسخةٍ تالفة في الإقلاع: صفر أوجه، وfont-ensure واحدةٌ بالضبط", "0/1",
      (TOP_BOOT ? TOP_BOOT.faces : "?") + "/" + TOP.sent.filter(function (t) { return t === "font-ensure"; }).length);
    MOCK.chrome.storage.local.set({ cml_font_data: FDATA.cairo });
    await until(function () { return TOPF.stats().faces > 0; }, 3000);
    check("★ ٨ ثم يكتب العامل النسخة فتظهر الأوجه بلا إعادة تحميل، ولا طلب ثانٍ", "true/1",
      (TOPF.stats().faces > 0) + "/" + TOP.sent.filter(function (t) { return t === "font-ensure"; }).length);
    var hello = await new Promise(function (r) { TOP.onMsg({ type: "cml-hello" }, {}, r); });
    check("★ ١٩ حقل font في ردّ cml-hello (للبطاقة والنافذة)", "ok/cairo", hello && hello.font && (hello.font.reach + "/" + hello.font.id));
    MOCK.chrome.storage.local.set({ cml_font: "markazi-text" });
    await sleep(50);
    MOCK.chrome.storage.local.set({ cml_font_data: FDATA["markazi-text"] });
    await until(function () { return TOPF.stats().id === "markazi-text"; }, 3000);
    check("★ ٧ ولا font-ensure في التبديل الحيّ من الإطار الأعلى أيضًا", "markazi-text/1",
      TOPF.stats().id + "/" + TOP.sent.filter(function (t) { return t === "font-ensure"; }).length);

    // ══ ث٣ لا طلب شبكيًّا من الوحدة ولا من المحرّك في الأطر ══
    check("ث٣ لا fetch في أيٍّ من الأطر (الخط من التخزين وحده)", "0", FETCHES);
    check("لا أخطاء JS غير ملتقطة", "0", jsErrors);
  } catch (e) {
    check("استثناء في الاختبار", "", String(e && (e.stack || e.message) || e).slice(0, 500));
  }
  document.title = "fonttest " + pass + "/" + total;
  var h = document.createElement("p");
  h.className = pass === total ? "ok" : "bad";
  h.textContent = "FONTTEST: " + pass + "/" + total + (pass === total ? " — all pass" : " — FAIL");
  document.body.appendChild(h);
})();
</script>
