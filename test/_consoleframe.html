  كتابة ‎<html lang="en">‎ بعد كل تنقّل (go وrgo) في مهمةٍ لاحقة، كما قِيس على الموقع الحيّ عند العودة من اللوحة إلى الوثائق (مراجعة ر20-أ).

var ZQ_MAIL = "zq-member" + String.fromCharCode(64) + "example.invalid";

          '<span id="bctl">Default</span>' }
};
// جاسوس القراءة (نموذج _blockprotspytest و_drafttest): كل getter نصّي على عقد محتوى المستخدم أو على سلفٍ يحويها، ومجال Range — في وضع uc وحده
var SENT = new Set(), SPY_ON = false, HITS = {};
var PROT_IDS = ["kname", "kst", "wp", "wu", "wo", "mname", "mmail", "mcount", "bbal", "bkpi", "bvar", "binv"];
function hit(where, t) {
  if (!SPY_ON) return;
  var ok = false;
  if (t && t.nodeType === 3) ok = SENT.has(t);
  else if (t && t.contains) SENT.forEach(function (s) { if (!ok && t !== s && t.contains(s)) ok = true; });
  if (ok) HITS[where] = (HITS[where] || 0) + 1;
}
if (MODE === "uc" || SHIP || SPY_Q) {
  [[Node.prototype, "nodeValue"], [CharacterData.prototype, "data"], [Node.prototype, "textContent"], [HTMLElement.prototype, "innerText"],
   [Element.prototype, "innerHTML"], [Element.prototype, "outerHTML"], [Text.prototype, "wholeText"], [HTMLElement.prototype, "outerText"]].forEach(function (x) {
    var d = Object.getOwnPropertyDescriptor(x[0], x[1]); if (!d || !d.get) return;
    Object.defineProperty(x[0], x[1], { configurable: true, enumerable: d.enumerable, get: function () { hit(x[1], this); return d.get.call(this); }, set: d.set });
  });
  var RTS = Range.prototype.toString;
  Range.prototype.toString = function () { var self = this; try { SENT.forEach(function (s) { if (self.intersectsNode(s)) hit("range", s); }); } catch (e) {} return RTS.call(this); };
}
function collect() {
  SENT.clear();
  PROT_IDS.forEach(function (id) {
    var e = document.getElementById(id); if (!e) return;
    var w = document.createTreeWalker(e, NodeFilter.SHOW_TEXT), t; while ((t = w.nextNode())) SENT.add(t);
  });
}
window.spy = function () { return JSON.stringify(HITS) === "{}" ? "0" : JSON.stringify(HITS); };
// قراءة الاختبار نفسه بلا جاسوس: يُطفأ حولها
function quiet(fn) { var s = SPY_ON; SPY_ON = false; try { return fn(); } finally { SPY_ON = s; } }
function paint(v) { var app = document.getElementById("app"); quiet(function () { app.innerHTML = VIEWS[v].html; }); document.title = VIEWS[v].title; collect(); }
var START = MODE === "boot" ? "keys" : MODE === "uc" ? "keys" : "intro";
paint(START);
history.replaceState({}, "", VIEWS[START].path);
var FONTS0 = document.fonts ? document.fonts.size : 0;
// تنقّلٌ بطريقة Next.js: pushState ثم تبديل المحتوى في المهمة نفسها (المراقب يرى العنوان الجديد مع الدفعة)
window.go = function (v) { history.pushState({}, "", VIEWS[v].path); paint(v); siteLang(); };
// (ر20-ج) replaceState، وpopstate يعيد رسم محطة المسار (كما يفعل الموقع)، والموقع يعيد كتابة lang بعد التنقّل (sitelang=1)

if (SHIP || POP_Q) window.addEventListener("popstate", function () {

  if (v) paint(v);
});
window.hello = function () { var r = null; if (HELLO) HELLO({ type: "cml-hello" }, {}, function (x) { r = x; }); return r; };
// الأثر كلّه: سمات <html>، وكل سمةٍ «data-cml…» على أي عنصر، وورقتنا الحيّة، وعلامات الاتجاه في النصوص، وسمة lang على غير <html>، والخطوط
window.trace = function () { return quiet(traceNow); };
function traceNow() {
  var H = document.documentElement, marks = 0, bidi = 0, langs = 0, all = document.getElementsByTagName("*");
  for (var i = 0; i < all.length; i++) {
    var a = all[i].attributes;
    for (var j = 0; j < a.length; j++) if (a[j].name.indexOf("data-cml") === 0) marks++;
    if (all[i] !== H && all[i].hasAttribute("lang")) langs++;

  var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), t, BIDI = new RegExp("[" + String.fromCharCode(0x200e, 0x200f, 0x061c) + String.fromCharCode(0x202a) + "-" +
    String.fromCharCode(0x202e) + String.fromCharCode(0x2066) + "-" + String.fromCharCode(0x2069) + "]");
  while ((t = w.nextNode())) if (BIDI.test(t.data)) bidi++;

}
