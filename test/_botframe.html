<!--
  إطار اختبارٍ لصفحة _bottest.html (ر29-د) — ليس صفحة اختبارٍ بنفسه. صفحةٌ تُبنى من علامات صفحة التحقق وحدها (لا نصَّ منسوخًا من موقع):
    m=src   سكربت منسِّق صفحة التحدّي (‎/cdn-cgi/challenge-platform/h/<x>/orchestrate/chl_page/v1‎)
    m=opt   كائن خيارات صفحة التحدّي في سكربتٍ مضمَّن (‎window._cf_chl_opt = {…}‎)
    m=form  نموذج صفحة التحدّي القديم (‎form#challenge-form‎ بعلامة رمزه في action)
    m=bare  ★ (ر29-د2، مراجعة ر29-د F5 RV6) نموذجٌ بالمعرّف نفسه بلا علامة الرمز في action — صفحةٌ حقيقية، فلا تُعدّ صفحة تحقق
    m=neg   صفحةٌ حقيقية فيها ما يُحقن في الصفحات الحقيقية: سكربت الكشف (‎/cdn-cgi/challenge-platform/scripts/jsd/main.js‎) وأداة Turnstile
            في نموذجٍ (‎div.cf-turnstile‎ وسكربتها) — فلا تُعدّ صفحة تحقق
  والسكربتات بنوعٍ غير منفَّذ (type="text/x-zq") فلا يُجلب شيء: الكشف بعنوان السكربت ونصّه لا بتنفيذه.
-->
<script>var jsErr = 0; window.onerror = function () { jsErr++; };</script>
<script>
(function () {

  var w = function (h) { document.write(h); };
  if (m === "src") w('<script type="text/x-zq" src="/cdn-cgi/challenge-platform/h/b/orchestrate/chl_page/v1?ray=zq0"><\/script>');
  // الاسم مقسومٌ هنا لئلا يكون هذا السكربت نفسه علامةً في الإطارات الأخرى
  if (m === "opt") w('<script type="text/x-zq">(function(){window.' + "_cf_chl" + '_opt = {cvId: "3", cZone: "zq.invalid", cType: "managed"};})();<\/script>');
  if (m === "form") w('<form id="challenge-form" action="/legal/privacy?__cf_chl_f_tk=zq0" method="POST"><input type="hidden" name="md" value="zq"></form>');
  if (m === "bare") w('<form id="challenge-form" action="/legal/privacy?zq=1" method="POST"><input type="hidden" name="md" value="zq"></form>');
  if (m === "neg") {
    w('<script type="text/x-zq">(function(){var a=document.createElement("script");a.src="/cdn-cgi/challenge-platform/scripts/jsd/main.js";})();<\/script>');
    w('<script type="text/x-zq" src="/cdn-cgi/challenge-platform/scripts/jsd/main.js"><\/script>');
    w('<script type="text/x-zq" src="https://challenges.cloudflare.com/turnstile/v0/api.js"><\/script>');
    w('<form id="login"><div class="cf-turnstile" data-sitekey="zq0"></div><button type="submit">Settings</button></form>');
  }
})();
</script>
