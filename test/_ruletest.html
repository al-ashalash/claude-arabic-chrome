<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>rule generator test</title>
  <style>
    body { font-family:"Segoe UI",Tahoma,sans-serif; padding:24px; background:#faf9f7; color:#1a1a19; }
    table { border-collapse:collapse; width:100%; max-width:900px; font-size:13px; }
    td,th { border:1px solid #e3e1dc; padding:6px 8px; text-align:start; }
    th { background:#f1efe9; }
    .ok { color:#2e7d32; font-weight:bold; }
    .bad { color:#b3261e; font-weight:bold; }
    code { background:#efeee9; padding:1px 4px; border-radius:4px; direction:ltr; display:inline-block; }
    h2 { font-size:16px; }
  </style>
</head>
<body>
  <h1 style="font-size:19px">اختبار مولّد القواعد الذكية</h1>
  <p>يتحقق من <code>makePattern</code> في options.js: التوليد الصحيح، و<b>حارس الأمان</b> الذي يمنع
     قاعدةً تبتلع نصوص الصفحة كلها.</p>
  <div id="out" style="font-weight:bold;margin:12px 0"></div>
  <table id="tbl"><thead><tr><th>الحالة</th><th>الإنجليزي</th><th>العربي</th><th>المتوقع</th><th>النتيجة</th></tr></thead><tbody></tbody></table>

<!-- ★ الاختبار يفحص النسخة الحقيقية من cml-shared.js — لا نسخة طبق الأصل.
     كانت هنا نسخة يدوية انحرفت فعلاً عن الأصل في ترتيب الحُرّاس (متكافئتين سلوكيًا
     مصادفةً)، فكان الاختبار يفحص دالة غير التي تعمل عند المستخدم. أُميتت عمدًا. -->
<script src="../extension/cml-shared.js"></script>
<script>
var makePattern = CMLShared.makePattern;

// ===== الحالات =====
var cases = [
  // --- يجب أن تُقبل وتعمل ---
  { name: "متغيّر واحد", en: "Delete {count} chats?", ar: "حذف {count} محادثة؟",
    accept: true, sample: "Delete 12 chats?", expect: "حذف 12 محادثة؟" },
  { name: "متغيّران بالترتيب", en: "Moved {file} to {folder}", ar: "نُقل {file} إلى {folder}",
    accept: true, sample: "Moved a.txt to Docs", expect: "نُقل a.txt إلى Docs" },
  { name: "متغيّر في البداية ونصّ ثابت في النهاية", en: "{count} files selected", ar: "حُدّد {count} ملفًّا",
    accept: true, sample: "7 files selected", expect: "حُدّد 7 ملفًّا" },
  { name: "ترتيب معكوس في العربية (مرساة في الطرفين)", en: "User {user} shared {doc} now", ar: "شارك {doc} من {user} الآن",
    accept: true, sample: "User Sara shared plan.pdf now", expect: "شارك plan.pdf من Sara الآن" },
  { name: "رموز تحتاج هروبًا (؟ . +)", en: "Really delete {n} items? (+1 more)", ar: "أتحذف {n} عنصرًا فعلًا؟ (+1 غيرها)",
    accept: true, sample: "Really delete 3 items? (+1 more)", expect: "أتحذف 3 عنصرًا فعلًا؟ (+1 غيرها)" },

  // --- يجب أن تُرفض (حارس الأمان) ---
  { name: "متغيّر وحده — يبتلع كل شيء", en: "{name}", ar: "{name}", accept: false },
  { name: "متغيّر في الطرفين بلا مرساة — «{a} of {b}» يطابق «Terms of Service»", en: "{a} of {b}", ar: "{a} من {b}", accept: false },
  { name: "متغيّر في الطرفين ولو طال الثابت", en: "{user} shared a document with {who}", ar: "شارك {user} مستندًا مع {who}", accept: false },
  { name: "بلا حروف لاتينية في الثابت", en: "{a} — {b} :: {c}", ar: "{a} — {b} :: {c}", accept: false },
  { name: "متغيّر مخترع في العربية", en: "Deleted {count} files", ar: "حُذف {count} من {total}", accept: false },
  { name: "بلا متغيّرات أصلًا", en: "Delete all chats?", ar: "حذف كل المحادثات؟", accept: false },
  { name: "متغيّرات أكثر من ستة", en: "a{a}b{b}c{c}d{d}e{e}f{f}g{g}here", ar: "x{a}{b}{c}{d}{e}{f}{g}", accept: false },

  // --- حارس التراجع الأسّي (ReDoS) — أُضيف 2026-08-14 ---
  { name: "متغيّران متلاصقان — (.+?)(.+?) زمنه أسّي", en: "Renamed to {old}{new} today", ar: "أُعيدت التسمية إلى {old}{new} اليوم", accept: false },
  { name: "متغيّران بينهما بياض فقط", en: "Shared {user} {doc} with team", ar: "شارك {user} {doc} مع الفريق", accept: false },
  { name: "أكثر من ثلاثة متغيّرات (السقف شُدّد من ٦ إلى ٣)", en: "Copy {a} and {b} and {c} and {d} now", ar: "انسخ {a} و{b} و{c} و{d} الآن", accept: false },
  { name: "ثلاثة متغيّرات بفواصل ثابتة — تُقبل", en: "Moved {file} from {src} to {dst}", ar: "نُقل {file} من {src} إلى {dst}",
    accept: true, sample: "Moved a.txt from Inbox to Docs", expect: "نُقل a.txt من Inbox إلى Docs" },
  { name: "فاصل ثابت قصير («to») — يبقى مقبولًا", en: "Moved {file} to {folder}", ar: "نُقل {file} إلى {folder}",
    accept: true, sample: "Moved b.txt to Archive", expect: "نُقل b.txt إلى Archive" },

  // --- حارس رمز القالب: $ متبوعة برقم في الترجمة ---
  { name: "مبلغ حرفي «$20» في الترجمة يُقرأ مجموعةً فيُفسد الناتج", en: "Get {credits} credits for $20", ar: "احصل على {credits} رصيدًا مقابل $20", accept: false },
  { name: "«$» وحدها بلا رقم لا تضرّ", en: "Balance {amount} in USD", ar: "الرصيد {amount} بالدولار $",
    accept: true, sample: "Balance 30 in USD", expect: "الرصيد 30 بالدولار $" },

  // --- (ر12، ٥ جمادى الأولى ١٤٤٨هـ — PLAN-3.0.0 E2) opt.t: متغيّراتٌ التقاطها مفتاحٌ حرفيٌّ في قاموس الموقع (%T) ---
  // قالبٌ كلُّ متغيّراته %T لا يُعدّ عامًّا لهذا السبب وحده: يُقبل محفوفًا بمتغيّرين وبثابتٍ قصير، وناتجه عربيٌّ كلّه؛ وما ليس مفتاحًا لا يطابق
  { name: "(ر12) كلُّه %T محفوفٌ بمتغيّرين — يُقبل", en: "{first} and {second}", ar: "{first} و{second}", opt: { t: ["first", "second"] },
    accept: true, sample: "Settings and Projects", expect: "الإعدادات والمشاريع" },
  { name: "(ر12) كلُّه %T والتقاطٌ ليس مفتاحًا — لا يطابق (يبقى إنجليزيًّا كلّه)", en: "{first} and {second}", ar: "{first} و{second}", opt: { t: ["first", "second"] },
    accept: true, sample: "Settings and Zeddicus", expect: null },
  { name: "(ر12) كلُّه %T بثابتٍ قصير — يُقبل", en: "Next: {title}", ar: "التالي: {title}", opt: { t: ["title"] },
    accept: true, sample: "Next:  Settings ", expect: "التالي: الإعدادات" },
  { name: "(ر12) القالب نفسه بلا %T — الحارس كما كان (ثابتٌ قصير)", en: "Next: {title}", ar: "التالي: {title}", accept: false },
  { name: "(ر12) %T مع متغيّرٍ حرّ في الطرفين — الحرّاس كما كانت", en: "{title} by {name}", ar: "{title} من {name}", opt: { t: ["title"] }, accept: false },
  { name: "(ر12) %T مع متغيّرٍ حرّ بثابتٍ كافٍ — يُقبل، و‎$n‎ خامٌ و%T معرَّب", en: "Moved {page} to folder {folder}", ar: "نُقل {page} إلى المجلد {folder}",
    opt: { t: ["page"] }, accept: true, sample: "Moved Settings to folder Docs", expect: "نُقل الإعدادات إلى المجلد Docs" },
  { name: "(ر12) opt.t باسمٍ ليس في القالب — يُرفض", en: "Next: {title}", ar: "التالي: {title}", opt: { t: ["page"] }, accept: false },
  { name: "(ر12) كلُّه %T بلا ثابتٍ أصلًا — يُرفض", en: "{title}", ar: "{title}", opt: { t: ["title"] }, accept: false },
  // (مراجعة ر12) اسمٌ في opt.t غائبٌ من العربية: لا %T له فلا يحدّه القاموس — كان يُقبل بالحرّاس المخفَّفة فيبتلع كل «Next: …» ويمحو ما بعده
  { name: "(مراجعة ر12) اسمٌ في opt.t غائبٌ من العربية — يُرفض (لا %T فلا يحدّه القاموس)", en: "Next: {title}", ar: "التالي", opt: { t: ["title"] }, accept: false },
  { name: "(مراجعة ر12) والمحدود كذلك: اسمٌ في opt.t غائبٌ من العربية — يُرفض", en: "Next: {title}", ar: "التالي", opt: { t: ["title"] }, bounded: true, accept: false },
  { name: "(ر12) المحدود (الشحن الجماعي): %T يلتقط (.+?) لا أربعة رموز", en: "Next: {title}", ar: "التالي: {title}", opt: { t: ["title"] }, bounded: true,
    accept: true, sample: "Next: Zq course title of five words", expect: "التالي: دورةٌ تجريبية" },
];
// (ر12) مفاتيح قاموسٍ تجريبي لـ%T، وتعبئة القالب بالمُحلِّلات نفسها التي يستعملها المحرّك والأدوات (cml-shared)
var TEST_LIT = { "Settings": "الإعدادات", "Projects": "المشاريع", "Zq course title of five words": "دورةٌ تجريبية" };
var RES = CMLShared.patternRes(function () { return [TEST_LIT]; });

var tb = document.querySelector("#tbl tbody"), pass = 0;
cases.forEach(function (c) {
  var p = c.bounded ? CMLShared.makePatternBounded(c.en, c.ar, c.opt) : makePattern(c.en, c.ar, c.opt);
  var ok, got;
  if (!c.accept) {
    ok = (p === null);
    got = p === null ? "رُفضت ✓" : "قُبلت ✗ → " + p.re;
  } else if (!p) {
    ok = false; got = "رُفضت خطأً ✗";
  } else {
    var m = c.sample.trim().match(new RegExp(p.re));
    if (!m) { ok = false; got = "النمط لا يطابق العيّنة ✗"; }
    else {
      // تعبئة القالب كالمحرّك (cml-shared fillPattern): ‎$n‎ خامًا، و%T بعربية المفتاح أو null إن لم يكن مفتاحًا
      var out = CMLShared.fillPattern(p.ar, m, RES);
      ok = out === c.expect && (!c.opt || /%T\d/.test(p.ar));
      got = out === null ? "لا يطابق (null)" : out;
    }
  }
  if (!ok && got.indexOf("✗") < 0) got += " ✗"; // (ر12) الصفّ المخفق يحمل علامته فيُرى في نصّ الصفحة عند الإخفاق (run-tests-cdp)
  if (ok) pass++;
  var tr = document.createElement("tr");
  [c.name, c.en, c.ar, c.accept ? (c.expect === null ? "تُقبل ولا تطابق العيّنة" : c.expect || "تُقبل") : "تُرفض", got].forEach(function (v, i) {
    var td = document.createElement("td");
    if (i === 4) { td.className = ok ? "ok" : "bad"; }
    td.textContent = v;
    tr.appendChild(td);
  });
  tb.appendChild(tr);
});

// اختبار إضافي حاسم: قاعدة مقبولة يجب ألّا تطابق نصًّا لا علاقة له
var safe = makePattern("Delete {count} chats?", "حذف {count} محادثة؟");
var falsePositive = new RegExp(safe.re).test("Some unrelated interface label");
if (!falsePositive) pass++;
var tr2 = document.createElement("tr");
["لا مطابقة زائفة", safe.re, "—", "لا يطابق نصًّا أجنبيًّا", falsePositive ? "طابق ✗" : "لم يطابق ✓"].forEach(function (v, i) {
  var td = document.createElement("td");
  if (i === 4) td.className = falsePositive ? "bad" : "ok";
  td.textContent = v; tr2.appendChild(td);
});
tb.appendChild(tr2);

var total = cases.length + 1;
document.getElementById("out").textContent = "RULES-GEN: " + pass + "/" + total + (pass === total ? " — all pass" : " — FAIL");
document.title = "ruletest " + pass + "/" + total;
</script>
</body>
</html>
