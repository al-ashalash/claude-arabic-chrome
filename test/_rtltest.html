<!doctype html>
<meta charset="utf-8">
<title>rtl test</title>
<!--
  اختبار محرّك الاتجاه الجذري (المرحلة ٣ — 2026-09-02).

  طبقتان:
   ١) وحدات CMLRtl الصرفة: المحلّل (تعليقات/طبقات/تداخل/تهريب/متغيّرات التبديل/@keyframes)،
      وجدول analyzeDecl إعلانًا إعلانًا، وترتيب flipSheet (المصفِّرات ثم المنطقيات بفرز
      رتبة الطبقة)، وقسم dirBoost (قواعد المؤلف المشروطة بـRTL تفوز)، وعقم إعادة القلب
      (مخرجاتنا خلف البوابة فلا تُقلب ثانية)، وثبات مفتاح التغطية.
   ٢) التكامل مع الناتج المولَّد الحقيقي: نولّد ورقة أنماط صغيرة بمسار التوليد نفسه
      (parseCss ← flipSheet ← serializeRules) ونتحقق بـgetComputedStyle من ضمانة
      القسمين على عنصر جامع لصنفين، وانبثاق الصواب في جزر LTR وفقرات dir=auto،
      وحرمة الأنماط السطرية، وخمول الملف بلا بوابة، وبقاء إصلاحات base النقطية
      (!important) طبقةً أخيرة — ثم دخان الملف الحقيقي: كل قاعدة خلف البوابة وبلا
      أخطاء تحليل وبصمات التغطية بالعدد المتوقع.

  لماذا صفحة متصفح لا Node: نصف الضمانات (التعاقب، الخصائص المنطقية في RTL، الجزر،
  dir=auto، السطري يغلب) يحسمها محرّك المتصفح نفسه — لا بديل عن getComputedStyle.
-->
<style>body{font-family:system-ui;padding:16px;max-width:1000px;margin:auto}
table{border-collapse:collapse;width:100%;margin-top:12px}
td,th{border:1px solid #ccc;padding:6px 8px;font-size:14px;text-align:right}
.ok{color:#127a2b;font-weight:700}.bad{color:#b00;font-weight:700}
#stage{position:absolute;left:-9999px;top:0}</style>
<link rel="stylesheet" href="../extension/rtl-overrides.css">

<h1>اختبار محرّك الاتجاه الجذري</h1>
<table id="tbl"><thead><tr><th>الحالة</th><th>المتوقَّع</th><th>الناتج</th><th></th></tr></thead><tbody></tbody></table>

<!-- المسرح: مرسوم خارج الشاشة (لا display:none — نحتاج قيم التموضع المستعملة) -->
<div id="stage">
  <div id="fxCompose" class="fx-ml fx-mr"></div>
  <div style="position:relative;width:100px;height:40px"><div id="fxAbs" class="fx-left"></div></div>
  <p id="fxTa" class="fx-ta">نص للمحاذاة</p>
  <pre id="fxPre"><div id="fxIsland" class="fx-ml"></div></pre>
  <div dir="auto" id="fxAuto">Hello world<div id="fxAutoChild" class="fx-ml"></div></div>
  <div style="position:relative;width:100px;height:40px"><div id="fxInline" class="fx-left" style="left:10px"></div></div>
  <div id="fxGate" class="fx-ml"></div>
  <div id="fxPf" class="fx-pf"></div>
</div>

<script>window.__jsErrors = 0; window.onerror = function () { window.__jsErrors++; };</script>
<script src="../extension/cml-const.js"></script>
<script src="../extension/cml-rtl.js"></script>
<script src="../extension/rtl-coverage.js"></script>
<script>
var tb = document.querySelector("#tbl tbody"), pass = 0, total = 0;
function check(name, expect, got) {
  total++; var ok = String(expect) === String(got); if (ok) pass++;
  var tr = document.createElement("tr");
  [name, expect, got].forEach(function (v) { var td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
  var s = document.createElement("td"); s.className = ok ? "ok" : "bad"; s.textContent = ok ? "✓" : "✗"; tr.appendChild(s);
  tb.appendChild(tr);
}

var R = window.CMLRtl, GATE = 'html[data-cml-rtl="v2"]';
var NOFLIP_EX = ':not(:where([data-cml-noflip="computed"]))';
function bare(s) { return s.split(NOFLIP_EX).join(""); }
check("CMLRtl محمّل وبوابته صحيحة", GATE, R && R.GATE);

// ===== الطبقة ١/أ: المحلّل =====
var PT = '@layer a, b;\n' +
  '@layer c{.k{margin-left:1px}}\n' +
  '/* تعليق يجب أن يسقط */ .cm{margin-left:2px}\n' +
  '@media (min-width:100px){.md{left:1px}}\n' +
  '.p{&:hover{margin-left:2px}}\n' +
  '.left-1\\/2{left:50%}\n' +
  '.t{--x: ;}\n' +
  '@keyframes spin{from{left:0}to{left:10px}}';
var P = R.parseCss(PT);
function findRule(rules, sel) { for (var i = 0; i < rules.length; i++) if (rules[i].sel === sel) return rules[i]; return null; }
check("التعليق قبل القاعدة يُسقَط فيبقى المحدِّد نظيفًا", "true", !!findRule(P.rules, ".cm"));
var md = findRule(P.rules, ".md");
check("سياق @media يُحفظ على القاعدة", "@media (min-width:100px)", md ? md.ctx.join("|") : "(لا قاعدة)");
check("ترتيب الطبقات من التصريح والكتل معًا", "a,b,c", P.layerOrder.join(","));
var ph = findRule(P.rules, ".p:hover");
check("التداخل الحديث: & يُستبدل بالأب", "margin-left", ph ? ph.decls[0].prop : "(لا قاعدة)");
check("المحدِّد المهرَّب يبقى كما هو", "true", !!findRule(P.rules, ".left-1\\/2"));
check("متغيّر التبديل ‎--x: ;‎ يُهمل بصمت (لا خطأ تحليل)", "0", P.stats.parseErrors);
check("@keyframes تُتخطى كتلة كاملة", "true", !findRule(P.rules, "from") && !findRule(P.rules, "to") && P.stats.skippedAt >= 1);
check("عدد القواعد المحلَّلة", "5", P.rules.length);
// (ر5-ج، المراجعة المستقلة) تسطيح ‎@scope‎ لا يتّسع عن النطاق: حدٌّ نسبيٌّ إلى الجذر يُتخطّى نطاقُه كلّه كما كان، ومحدِّدٌ لإخوة الجذر يُسقط وحده
var PS1 = R.parseCss("@scope (.a) to (:scope > .b) { .c { margin-left: 1px } }");
check("@scope بحدٍّ فيه ‎:scope‎ يُتخطّى كلّه (لا تسطيح يُسقط الحدّ)", "0/1", PS1.rules.length + "/" + PS1.stats.skippedAt);
var PS2 = R.parseCss("@scope (.a) to (.b) { + .c, .d { margin-left: 1px } ~ .e { margin-left: 2px } }");
check("@scope: محدِّد إخوة الجذر (‎+‎ و‎~‎) يُسقط وحده ويبقى ما سواه", ":where(.a) .d:not(:where(.b),:where(.b) *)",
      PS2.rules.map(function (x) { return x.sel; }).join(" | "));

// ===== الطبقة ١/ب: جدول analyzeDecl =====
function fmtA(a) {
  if (a === null) return "null";
  if (a.kind === "flip") {
    var s = "flip " + a.flips.map(function (f) { return f.prop + ":" + f.value; }).join("; ");
    if (a.neutral.length) s += " | neutral " + a.neutral.map(function (f) { return f.prop + ":" + f.value; }).join("; ");
    return s;
  }
  if (a.kind === "physical-unflippable") return "unflippable " + a.reason;
  return a.kind;
}
function ad(name, prop, value, expect) { check(name, expect, fmtA(R.analyzeDecl(prop, value))); }
ad("margin-left يصير منطقيًّا مع مصفِّر", "margin-left", "8px", "flip margin-inline-start:8px | neutral margin-left:unset");
// (فحص الاتجاه الشامل ق١) الخانتان الأفقيتان وحدهما: بثُّ العمودية بتخصيصنا كان يمحو أدوات الموقع العمودية
ad("margin المختصرة غير المتناظرة: خانتان أفقيتان بلا مصفِّر", "margin", "0 8px 0 0", "flip margin-inline-end:8px; margin-inline-start:0");
ad("margin المتناظرة لا شأن للاتجاه بها", "margin", "0 8px", "null");
ad("border-radius غير المتناظرة: أربع زوايا منطقية", "border-radius", "4px 8px", "flip border-start-start-radius:4px; border-start-end-radius:8px; border-end-end-radius:4px; border-end-start-radius:8px");
ad("border-radius الإهليلجية لا تُقلب", "border-radius", "4px / 8px", "unflippable radius-elliptical");
ad("text-align:left تصير start (لا right)", "text-align", "left", "flip text-align:start");
ad("float:left فيزيائي احتياطًا ثم منطقي", "float", "left", "flip float:right; float:inline-start");
ad("translateX بقيمة حرفية يُقلب في موضعه", "transform", "translateX(-50%)", "flip transform:translateX(50%)");
ad("متغيّر الإزاحة السينية يُقلب عند تصريحه بلفّ calc", "--tw-translate-x", "calc(var(--spacing) * -4)", "flip --tw-translate-x:calc(calc(var(--spacing) * -4) * -1)");
ad("استعمال متغيّر الإزاحة لا يُقلب ثانيةً (لا قلب مزدوج)", "translate", "var(--tw-translate-x) var(--tw-translate-y)", "null");
ad("var() عارية قد تكون متغيّر تبديل — لا قلب أعمى", "translate", "var(--_prose-noscope) 0 .1em", "unflippable translate-keyword");
ad("ظلّ بإزاحة سينية يُحصى للطبيب ولا يُقلب", "box-shadow", "2px 4px 6px #000", "unflippable shadow");
ad("ظلّ بلا إزاحة سينية محايد", "box-shadow", "0 4px 6px #000", "null");
ad("left تصير inset-inline-start مع مصفِّر", "left", "50%", "flip inset-inline-start:50% | neutral left:unset");
ad("direction واعية بالاتجاه أصلًا", "direction", "ltr", "logical");

// ===== الطبقة ١/ج: ترتيب flipSheet والقسمان =====
var FR = [
  { sel: ".a", decls: [{ prop: "margin-left", value: "8px", important: false }], ctx: [], layer: "components", idx: 0 },
  { sel: ".b", decls: [{ prop: "margin-right", value: "16px", important: false }], ctx: [], layer: "utilities", idx: 1 },
];
var FS = R.flipSheet(FR, { layerOrder: ["components", "utilities"] });
check("المصفِّرات كلها في قسم neutral", "margin-left:unset,margin-right:unset",
  FS.neutral.map(function (r) { return r.decls.map(function (d) { return d.prop + ":" + d.value; }).join(";"); }).join(","));
// العقد الجديد (سلّم التخصيص): المحدِّد الأصلي ملفوف في :where() خلف بادئة المستوى ٣
// قواعدُ المراسي تحمل استثناء السطح المحسوب — يُجرَّد قبل المقارنة فالمقصود هنا الترتيب
check("المنطقيات مرتَّبة برتبة الطبقة (.b بعد .a)", GATE + ":not(#cml0#cml1#cml2) :where(.a) | " + GATE + ":not(#cml0#cml1#cml2) :where(.b)",
  FS.logical.map(function (r) { return bare(r.sel); }).join(" | "));
// رتبة الطبقة تغلب موضع القاعدة: نعكس idx ونبقي الطبقات — يجب أن تبقى .a أولًا
var FS2 = R.flipSheet([
  { sel: ".b", decls: [{ prop: "margin-right", value: "16px", important: false }], ctx: [], layer: "utilities", idx: 0 },
  { sel: ".a", decls: [{ prop: "margin-left", value: "8px", important: false }], ctx: [], layer: "components", idx: 1 },
], { layerOrder: ["components", "utilities"] });
check("رتبة الطبقة تغلب موضع القاعدة الأصلي", "true", FS2.logical[0].sel.indexOf(":where(.a)") !== -1);
// مستويا السلّم: المصفِّر (معرِّفان في :not) دون المنطقي (ثلاثة) — بنيويًّا لا ترتيبًا
check("سلّم التخصيص: مصفِّر ×٢ ومنطقي ×٣", "true",
  FS.neutral.every(function (r) { return r.sel.indexOf(":not(#cml0#cml1)") !== -1 && r.sel.indexOf("#cml2") === -1; }) &&
  FS.logical.every(function (r) { return r.sel.indexOf(":not(#cml0#cml1#cml2)") !== -1; }));
var GS = R.flipSheet([{ sel: GATE + " .x", decls: [{ prop: "margin-left", value: "4px", important: false }], ctx: [], layer: null, idx: 0 }], {});
check("محدِّد فيه data-cml يُتخطى (مخرجاتنا نحن)", "1/0", GS.stats.gateSkipped + "/" + GS.stats.flipped);
// الزائف لا يصح داخل :where (المتسامحة تُسقطه فتموت القاعدة) — يبقى خارج اللف،
// ونقطتا تايلويند المهرَّبتان (\:after داخل الاسم) لا تُحسبان زائفًا
var PS = R.flipSheet([
  { sel: ".p:before", decls: [{ prop: "float", value: "left", important: false }], ctx: [], layer: null, idx: 0 },
  { sel: ".hover\\:after\\:x:hover:after", decls: [{ prop: "margin-left", value: "2px", important: false }], ctx: [], layer: null, idx: 1 },
]);
check("الزائف خارج :where والمهرَّب داخله", "true",
  bare(PS.logical[0].sel).indexOf(":where(.p):before") !== -1 &&
  bare(PS.logical[1].sel).indexOf(":where(.hover\\:after\\:x:hover):after") !== -1);

// ===== الطبقة ١/ج٢: dirBoost — قواعد المؤلف المشروطة بـRTL تفوز =====
var DB = R.flipSheet([
  { sel: '[dir="rtl"] .x', decls: [{ prop: "margin-left", value: "4px", important: false }], ctx: [], layer: null, idx: 0 },
  { sel: ".y:dir(rtl)", decls: [{ prop: "padding-left", value: "6px", important: false }], ctx: [], layer: null, idx: 1 },
  { sel: ".z:dir(ltr)", decls: [{ prop: "margin-left", value: "2px", important: false }], ctx: [], layer: null, idx: 2 },
]);
check("الواعية بالاتجاه تُحصى كلها (dirAware)", "3", DB.stats.dirAware);
check("المشروطة بـRTL وحدها تُعزَّز (dirBoosted)", "2/2", DB.stats.dirBoosted + "/" + DB.dirBoost.length);
check("المعزَّزة تُنسخ حرفيًّا خلف البوابة بلا قلب (مستوى ٤)", GATE + ':not(#cml0#cml1#cml2#cml3) :where([dir="rtl"] .x){margin-left:4px}',
  DB.dirBoost[0].sel + "{" + DB.dirBoost[0].decls[0].prop + ":" + DB.dirBoost[0].decls[0].value + "}");
check("المشروطة بـLTR تُترك: لا قلب ولا تعزيز", "true",
  DB.stats.flipped === 0 && DB.logical.length === 0 && DB.dirBoost.every(function (r) { return r.sel.indexOf(".z") === -1; }));

// ===== الطبقة ١/د: العقم — مخرجاتنا لا تُقلب ثانية =====
var IP1 = R.parseCss('.a{margin-left:8px}.b{margin:0 8px 0 0}[dir="rtl"] .c{margin-left:4px}');
var IS1 = R.flipSheet(IP1.rules, { layerOrder: IP1.layerOrder });
var CSS2 = R.serializeRules(IS1.neutral) + "\n" + R.serializeRules(IS1.logical) + "\n" + R.serializeRules(IS1.dirBoost);
var IP2 = R.parseCss(CSS2);
var IS2 = R.flipSheet(IP2.rules, { layerOrder: IP2.layerOrder });
check("إعادة قلب الناتج: لا قلب ولا تعزيز", "0/0", IS2.stats.flipped + "/" + IS2.stats.dirBoosted);
check("كل قواعد الناتج تُتخطى بالبوابة", String(IP2.rules.length), IS2.stats.gateSkipped);

// ===== الطبقة ١/هـ: ثبات مفتاح التغطية =====
var K1 = R.coverageKey([], ".ml-2", "margin-left"), K2 = R.coverageKey([], ".ml-2", "margin-left");
check("مفتاح التغطية ثابت وست عشري بثمانية أحرف", "true", K1 === K2 && /^[0-9a-f]{8}$/.test(K1));

// ===== الطبقة ٢: التكامل مع مسار التوليد الحقيقي =====
// البوابة والاتجاه على جذر الصفحة نفسها — قبل أي قراءة أنماط محسوبة
document.documentElement.setAttribute("dir", "rtl");
document.documentElement.setAttribute("data-cml-rtl", "v2");

// نحاكي الواقع: أنماط الموقع الأصلية تبقى محمّلة، ومولَّدُنا يعلوها بمسار التوليد نفسه
var FIX = ".fx-ml{margin-left:8px}.fx-mr{margin-right:16px}.fx-left{left:12px;position:absolute}.fx-ta{text-align:left}";
var FP = R.parseCss(FIX);
var FF = R.flipSheet(FP.rules, { layerOrder: FP.layerOrder });
var stBase = document.createElement("style"); stBase.textContent = FIX; document.head.appendChild(stBase);
var stGen = document.createElement("style");
stGen.textContent = R.serializeRules(FF.neutral) + "\n" + R.serializeRules(FF.logical);
document.head.appendChild(stGen);
function cs(id) { return getComputedStyle(document.getElementById(id)); }

// (و) ضمانة القسمين: عنصر جامع لصنفين لا تتصادم خاناته
check("★ صنفان معًا: margin-inline-start من fx-ml تصير يمينًا", "8px", cs("fxCompose").marginRight);
check("★ صنفان معًا: margin-inline-end من fx-mr تصير يسارًا", "16px", cs("fxCompose").marginLeft);
// (ز) left المطلقة تصير inset-inline-start فتُحسب يمينًا
check("★ left:12px تصير يمينًا في RTL", "12px", cs("fxAbs").right);
check("left لم تعد 12px (صُفِّرت)", "true", cs("fxAbs").left !== "12px");
// (ح) text-align:start في سياق RTL
var ta = cs("fxTa").textAlign;
check("text-align:left تُحسب start/يمينًا في RTL", "true", ta === "right" || ta === "start");
// (ط) جزيرة LTR: نفس الصنف داخل pre يعود يساره من تلقائه (جزر الملف الحقيقي)
check("★ داخل pre: الهامش يعود يسارًا انبثاقًا", "8px", cs("fxIsland").marginLeft);
check("داخل pre: لا هامش يمينًا", "0px", cs("fxIsland").marginRight);
// (ي) dir=auto بنص إنجليزي يحسم LTR فيعود الهامش يسارًا
check("★ dir=auto إنجليزية: الهامش يسارًا", "8px", cs("fxAutoChild").marginLeft);
check("dir=auto إنجليزية: لا هامش يمينًا", "0px", cs("fxAutoChild").marginRight);
// (ك) السطري المحسوب بجافاسكربت لا يُمسّ: يغلب مصفِّرنا غير المهم
check("★ style=left:10px السطري يبقى (لا !important فوقه)", "10px", cs("fxInline").left);
// (م) ★ النسخ المطابقة والمختصر لا يمسّان الخانات العمودية (فحص الاتجاه الشامل، ق١): تمهيد Tailwind
// ‎*{padding:0;margin:0;border:0 solid}‎ في ‎@layer base‎ كانت نسخته المطابقة تُبثّ كاملةً بتخصيصنا خارج الطبقات
// فتمحو ‎.pt-14‎ و‎.mt-8‎ و‎.border-b‎ في ‎@layer utilities‎ — والمختصر غير المتناظر يبثّ خانتيه العموديتين كذلك
var FIX2 = "@layer base,utilities;\n" +
  "@layer base{*{padding:0;margin:0;border:0 solid}}\n" +
  "@layer utilities{.id-pt{padding-top:56px}.id-bb{border-bottom-width:1px}.id-mt{margin-top:32px}" +
  ".id-ml{margin-left:12px}.id-pl{padding-left:8px}.id-bl{border-left-width:2px}" +
  ".id-px{padding-left:16px;padding-right:16px}.id-sb{padding:0 8px 6px 0}.id-py{padding-top:12px;padding-bottom:12px}}";
var FP2 = R.parseCss(FIX2);
var FF2 = R.flipSheet(FP2.rules, { layerOrder: FP2.layerOrder });
var gen2 = R.serializeRules(FF2.neutral) + "\n" + R.serializeRules(FF2.logical);
check("النسخة المطابقة للتمهيد بلا خانات عمودية", "false",
  /(^|[;{])\s*(margin|padding|border)\s*:|(top|bottom|block)[a-z-]*\s*:/.test(gen2));
var idBox = document.createElement("div");
idBox.innerHTML = '<div id="idV" class="id-pt id-bb id-mt">v</div><div id="idH" class="id-ml id-pl id-bl">h</div>' +
  '<div id="idX" class="id-px">x</div><div id="idS" class="id-sb id-py">s</div>';
document.body.appendChild(idBox);
var stSite2 = document.createElement("style"); stSite2.textContent = FIX2; document.head.appendChild(stSite2);
var stGen2 = document.createElement("style"); stGen2.textContent = gen2; document.head.appendChild(stGen2);
void document.documentElement.offsetHeight;
check("★ ‎.pt-14‎ تبقى تحت البوابة (padding-top)", "56px", cs("idV").paddingTop);
check("★ ‎.mt-8‎ تبقى تحت البوابة (margin-top)", "32px", cs("idV").marginTop);
check("★ ‎.border-b‎ تبقى تحت البوابة", "1px", cs("idV").borderBottomWidth);
check("★ الأفقي يُقلب مع التمهيد: margin/padding/border يمينًا", "12px/0px/8px/2px",
  [cs("idH").marginRight, cs("idH").marginLeft, cs("idH").paddingRight, cs("idH").borderRightWidth].join("/"));

// ===== الطبقة ٢/م: دخان الناتج المولَّد الحقيقي =====
// fetch ممنوعة تحت file:// — فمن فتح الصفحة بالنقر المزدوج كانت تنفجر TypeError
// وتُحسب إخفاقًا كاذبًا. تحت file:// تُتخطى اختبارات الجلب تصريحًا (بصفّ إرشاد
// لا بإخفاق)، وتبقى بصمات التغطية وأخطاء الصفحة قابلتين للفحص (سكربتاتها حُمّلت).
if (location.protocol === "file:") {
  check("بصمات التغطية بالعدد المتوقع (≥500)", "true", window.CMLRtlCoverage && window.CMLRtlCoverage.keys.length >= 500);
  var info = document.createElement("p");
  info.style.cssText = "color:#8a5a2b;font-size:13px";
  info.textContent = "ℹ فُتحت الصفحة ملفًّا مباشرًا (file://) — تُتخطى اختبارات جلب الملف الحقيقي الثلاثة. " +
    "للفحص الكامل شغّل: node code/toolchain/serve-tests.mjs ثم افتح http://localhost:8794/code/test/_rtltest.html";
  document.body.appendChild(info);
  check("لا أخطاء جافاسكربت في الصفحة", "0", window.__jsErrors);
  finish();
} else {
fetch("../extension/rtl-overrides.css")
  .then(function (r) { return r.text(); })
  .then(function (txt) {
    check("بصمات التغطية بالعدد المتوقع (≥500)", "true", window.CMLRtlCoverage && window.CMLRtlCoverage.keys.length >= 500);
    var ag = txt.indexOf("AUTO-GENERATED");
    check("الملف يبدأ بتعليق AUTO-GENERATED", "true", txt.lastIndexOf("/*", 0) === 0 && ag !== -1 && ag < txt.indexOf("*/"));
    var RP = R.parseCss(txt);
    check("تحليل الملف الحقيقي بلا أخطاء", "0", RP.stats.parseErrors);
    var bad = 0;
    for (var i = 0; i < RP.rules.length; i++) if (RP.rules[i].sel.indexOf(GATE) !== 0) bad++;
    check("★ كل قاعدة في الملف الحقيقي خلف البوابة", "0", bad);
    check("حجم الملف الحقيقي معقول (≥100 قاعدة)", "true", RP.rules.length >= 100);
    check("لا أخطاء جافاسكربت في الصفحة", "0", window.__jsErrors);
    finish();
  })
  .catch(function (e) {
    check("جلب rtl-overrides.css عبر الخادم", "نجح", "فشل: " + e);
    finish();
  });
}

function finish() {
  // ===== المحرّك الحيّ: يبني من CSS الحاضر لا من لقطةٍ متقادمة =====
  var liveIn = ["@layer theme,base,utilities;" + Array.from({length:1200},function(_,i){
    return ".u"+i+"{margin-left:"+i+"px;padding-right:2px;left:0}";}).join("")];
  var liveOut = CMLRtl.buildLiveSheet(liveIn);
  check("★ الحيّ يبني ورقةً من نصوص CSS مباشرةً", "true", String(!!(liveOut && liveOut.css)));
  check("★ بوابتُه live لا v2 (فلا تتزاحم الورقتان)", "true",
    String(!!liveOut && liveOut.css.indexOf("data-cml-rtl=\"live\"") !== -1 &&
           liveOut.css.indexOf("data-cml-rtl=\"v2\"") === -1));
  check("★ ناتجُه يُعاد تحليله بلا أخطاء", "0", String(CMLRtl.parseCss(liveOut.css).stats.parseErrors));
  var liveRe = CMLRtl.parseCss(liveOut.css);
  check("★ كل قاعدةٍ فيه خلف بوابته", "0",
    String(liveRe.rules.filter(function (r) { return r.sel.indexOf(CMLRtl.LIVE_GATE) !== 0; }).length));
  check("★ مدخلٌ هزيل يُرفض (تبقى اللقطة عاملة)", "true",
    String(CMLRtl.buildLiveSheet([".a{margin-left:1px}"]) === null));
  // ★ (ر9-د، ٥ جمادى الأولى ١٤٤٨هـ) صفحةٌ خفيفة أوراقُها كاملة تُبنى لها ورقةٌ حيّة: صفحة الدخول في claude.ai بوكيل مستخدمٍ محمول
  // (ورقتان فيهما 2,675 قاعدة و87 مقلوبًا) كانت تُرفض «هزيلة» فتبقى اللقطة عليها، واللقطة لا تعرف صنف الإزاحة المنطقية
  // ms-[clamp(…)] في حزمة المحمول فتغلبه نسختُها من تصفير * (إطار العرض في «أنشئ مع Claude» بلا إزاحته، مقيس). والشكل هنا اصطناعيٌّ
  // بالعددين نفسيهما؛ وما دون إحدى العتبتين (60 مقلوبًا، 1000 قاعدة) يُرفض كما كان
  function liveShape(nFlip, nRules) {
    var s = "";
    for (var i = 0; i < nRules; i++) s += i < nFlip ? ".lf" + i + "{margin-left:" + (i + 1) + "px}" : ".lv" + i + "{margin-top:" + (i + 1) + "px}";

  var lightOut = CMLRtl.buildLiveSheet([{ text: liveShape(87, 2675) }]);
  check("★ صفحةٌ خفيفة كاملة الأوراق تُبنى لها ورقةٌ حيّة (شكل الدخول بوكيلٍ محمول: 2,675 قاعدة و87 مقلوبًا)", "true/87",
    String(!!(lightOut && lightOut.css)) + "/" + (lightOut ? lightOut.stats.flipped : "-"));
  var thinF = {}, thinR = {};
  check("★ وما دون عتبة المقلوب (59) أو عتبة القواعد (999) يُرفض هزيلًا (تبقى اللقطة عاملة)", "true/thin|true/thin",
    String(CMLRtl.buildLiveSheet([{ text: liveShape(59, 2675) }], thinF) === null) + "/" + thinF.reason + "|" +
    String(CMLRtl.buildLiveSheet([{ text: liveShape(87, 999) }], thinR) === null) + "/" + thinR.reason);
  // ★ (مراجعة كودكس ١٣) سجلّاتٌ لا نصوص: الوسيط سياقٌ، والعناوين النسبية تُطلق، و@import يُرفض
  var big = Array.from({length:1200},function(_,i){ return ".u"+i+"{margin-left:"+i+"px;left:0}"; }).join("");
  var infoI = {};
  check("★ @import يُرفض صراحةً (لا نتبعه فلا نبني ناقصًا)", "true/import",
    String(CMLRtl.buildLiveSheet([{ text: "@import url(x.css);" + big }], infoI) === null) + "/" + infoI.reason);
  var withMedia = CMLRtl.buildLiveSheet([{ text: big, media: "(min-width: 900px)" }]);
  check("★ وسيطُ الورقة يصير @media على قواعدها", "true",
    String(!!withMedia && withMedia.css.indexOf("@media (min-width: 900px){") !== -1));
  var withAll = CMLRtl.buildLiveSheet([{ text: big, media: "all" }]);
  check("وسيط all/screen لا يُغلَّف", "false", String(!!withAll && withAll.css.indexOf("@media") !== -1));
  var withUrl = CMLRtl.buildLiveSheet([{ text: big + ".bg{background:url(img/a.png) left top no-repeat;margin-left:3px}", base: "https://assets.claude.ai/css/site.css" }]);
  check("★ العنوان النسبي في القيمة يُطلق على عنوان الورقة", "true",
    String(!!withUrl && withUrl.css.indexOf("url(img/a.png)") === -1 &&
           (withUrl.css.indexOf("https://assets.claude.ai/css/img/a.png") !== -1 || withUrl.css.indexOf("a.png") === -1)));
  // ★★ (شُخّص حيًّا) السطح المحسوب لا يُفرض عليه اتجاه: خلطُه بجزيرة القراءة كان
  // يقلب القوائم المنبثقة كلها إلى اليسار — فالسمة "computed" مراسٍ فقط لا اتجاه
  check("★★ جزيرة القراءة وحدها تُلزَم direction:ltr", "true",
    String(/[data-cml-noflip="ltr"]/.test(CMLRtl.ISLANDS_CSS)));
  check("★★ والسطح المحسوب (computed) لا يُفرض عليه اتجاه", "true",
    String(CMLRtl.ISLANDS_CSS.indexOf("[data-cml-noflip]{") === -1 &&
           CMLRtl.ISLANDS_CSS.indexOf("computed") === -1));
  cascadeCases().then(htmlCompoundCase).then(htmlCompoundQuoted).then(finalize, function (e) {
    check("استثناء في حالات التعاقب", "(لا شيء)", String(e && e.message || e));
    finalize();
  });
}

// ===== حالات التعاقب (مراجعة كودكس ٩ و١٠): المقلوب يطابق الأصل مرآةً بـgetComputedStyle =====
// الأصل في إطار LTR بأوراق الموقع وحدها، والمقلوب في إطار RTL مع الورقة المولَّدة بمسار
// البناء نفسه (المهمّات في cml-imp المعلَنة أولًا). العقد: هامش اليمين في المقلوب = هامش
// اليسار في الأصل، والعكس.
function cascadeCases() {
  var CASES = [
    ["تكرارٌ يفصله مخالف (1 ثم 2 ثم 1)", ".a{margin-left:1px}.a{margin-left:2px}.a{margin-left:1px}", "a"],
    ["تكرارٌ عادي ثم مهمّ", ".a{margin-left:1px}.a{margin-left:1px!important}", "a"],
    ["مهمّان في طبقتين: الأسبق يغلب", "@layer first,second;@layer first{.a{margin-left:1px!important}}@layer second{.a{margin-left:2px!important}}", "a"],
    ["مهمٌّ مطبَّق يغلب مهمًّا غير مطبَّق", "@layer first{.a{margin-left:1px!important}}.a{margin-left:2px!important}", "a"],
    ["عاديان في طبقتين: المتأخر يغلب", "@layer first,second;@layer first{.a{margin-left:1px}}@layer second{.a{margin-left:2px}}", "a"],
    ["اختصارٌ ثم مفرد", ".a{margin:0 0 0 3px}.a{margin-left:1px}", "a"],
    ["تكرارٌ يفصله محدِّدٌ آخر على العنصر نفسه", ".a{margin-left:1px}.b{margin-left:2px}.a{margin-left:1px}", "a b"],
    // ★ (ر5-ج، ٢٩ ربيع الآخر ١٤٤٨هـ — القرار 75) قاعدة ‎@scope‎ (نثر CDS في الوثائق وclaude.ai) تدخل النسخ المطابقة: كانت تُتخطّى فتغلبها
    // نسخةُ مُصفِّر * في سلّمنا (خلايا الجداول بلا حشوة أفقية في RTL). و‎.z‎ تجعل خانات الهامش متنازَعةً كما في أوراق المواقع
    ["@scope: مختصرٌ متناظر داخل النطاق يغلب مُصفِّر * المنسوخ", "@layer base,components;@layer base{*{margin:0}}@layer components{@scope(body) to (.np){.a{margin:0 5px}}}.z{margin-left:7px}", "a"],
  ];
  function frame(css, cls, mirrored, generated) {
    return new Promise(function (res) {
      var f = document.createElement("iframe");
      f.style.cssText = "position:absolute;left:-9999px;width:200px;height:100px";
      f.srcdoc = '<html dir="' + (mirrored ? "rtl" : "ltr") + '"' + (mirrored ? ' data-cml-rtl="v2"' : "") +
        "><head><style>@layer cml-point,cml-imp;</style><style>" + css + "</style>" +
        (mirrored ? "<style>" + generated + "</style>" : "") +
        '</head><body><div class="' + cls + '">x</div></body></html>';
      f.onload = function () {
        var st = f.contentWindow.getComputedStyle(f.contentDocument.querySelector("div"));
        var v = { l: st.marginLeft, r: st.marginRight };
        f.remove();
        res(v);
      };
      document.body.appendChild(f);
    });
  }
  var chain = Promise.resolve();
  CASES.forEach(function (c) {
    chain = chain.then(function () {
      var parsed = R.parseCss(c[1]);
      var out = R.flipSheet(parsed.rules, { layerOrder: parsed.layerOrder });
      var gen = "@layer cml-point,cml-imp;@layer cml-imp{" +
        R.serializeRules(out.neutralImp.concat(out.logicalImp, out.dirBoostImp)) + "}" +
        R.serializeRules(out.neutral.concat(out.logical, out.dirBoost));
      return frame(c[1], c[2], false).then(function (o) {
        return frame(c[1], c[2], true, gen).then(function (m) {
          check("★ تعاقب: " + c[0], "L" + o.l + "/R" + o.r, "L" + m.r + "/R" + m.l);
        });
      });
    });
  });
  return chain;
}

// ===== ★ (ر9-هـ، ٥ جمادى الأولى ١٤٤٨هـ) مركّب html يُقطع في المستوى الأعلى وحده =====
// متغيّر Tailwind الجديد في وثائق Claude Code ‎html[data-auth-pending~=nav] .x‎: كان المركّب يُقطع عند أول ‎~‎ ولو داخل المعقوف، فيخرج
// ‎:where([data-auth-pending) ~ :where(=nav] .x)‎ بمعقوفٍ وقوسٍ مفتوحين يبتلع بهما المتصفحُ كلَّ قاعدةٍ بعده في الورقة (177 قاعدةً في الورقة
// الحيّة لصفحة overview)، ومنها قاعدة زرّ طيّ الفهرس: موضعه المنطقي (inset-inline-end) ونسخة استدارته (9999px) التي تغلب نسخة تمهيد
// ‎button{border-radius:0}‎ — فلصق الزرّ بحافّة الشاشة اليمنى مربّعًا (صنفا فحص الاتجاه e222fbffd940 و361aee9e69f8). والحالة هنا بشكلها:
// قلبُ زاويةٍ يجعل خانات الاستدارة متنازَعةً فتُبثّ النسخ المطابقة، ثم قاعدة html بالسمة، ثم الزرّ بعدها في التعاقب، ومعها ‎:not([…~="a b"])‎
function htmlCompoundCase() {
  var SITE = "@layer base,utilities;@layer base{button{border-radius:0}}" +
    "@layer utilities{.rl{border-top-left-radius:4px}html[data-auth-pending~=nav] .ap{margin-left:4px}html:not([data-x~=\"a b\"]) .an{padding-left:2px}}" +
    "#t{position:absolute;top:0;right:10px;width:20px;height:20px;border-radius:9999px}";
  var parsed = R.parseCss(SITE);
  var out = R.flipSheet(parsed.rules, { layerOrder: parsed.layerOrder });
  var gen = "@layer cml-point,cml-imp;@layer cml-imp{" + R.serializeRules(out.neutralImp.concat(out.logicalImp, out.dirBoostImp)) + "}" +
    R.serializeRules(out.neutral.concat(out.logical, out.dirBoost));
  var nGen = R.parseCss(gen).rules.length, nRead = 0;
  try {
    var sh = new CSSStyleSheet();
    sh.replaceSync(gen);
    (function walk(list) { for (var i = 0; i < list.length; i++) { if (list[i].selectorText !== undefined) nRead++; if (list[i].cssRules) walk(list[i].cssRules); } })(sh.cssRules);
  } catch (e) { nRead = -1; }
  check("★ (ر9-هـ) مركّب html بسمةٍ فيها ‎~=‎ أو مسافة لا يبتلع ما بعده: يقرأ المتصفح كلَّ قاعدةٍ مولَّدة", "9/9", nGen + "/" + nRead);
  return new Promise(function (res) {
    var f = document.createElement("iframe");
    f.style.cssText = "position:absolute;left:-9999px;width:300px;height:120px";
    f.srcdoc = '<html dir="rtl" data-cml-rtl="v2" data-auth-pending="nav"><head><style>@layer cml-point,cml-imp;</style><style>' + SITE +
      "</style><style>" + gen + '</style></head><body style="margin:0"><div style="position:relative;width:300px;height:40px">' +
      '<button id="t" class="rl"></button></div><div class="ap" id="ap">x</div><div class="an" id="an">y</div></body></html>';
    f.onload = function () {
      var w = f.contentWindow, d = f.contentDocument;
      var t = w.getComputedStyle(d.getElementById("t")), ap = w.getComputedStyle(d.getElementById("ap")), an = w.getComputedStyle(d.getElementById("an"));
      check("★ (ر9-هـ) وبعدها زرٌّ كزرّ طيّ الفهرس: موضعه منعكس (left) واستدارته باقية، وقاعدتا html نفسيهما منعكستان",
        "10px/9999px/9999px/4px:0px/2px", [t.left, t.borderTopLeftRadius, t.borderTopRightRadius, ap.marginRight + ":" + ap.marginLeft, an.paddingRight].join("/"));
      f.remove();
      res();
    };
    document.body.appendChild(f);
  });
}

// ===== ★ (ر9، المراجعة الموحّدة، ٥ جمادى الأولى ١٤٤٨هـ) compoundLen: علامتا التنصيص والهروب =====
// تحققا ر9-هـ أعلاه يمرّان بالعمق و‎~=‎ وحدهما، فكانت طفرتان في compoundLen تنجوان منهما: حذفُ معالجة علامتي التنصيص (قيمةُ سمةٍ
// فيها ‎]‎ أو ‎(‎ تُخرج العمق إلى الصفر أو تُبقيه فوقه، فيُقطع المركّب في غير موضعه ولا يطابق المحدِّدُ عنصرَه)، وحذفُ معالجة الهروب
// (صنفٌ على html فيه ‎\+‎ يُقطع عند ‎+‎ فيبقى ‎:where(.e\)‎ قوسًا مهرَّبًا لا يُغلق ويبتلع ما بعده). والقلب يُقاس على العناصر لا العدُّ وحده
function htmlCompoundQuoted() {
  var SITE = "@layer utilities{html[data-q=\"a]b c\"] .q{margin-left:3px}html:not([data-n=\"(\"]) .n{padding-left:4px}" +
    "html.e\\+f .e{margin-left:5px}.z{margin-left:7px}}";
  var parsed = R.parseCss(SITE);
  var out = R.flipSheet(parsed.rules, { layerOrder: parsed.layerOrder });
  var gen = "@layer cml-point,cml-imp;@layer cml-imp{" + R.serializeRules(out.neutralImp.concat(out.logicalImp, out.dirBoostImp)) + "}" +
    R.serializeRules(out.neutral.concat(out.logical, out.dirBoost));
  var nGen = R.parseCss(gen).rules.length, nRead = 0;
  try {
    var sh = new CSSStyleSheet();
    sh.replaceSync(gen);
    (function walk(list) { for (var i = 0; i < list.length; i++) { if (list[i].selectorText !== undefined) nRead++; if (list[i].cssRules) walk(list[i].cssRules); } })(sh.cssRules);
  } catch (e) { nRead = -1; }
  return new Promise(function (res) {
    var f = document.createElement("iframe");
    f.style.cssText = "position:absolute;left:-9999px;width:300px;height:120px";
    f.srcdoc = '<html dir="rtl" data-cml-rtl="v2" data-q="a]b c" class="e+f"><head><style>@layer cml-point,cml-imp;</style><style>' + SITE +
      "</style><style>" + gen + '</style></head><body style="margin:0"><div class="q" id="q">q</div><div class="n" id="n">n</div>' +
      '<div class="e" id="e">e</div><div class="z" id="z">z</div></body></html>';
    f.onload = function () {
      var w = f.contentWindow, d = f.contentDocument, st = function (id) { return w.getComputedStyle(d.getElementById(id)); };
      check("★ (ر9، المراجعة الموحّدة) مركّب html بقيمة سمةٍ بين علامتي تنصيص فيها ] أو ( وبصنفٍ فيه محرفٌ مهرَّب: يقرأ المتصفح كلَّ قاعدةٍ مولَّدة وتنعكس العناصر كلها",
        "8/8|3px:0px/4px/5px/7px", nGen + "/" + nRead + "|" +
        [st("q").marginRight + ":" + st("q").marginLeft, st("n").paddingRight, st("e").marginRight, st("z").marginRight].join("/"));
      f.remove();
      res();
    };
    document.body.appendChild(f);
  });
}

function finalize() {
  document.title = "rtltest " + pass + "/" + total;
  var h = document.createElement("p");
  h.className = pass === total ? "ok" : "bad";
  h.textContent = "RTLTEST: " + pass + "/" + total + (pass === total ? " — all pass" : " — FAIL");
  document.body.appendChild(h);
}
</script>
