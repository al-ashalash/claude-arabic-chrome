  ★ اتجاه claude.com (ر16-أ، ٦ جمادى الأولى ١٤٤٨هـ): مدخل claude.com في المانيفست يحقن base.css ثم rtl-com.css (المولَّدة من لقطة sitecss-com)
  ثم com-point.css، في كل صفحةٍ من المضيف والنطاق قادمٌ خامل (status.upcoming). فيُفحص هنا:
   ١) قائمة الأوراق في مدخل claude.com بترتيبها؛ ★ (ر28-ب، ٢٠ جمادى الأولى ١٤٤٨هـ — السؤال 2 على افتراضه) وصار مانيفست الحزمة يحجب المدخل ما دام
      النطاق قادمًا، فيُفحص هنا أن لا مدخل يطابق مضيفه أو يحقن قاموسه أو أوراقه، وترتيبُها في مدخل النسخة المشغَّلة لفحص الاتجاه في selftest-tools؛
   ٢) البوابة: كل قاعدة أسلوبٍ في الأوراق الثلاث تبدأ بسمةٍ على <html> لا يكتبها إلا المحرّك (‎html[data-cml…]‎)، وحساب الأسلوب لكل عنصرٍ في
      البنية التجريبية هو هو بالأوراق وبدونها ما دامت السمات غائبة — ولو كتب الموقع dir="rtl" نفسه؛
   ٣) القواعد النقطية (com-point.css) مشغَّلةً بسمات المحرّك: مؤشر التبويبات تحت التبويب النشط مع قلبٍ مولَّدٍ لمرساته (بشكل قاعدة rtl-com.css
      وتخصيصها، على أصنافٍ تجريبية)، والأسهم الأربعة من القائمة المغلقة تنقلب وغيرها لا ينقلب ولا ما في جزر LTR، والشريط المتحرك جزيرة LTR،
      وإطارا الأدراج الثلاثة يتبعان حافّتها الجديدة، ومتن مسار الهيكل LTR والترويسة RTL.
  البنية اصطناعيةٌ من صنع المشروع تحاكي أصناف claude.com (CSS Modules ببصمةٍ تجريبية Zq) ومسارات أيقوناته، بلا نصٍّ من الموقع.
  العقد: document.title الختامي = "comcss N/N".
-->
