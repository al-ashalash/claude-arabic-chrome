<!--
  ★ (ر20-أ، ١٢ جمادى الأولى ١٤٤٨هـ) لوحة المطوّرين (Console) صنفُ مسارٍ في مدخل الوثائق نفسه (جدول النطاقات: صفّ docs ‏classes)، قادمٌ خاملٌ حتى CN1:
  (أ) الجدول ومسارات الصنف من الحزم العامة، وما خارجها؛ (ب) الإقلاع في قسمٍ من اللوحة خاملٌ تمامًا (لا سمة ولا نصّ ولا عنوان ولا خط ولا طلب إلى العامل)،
  وتجيب النافذة بالصنف؛ (ج) التنقّل بطريقة Next.js بين الوثائق واللوحة ومرجع الواجهة وعودته: كل انتقالٍ إلى اللوحة يعيد الصفحة إلى أصلها بلا أثر (ولا
  ورقتنا الحيّة)، ولقطة المستند فيها هي لقطة إطارٍ لم يعمل فيه المحرّك قط بايتًا بايتًا، والمرجع على معاملته؛ والجدول بلا الصنف (محرّك المرحلة بلا صنفه)
  يعطي اللقطة نفسها في كل محطة؛ وصنف المسار يسبق بادئةً كاملة؛ (د) محتوى المستخدم في أسطح اللوحة بمحدِّدات الصنف، مشغَّلًا في إطارٍ وحده كما سيشغّله
  CN1: لا يُعرَّب ولا يُقرأ (الجاسوس 0)، والبنية نفسها بلا الحماية تُعرَّب (AD-005). محتوى اصطناعي من صنع المشروع، والأطر _consoleframe.html.
  العقد: document.title = "consoletest N/N".
-->

var HOME = location.pathname + location.search, TOPSEND = 0, HELLO = null;

Object.assign(TM.localStore, { cml_enabled: true, cml_rtl: true });
TM.chrome.runtime.onMessage = { addListener: function (fn) { HELLO = fn; } };

  dicts: { ar: { dir: "rtl", strings: { "Zq Keys": "مفاتيحُ تجريبية", "Claude Platform Docs": "وثائقُ تجريبية" }, patterns: [], plurals: {} } } };

history.replaceState({}, "", "/settings/keys");

<script>

(async function () {

        (C.caps("docs").where.indexOf("وتعريب «لوحة المطوّرين (Console)» على المضيف نفسه قادمٌ في تحديثٍ لاحق") > 0) + "/" +

        INERT + " / " + INERT, bootNow + " / " + inert(B));

        "Zq Keys|Create Key|Name|Default|Zq Documentation|Zq menu|Zq Keys",

  var N = await frame("mode=nav"), O = await frame("mode=nav&cls=0"), REF = await frame("mode=boot");

        T.html.split("|").slice(0, 3).concat([T.html.split("|")[5], T.live]).join("|") + "|" + N.text("navDocs") + "|" + N.attr("navBtn", "aria-label"));
  var same = [];
  same.push(N.snap() === O.snap());
  N.go("keys"); O.go("keys"); await wait(900);
  check("★ الوثائق ← اللوحة (‎/settings/keys‎): عادت الصفحة إلى أصلها بلا أثر — لا سمة على <html> ولا «data-cml…» ولا ورقتنا الحيّة ولا علامة اتجاه ولا lang ولا خط",
        INERT, inert(N));
  check("★ والنصوص والسمات والعنوان على أصلها (الرأس المشترك الذي عُرِّب في الوثائق، ومحتوى اللوحة الجديد)",
        "Zq Documentation|Zq Console|Zq menu|Zq Keys|Create Key|Default|Zq Keys",
        ["navDocs", "navCon"].map(N.text).join("|") + "|" + N.attr("navBtn", "aria-label") + "|" + ["kh", "kb", "kname"].map(N.text).join("|") + "|" + N.trace().title);
  check("★ ولقطة المستند كلّه في اللوحة بعد الوثائق هي لقطة إطارٍ أقلع فيها ولم يعمل فيه المحرّك قط — بايتًا بايتًا", "true", N.snap() === REF.snap());
  same.push(N.snap() === O.snap());
  N.go("api"); O.go("api"); await wait(1300);
  T = N.trace();
  check("★ اللوحة ← مرجع الواجهة (‎/docs/en/api/messages‎): معاملته كما هي — مسارٌ كامل، والتوقيع على أصله (STL_KEEP)، والرأس مُعرَّب، والورقة الحيّة تعود",
        "full|POST /v1/messages|توثيقٌ تجريبي|rtl|true", T.html.split("|")[5] + "|" + N.text("sig") + "|" + N.text("navDocs") + "|" + T.html.split("|")[0] + "|" + T.live);
  same.push(N.snap() === O.snap());
  N.go("play"); O.go("play"); REF.go("play"); await wait(900);
  check("★ المرجع ← اللوحة (‎/playground‎): خاملٌ بلا أثر مرّةً ثانية، ولقطتها لقطة الإطار الخامل بعد التنقّل نفسه", INERT + "/true", inert(N) + "/" + (N.snap() === REF.snap()));
  same.push(N.snap() === O.snap());
  N.go("intro"); O.go("intro"); await wait(1300);
  T = N.trace();
  check("★ اللوحة ← الوثائق: يعود التعريب والسمات والورقة الحيّة", "rtl|on|full|true|توثيقٌ تجريبي|قائمةٌ تجريبية",

  var SK = N.CMLConst.key(N.CMLConst.K.SITE_ON, "docs"), o1 = {}, o2 = {};

  var tOff = N.trace(), xOff = N.text("navDocs");

  check("★ (مراجعة ر20-أ) وإطفاء موقع الوثائق بمفتاحه كما كان قبل المرحلة: تُرفع السمات ويعود النص وتبقى ورقتنا الحيّة خاملةً في <head> (رفعُها للخمول بالمسار وحده)، وإعادة التشغيل تعيد التعريب",

  document.title = T0;

  check("★ (ساحة التجربة) محرِّر الموجِّه (‎.ProseMirror > *‎) ودور المستخدم (‎.bg-user-message‎) والمخرَج (‎.prose‎) على أصلها، وسمة المحرِّر والعنوان والزرّ تُعرَّب، والفقرة نفسها خارجها تُعرَّب",
