<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scanlong test</title>
<!--
  ★ (ر29-ط، ١٩ جمادى الأولى ١٤٤٨هـ — توجيه المالك: لا يمنع سقفُ طولٍ تعريبَ نصّ موقع) «فحص الترجمة» بلا سقف طول في ماسح فهرس الصفحات
  (scan:"llms"): كان العنوان أو عنوان المجموعة الذي يزيد على TEXT_MAX (300 حرف) يُتخطّى، فلا يبلغ تصديرَ المالك نصٌّ طويلٌ غير مترجم أبدًا.
  بالمحرّك الحقيقي وقاموس الوثائق المشحون، على فهارس اصطناعية تُبنى هنا (عناوين «Zzq …»: لا نصَّ من الموقع):
   ١) عناوين غير مترجمة من 301 و450 و1,200 حرف، وعنوان مجموعةٍ من 450 ⇒ في القائمة بنصّها، وعنوانٌ من 300 وآخر قصير كما كانا؛
   ٢) عنوانٌ من 450 يترجمه القاموس (مفتاحٌ اصطناعي يُضاف هنا)، ومعه شارته « (Beta)»، وعنوانٌ من 450 يبقى بالإنجليزية بقاعدة النطاق ⇒ مغطّاة
      كما يُغطّى القصير، والأخير معدودٌ في kept؛
   ٣) حدّ الحجم (SCAN_MAX_BYTES، ر29-ز) باقٍ مع الطويل: بحدٍّ صغيرٍ للاختبار وحده يُقصّ بالحجم ويُعدّ ما بقي خارجه، ونصٌّ أطول من الحدّ كله
      يُعدّ ولا يُخزَّن.
  العقد: document.title = "scanlong N/N".
-->
<style>body{font-family:system-ui;padding:16px;max-width:1000px;margin:auto}
table{border-collapse:collapse;width:100%;margin-top:12px}
td,th{border:1px solid #ccc;padding:6px 8px;font-size:13px;text-align:right;vertical-align:top;word-break:break-all}
.ok{color:#127a2b;font-weight:700}.bad{color:#b00;font-weight:700}</style>
</head>
<body>
<h1>اختبار «فحص الترجمة» في فهرس الصفحات: لا سقف طول</h1>
<table id="tbl"><thead><tr><th>الحالة</th><th>المتوقَّع</th><th>الناتج</th><th></th></tr></thead><tbody></tbody></table>
<pre id="log"></pre>
<script>var jsErrors = 0; window.onerror = function () { jsErrors++; };</script>
<script src="_chrome-mock.js"></script>
<script>
  var MOCK = makeChromeMock({ session: false });
  window.__store = MOCK.localStore;
  window.chrome = MOCK.chrome;
</script>
<script src="../extension/cml-const.js"></script>
<script src="../extension/cml-shared.js"></script>
<script src="../extension/dict-docs.js"></script>
<script>
  var L = globalThis.CLAUDE_L10N, D = L.dicts.ar;
  var HERE = location.pathname.replace(/[^\/]*$/, "");
  L.meta = { scan: "llms", llms: "/__cml-scanlong-fixture.txt", live: false, chat: false, hydrate: "none", routes: { full: [HERE, "/docs/en/"] } };
  // نصٌّ اصطناعي بطولٍ محدَّد تمامًا: «Zzq <وسم>» ثم كلماتٌ لاتينية، وآخره حرف
  var WORDS = ["alpha", "bravo", "charlie", "delta", "echo", "foxtrot", "golf", "hotel"];
  function longText(tag, n) {
    var s = "Zzq " + tag, i = 0;
    while (s.length < n) s += " " + WORDS[i++ % WORDS.length];
    s = s.slice(0, n);
    return s.charAt(n - 1) === " " ? s.slice(0, n - 1) + "z" : s;
  }
  var T = {
    l300: longText("edge three hundred", 300),
    l301: longText("untranslated just above the old cap", 301),
    l450: longText("untranslated long title", 450),
    l1200: longText("untranslated very long title", 1200),
    h450: longText("untranslated long group heading", 450),
    short: "Zzq short untranslated page",
    tr450: longText("translated long title", 450),
    keep450: longText("kept English long title", 450),
  };
  // مفتاحٌ اصطناعي طويل يترجمه القاموس، واسمٌ طويل يبقى بالإنجليزية بقاعدة النطاق — في هذه الصفحة وحدها
  D.strings[T.tr450] = "عنوانٌ طويلٌ مترجَم للاختبار";
  if (!Array.isArray(L.keep)) L.keep = [];
  L.keep.push(T.keep450);
  function fixtureMain() {
    return ["# Test index", "", "## English", "",
      "### " + T.h450, "",
      "- [" + T.l300 + "](/docs/en/zzq-a.md)",
      "- [" + T.l301 + "](/docs/en/zzq-b.md)",
      "- [" + T.l450 + "](/docs/en/zzq-c.md)",
      "- [" + T.l1200 + "](/docs/en/zzq-d.md)",
      "- [" + T.short + "](/docs/en/zzq-e.md)",
      "- [" + T.tr450 + "](/docs/en/zzq-f.md)",
      "- [" + T.tr450 + " (Beta)](/docs/en/api/beta/zzq-g.md)",
      "- [" + T.keep450 + "](/docs/en/zzq-h.md)",
      ""].join("\n");
  }
  var FIXTURE = fixtureMain();
  var realFetch = window.fetch;
  window.fetch = function (u, o) {
    if (String(u && u.url || u).indexOf("/__cml-scanlong-fixture.txt") >= 0)
      return Promise.resolve(new Response(FIXTURE, { status: 200, headers: { "content-type": "text/plain" } }));
    return realFetch.apply(window, arguments);
  };
</script>
<script src="../extension/engine.js"></script>
<script>
(function () {
  var tb = document.querySelector("#tbl tbody"), pass = 0, total = 0;
  function check(name, expect, got) {
    total++; var ok = String(expect) === String(got); if (ok) pass++;
    var tr = document.createElement("tr");
    [name, expect, got].forEach(function (v) { var td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
    var s = document.createElement("td"); s.className = ok ? "ok" : "bad"; s.textContent = ok ? "✓" : "✗"; tr.appendChild(s);
    tb.appendChild(tr);
    document.title = "scanlong " + pass + "/" + total + " …";
  }
  function done() { document.title = "scanlong " + pass + "/" + total; }
  var C = CMLConst, K = C.key("cml_scan_result", "docs");
  function utf8(s) { return new TextEncoder().encode(s).length; }
  function scan(id) {
    return new Promise(function (res) {
      var before = window.__store[K] && window.__store[K].at;
      chrome.storage.local.set({ cml_scan_request: { d: "docs", kind: "scan", at: Date.now(), id: id } });
      var t0 = Date.now();
      var poll = setInterval(function () {
        var r = window.__store[K];
        if ((!r || (r.status !== "done" && r.status !== "error") || r.at === before) && Date.now() - t0 < 20000) return;
        clearInterval(poll);
        res(r || {});
      }, 100);
    });
  }
  setTimeout(function () { run().then(done, function (e) { check("استثناء في الاختبار", "", String(e && (e.stack || e.message) || e).slice(0, 400)); done(); }); }, 300);

  async function run() {
    var r = await scan("s1");
    var list = r.list || [], vars = r.varList || [];
    document.getElementById("log").textContent = JSON.stringify({ status: r.status, found: r.found, missing: r.missing, kept: r.kept, badge: r.badge,
      lens: list.map(function (s) { return s.length; }) });
    check("تمهيد: الفحص انتهى من فهرس الصفحات الاصطناعي، وأطوال النصوص كما بُنيت", "done/llms/300/301/450/1200",
      r.status + "/" + r.source + "/" + T.l300.length + "/" + T.l301.length + "/" + T.l450.length + "/" + T.l1200.length);
    check("★ (ر29-ط) عناوين غير مترجمة أطول من 300 حرف (301 و450 و1,200) في القائمة بنصّها كاملًا، فتبلغ «أمر الترجمة»", "true/true/true",
      (list.indexOf(T.l301) >= 0) + "/" + (list.indexOf(T.l450) >= 0) + "/" + (list.indexOf(T.l1200) >= 0));
    check("★ (ر29-ط) وعنوان مجموعةٍ من 450 حرفًا (مجموعةٌ فيها صفحةٌ في المسار) في القائمة كذلك", "true", list.indexOf(T.h450) >= 0);
    check("★ (ر29-ط) والطويل الذي يترجمه القاموس مغطًّى كالقصير: لا هو ولا عنوانه بشارة « (Beta)» في القائمة، والشارة معدودة (badge)", "false/false/1",
      (list.indexOf(T.tr450) >= 0) + "/" + (list.indexOf(T.tr450 + " (Beta)") >= 0) + "/" + r.badge);
    check("★ (ر29-ط) والطويل الذي يبقى بالإنجليزية بقاعدة النطاق مغطًّى ومعدودٌ في kept", "false/1", (list.indexOf(T.keep450) >= 0) + "/" + r.kept);
    check("ولا يتغيّر ما دون الحدّ القديم: عنوانٌ من 300 حرف وآخر قصير في القائمة، وfound عدد العناوين كلها، وmissing طول القائمتين",
      "true/true/9/6/6/0", (list.indexOf(T.l300) >= 0) + "/" + (list.indexOf(T.short) >= 0) + "/" + r.found + "/" + r.missing + "/" +
      (list.length + vars.length) + "/" + (r.omitted === undefined ? "?" : r.omitted));

    // حدّ الحجم مع الطويل: 40 عنوانًا من 450 حرفًا (نحو 18 ك.ب) بحدٍّ من 6,000 بايت ⇒ قصٌّ بالحجم، وما بقي خارجه معدود، والمخزَّن دونه
    var MAX = 6000, keepMax = C.SCAN_MAX_BYTES;
    var many = ["# Test index", "", "## English", ""];
    for (var i = 1; i <= 40; i++) many.push("- [" + longText("bound " + ("00" + i).slice(-2), 450) + "](/docs/en/zzq-m" + i + ".md)");
    C.SCAN_MAX_BYTES = MAX;
    FIXTURE = many.join("\n") + "\n";
    var r2 = await scan("s2");
    var l2 = r2.list || [], v2 = r2.varList || [];
    var b2 = 0; l2.concat(v2).forEach(function (s) { b2 += utf8(JSON.stringify(s)) + 1; });
    check("★ (ر29-ط) وحدّ الحجم باقٍ مع الطويل: 40 عنوانًا من 450 حرفًا فوق حدٍّ صغير ⇒ علامة القصّ، والعدّ الحقيقي 40، وما بقي خارج القائمة معدودٌ بعينه، والمخزَّن دون الحدّ",
      "true/40/true/true/true/true", !!r2.capped + "/" + r2.missing + "/" + (r2.omitted === r2.missing - l2.length - v2.length) + "/" + (r2.omitted > 0) + "/" +
      (l2.length > 0 && l2.every(function (s) { return s.length === 450; })) + "/" + (b2 <= MAX));
    // ونصٌّ أطول من الحدّ كله (7,000 حرف): يُعدّ ولا يُخزَّن، ولا يسقط بصمت
    FIXTURE = ["# Test index", "", "## English", "", "- [" + longText("larger than the whole bound", 7000) + "](/docs/en/zzq-x.md)", ""].join("\n");
    var r3 = await scan("s3");
    C.SCAN_MAX_BYTES = keepMax;
    check("★ (ر29-ط) ونصٌّ أطول من الحدّ كله يُعدّ خارج القائمة (omitted) ولا يُخزَّن، ولا يسقط بصمت", "done/1/0/true/1",
      r3.status + "/" + r3.missing + "/" + (r3.list || []).length + "/" + !!r3.capped + "/" + r3.omitted);
    check("والحدّ المشحون كما هو بعد الاختبار (2 م.ب)", 2 * 1024 * 1024, C.SCAN_MAX_BYTES);
    check("لا أخطاء جافاسكربت في الصفحة", 0, jsErrors);
  }
})();
</script>
</body>
</html>
