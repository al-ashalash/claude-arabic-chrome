<!--
  عنوان التبويب (<title>) — قرار المالك (١٩ ربيع الآخر ١٤٤٨هـ): «ترجم كل شيء إلا ما استُثني من الأكواد أو الرموز ونحوه»
  يشمل عنوان التبويب في المواقع كلها. وحدة العنوان في المحرّك (syncTitle): العنوان كاملًا من القاموس، وإلا فما قبل ذيله
  (meta.titleSuffix) بالبحث الذي للنصوص (القاموس والجموع والأنماط) والذيلُ باسمه من قاموس الموقع أو titleKeep؛ وما لم يُترجم
  يبقى العنوان كلّه على أصله (لا مختلط). مسارات titleSkip (عنوانها محتوى المستخدم) لا تُمسّ، وما كتبناه يُرجع عند التنقّل إليها
  وعند الإطفاء ومفتاح الموقع وحارس لغة الموقع. ولا تقاذف مع موقعٍ يعيد عنوانه (قفلٌ على <head> كالذي في حزم claude.ai).
  يعمل بجدول نطاق التطبيق نفسه (CMLConst.domain("app").meta) وقاموسٍ صغيرٍ مضبوط، ويفحص ذيول المواقع الأخرى في قواميسها المبنيّة.
  العقد: document.title = "titletest N/N".
-->

  meta: Object.assign({}, APPM, { titleSuffix: APPM.titleSuffix.concat([" | Test Center", " | Unknown Hub", " \\ Test Center"]) }),

    patterns: [{ re: "^Page ([0-9]+)$", ar: "الصفحة $1", en: "Page {n}" },
               { re: "^Add (.+)$", ar: "إضافة $1", en: "Add {name}" }],   // نمطٌ عريض كأنماط القاموس («Add {name}»)
    plurals: { "%d file": { plural: "%d files", forms: ["لا ملفات", "ملف واحد", "ملفان", "%d ملفات", "%d ملفًا", "%d ملف"] } } } } };

<script>
var tb = document.querySelector("#tbl tbody"), pass = 0, total = 0;
function check(name, expect, got) {
  total++; var ok = String(expect) === String(got); if (ok) pass++;
  var tr = document.createElement("tr");
  [name, expect, got].forEach(function (v) { var td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
  var s = document.createElement("td"); s.className = ok ? "ok" : "bad"; s.textContent = ok ? "✓" : "✗"; tr.appendChild(s);
  tb.appendChild(tr);
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
var RLM = String.fromCharCode(0x200F);
var AR_CH = new RegExp("[" + String.fromCharCode(0x600) + "-" + String.fromCharCode(0x6FF) + "]");
function noBidi(s) { return String(s).replace(new RegExp("[" + String.fromCharCode(0x2066) + "-" + String.fromCharCode(0x2069) + "]", "g"), ""); }
function T() { return document.title.split(RLM).join(""); }
function titleEl() { return document.querySelector("head > title"); }
function render(txt) { var p = document.createElement("p"); p.textContent = txt; document.getElementById("host").appendChild(p); return p; }
function setTitle(s) { document.title = s; return wait(60); }
var UUID = "3f2a9c1e-7b4d-4e8a-9c2b-1d5e6f7a8b9c";
var H = document.documentElement;
function loadDict(f) {
  return new Promise(function (res) {
    var s = document.createElement("script");
    s.src = "../extension/" + f;
    s.onload = function () { res(globalThis.CLAUDE_L10N); };
    s.onerror = function () { res(null); };
    document.body.appendChild(s);
  });
}
