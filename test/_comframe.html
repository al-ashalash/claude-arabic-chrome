<script>
var CM = CMLConst.domain("com");
CM.status = { full: true };
var CALLS = { get: 0 };
var MOCK = makeChromeMock({ session: false, sendMessage: function (m, cb) { if (cb) cb(null); } });
var realGet = MOCK.chrome.storage.local.get;
MOCK.chrome.storage.local.get = function () { CALLS.get++; return realGet.apply(this, arguments); };
Object.assign(MOCK.localStore, { cml_enabled: true, cml_rtl: true });
window.chrome = MOCK.chrome;
window.CLAUDE_L10N = { domain: "com", meta: Object.assign({}, CM.meta, { live: false }), default: "ar", langs: [{ code: "ar" }],

history.replaceState({}, "", "/pricing");
</script>

  };
