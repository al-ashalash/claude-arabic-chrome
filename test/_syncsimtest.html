<!--
  محاكاة المزامنة بأجهزةٍ متعددة (المراجعة المستقلة ١٢ ربيع الآخر ١٤٤٨هـ).

  كل جهازٍ إطارٌ مستقل بنسخته من cml-sync.js (قفلُه ودفاتره في ذاكرته)، ومخزنٌ محلي، ونسخةٌ
  محلية من مساحة المزامنة. وخادمٌ بنموذج «آخرُ واصلٍ يغلب» لكل مفتاح: كتابةُ الجهاز تقع في
  نسخته فورًا، وتصل الخادمَ حين «يتصل»، ثم تُبثّ إلى البقية دفعةً دفعة — فتقع التمزّقات
  (شرائحُ جهازٍ تحت ميتا غيره) والتعارضات (دفعتان متزامنتان يغلب آخرهما وصولًا) والغياب
  (جهازٌ غير متصل يدفع إلى نسخته ثم تغلبه لقطةُ غيره) كما في المتصفح.

  وسلوك العامل مُحاكى: كتابةُ التصحيحات (من المستخدم أو من الدمج) تسجّل شواهدَ ما حُذف وتُجدول
  جولةً محلية، وحدثُ السحابة يمرّ بـhandleSyncChange، ومواعيدُ الإعادة (retryAt) تُحترم بساعةٍ منطقية.

  الثوابت المفحوصة بعد السكون:
   (ث١) التقارب: الأجهزة كلها متطابقة، ولقطة الخادم صالحةٌ ومطابقة لها.
   (ث٢) لا فقد: كل عنصرٍ أُضيف ولم يحذفه أحدٌ قط موجودٌ في النهاية بإحدى قيمه المكتوبة.
  ثم حالاتٌ مسمّاة لما كشفته المراجعة: الإضافة دون اتصال، والمسح ثم جهازٌ جديد، والتمزّق
  المتشابك، والشاهد المتقادم، والحذف المتسلسل.
  العقد: document.title = "syncsim N/N".
-->

<h1>محاكاة المزامنة بأجهزةٍ متعددة</h1>
<table id="tbl"><thead><tr><th>الحالة</th><th>المتوقَّع</th><th>الناتج</th><th></th></tr></thead><tbody></tbody></table>
<script>
var jsErrors = 0; window.onerror = function () { jsErrors++; };
document.title = "syncsim …";
var tb = document.querySelector("#tbl tbody"), pass = 0, total = 0;
function check(name, expect, got) {
  total++; var ok = String(expect) === String(got); if (ok) pass++;
  var tr = document.createElement("tr");
  [name, expect, got].forEach(function (v) { var td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
  var s = document.createElement("td"); s.className = ok ? "ok" : "bad"; s.textContent = ok ? "✓" : "✗"; tr.appendChild(s);
  tb.appendChild(tr);
}
function cp(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ===== إطارات الأجهزة: كلٌّ بنسخته من الوحدة =====
// v1: نواة 1.0.0 المجمَّدة (assets/v1core — مطابقةٌ بايتًا لحزمة المتجر) لاختبار الترقية والخلط
function makeFrame(version) {
  return new Promise(function (res, rej) {
    var f = document.createElement("iframe");
    f.style.display = "none";
    var base = version === "v1" ? "assets/v1core/" : "../extension/";
    f.srcdoc = '<script src="' + base + 'cml-const.js"><\/script>' +
      '<script src="' + base + 'cml-shared.js"><\/script>' +
      '<script src="' + base + 'cml-sync.js"><\/script>';
    f.onload = function () {
      if (!f.contentWindow.CMLSync) { rej(new Error("لم تُحمَّل الوحدة في الإطار")); return; }
      res(f);
    };
    document.body.appendChild(f);
  });
}

// ===== العالم: خادم وأجهزة وساعة =====
function World(n, frames, seed) {
  var W = this;
  W.clock = 1700000000000;
  W.server = {};                    // مفتاح ← قيمة
  W.rng = mulberry32(seed || 1);
  W.devs = [];
  W.ops = [];                       // سجلّ عمليات المستخدم: {dev, kind, key, value, seq}
  W.seq = 0;
  var Kc = frames[0].contentWindow.CMLConst.K;
  W.K = Kc;
  for (var i = 0; i < n; i++) W.devs.push(new Device(W, i, frames[i]));
}
function Device(W, id, frame) {
  var D = this;
  D.W = W; D.id = id; D.name = "D" + id;
  D.S = frame.contentWindow.CMLSync;
  D.local = {}; D.replica = {};
  D.outbox = []; D.inbox = [];
  D.online = true;
  D.localTask = null;               // جولة محلية مجدولة (طابور العامل)
  D.retry = null;                   // {kind, at}
  var K = W.K;
  D.env = {
    getLocal: function (keys, cb) {
      var o = {};
      for (var i = 0; i < keys.length; i++) if (D.local[keys[i]] !== undefined) o[keys[i]] = cp(D.local[keys[i]]);
      cb(o);
    },
    setLocal: function (obj, cb) {
      var ch = {};
      for (var k in obj) { ch[k] = { oldValue: cp(D.local[k]), newValue: cp(obj[k]) }; D.local[k] = cp(obj[k]); }
      cb(null);
      D.onLocalChanged(ch);
    },
    removeLocal: function (keys, cb) {
      var ch = {};
      for (var i = 0; i < keys.length; i++) {
        if (D.local[keys[i]] !== undefined) ch[keys[i]] = { oldValue: cp(D.local[keys[i]]) };
        delete D.local[keys[i]];
      }
      cb(null);
      D.onLocalChanged(ch);
    },
    getSyncAll: function (cb) { cb(cp(D.replica)); },
    setSync: function (obj, cb) {
      // حصص كروم على النسخة المحلية نفسها
      var bytes = 0, k, next = cp(D.replica);
      for (k in obj) next[k] = cp(obj[k]);
      for (k in next) bytes += D.S.byteLen(k) + D.S.jsonBytes(next[k]);
      if (bytes > 102400) { cb("QUOTA_BYTES quota exceeded"); return; }
      var ch = {}, batch = [];
      for (k in obj) { ch[k] = { oldValue: cp(D.replica[k]), newValue: cp(obj[k]) }; D.replica[k] = cp(obj[k]); batch.push({ k: k, v: cp(obj[k]) }); }
      D.outbox.push(batch);
      cb(null);
      D.queueSyncEvent(ch);
    },
    removeSync: function (keys, cb) {
      var ch = {}, batch = [];
      for (var i = 0; i < keys.length; i++) {
        ch[keys[i]] = { oldValue: cp(D.replica[keys[i]]) };
        delete D.replica[keys[i]];
        batch.push({ k: keys[i], del: true });
      }
      D.outbox.push(batch);
      cb(null);
      D.queueSyncEvent(ch);
    },
    now: function () { return W.clock + (D.skew || 0); },
  };
  D.syncEvents = [];
}
Device.prototype.onLocalChanged = function (ch) {
  // كما يفعل العامل: تغيّرُ التصحيحات أو القواعد ⇒ شواهدُ ما حُذف + جولةٌ محلية مجدولة
  var K = this.W.K, S = this.S;
  if (!ch[K.OVERRIDES] && !ch[K.USER_PATTERNS]) return;
  if (this.local[K.SYNC_ENABLED] !== true) return;
  var removed = [];
  if (ch[K.OVERRIDES]) removed = S.diffRemovedKeys(ch[K.OVERRIDES].oldValue, ch[K.OVERRIDES].newValue);
  if (ch[K.USER_PATTERNS]) removed = removed.concat(S.diffRemovedRules(ch[K.USER_PATTERNS].oldValue, ch[K.USER_PATTERNS].newValue));
  var stamp = this.W.clock;
  if (removed.length) this.pendingTombs = (this.pendingTombs || []).concat([{ r: removed, at: stamp }]);
  else this.local[K.SYNC_PENDING] = stamp;
  var acc = this.localTask || {};
  for (var k in ch) {
    if (k !== K.OVERRIDES && k !== K.USER_PATTERNS) continue;
    if (!acc[k]) acc[k] = { oldValue: ch[k].oldValue, newValue: ch[k].newValue };
    else acc[k].newValue = ch[k].newValue;
  }
  this.localTask = acc;
};
Device.prototype.queueSyncEvent = function (ch) { this.syncEvents.push(ch); };
Device.prototype.flushTombs = function () {
  var D = this, p = D.pendingTombs || [], K = D.W.K;
  D.pendingTombs = null;
  var chain = Promise.resolve();
  p.forEach(function (x) {
    chain = chain.then(function () {
      if (typeof D.S.recordTombs === "function") return D.S.recordTombs(D.env, x.r, x.at);
      // عامل 1.0.0: يكتب الشاهد والطابع مباشرةً
      var t = cp(D.local[K.SYNC_TOMBS] || {});
      x.r.forEach(function (k) { t[k] = x.at; });
      D.local[K.SYNC_TOMBS] = D.S.pruneTombs(t, x.at);
      D.local[K.SYNC_PENDING] = x.at;
    });
  });
  return chain;
};
// ترقيةٌ في مكانها: الجهاز نفسه (مخزنه ونسخته) بنواةٍ أخرى — كما يفعل تحديث المتجر
Device.prototype.swapCore = function (frame) { this.S = frame.contentWindow.CMLSync; };
Device.prototype.runLocal = function () {
  var D = this, acc = D.localTask;
  D.localTask = null;
  return D.flushTombs().then(function () { return D.S.handleLocalChange(D.env, acc); }).then(function (r) { D.noteRetry(r); return r; });
};
Device.prototype.runSyncEvent = function () {
  var D = this, ch = D.syncEvents.shift();
  if (!ch) return Promise.resolve(null);
  return D.S.handleSyncChange(D.env, ch).then(function (r) { D.noteRetry(r); return r; });
};
Device.prototype.noteRetry = function (r) {
  if (r && r.retryAt && (!this.retry || r.retryAt < this.retry.at)) this.retry = { kind: r.retry, at: r.retryAt };
};
Device.prototype.runRetry = function () {
  var D = this, rt = D.retry;
  D.retry = null;
  var K = D.W.K;
  var synth = {}; synth[K.SYNC_META] = {};
  var p = rt.kind === "sync" ? D.S.handleSyncChange(D.env, synth) : D.flushTombs().then(function () { return D.S.handleLocalChange(D.env, null); });
  return p.then(function (r) { D.noteRetry(r); return r; });
};
// الاتصال: دفعةٌ من صندوق الجهاز تصل الخادم، فتُبثّ إلى كل نسخةٍ تخالفه
Device.prototype.deliverOut = function () {
  var W = this.W, batch = this.outbox.shift();
  if (!batch) return;
  for (var i = 0; i < batch.length; i++) {
    var op = batch[i];
    if (op.del) delete W.server[op.k]; else W.server[op.k] = cp(op.v);
  }
  var keys = batch.map(function (o) { return o.k; });
  W.devs.forEach(function (d) { d.inbox.push(keys); });
};
// وصولُ ما في الخادم إلى نسخة الجهاز (دفعةً بمفاتيحها): ما خالف نسختَه يُطبَّق ويولّد حدثًا
Device.prototype.deliverIn = function () {
  var W = this.W, keys = this.inbox.shift();
  if (!keys) return;
  var ch = {}, any = false;
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i], sv = W.server[k], lv = this.replica[k];
    if (JSON.stringify(sv) === JSON.stringify(lv)) continue;
    // كتابةٌ محلية لم تصل الخادم بعد لهذا المفتاح تبقى (تصل لاحقًا فتغلب إن وصلت آخِرًا)
    var pendingLocal = this.outbox.some(function (b) { return b.some(function (o) { return o.k === k; }); });
    if (pendingLocal) continue;
    ch[k] = { oldValue: cp(lv), newValue: cp(sv) };
    if (sv === undefined) delete this.replica[k]; else this.replica[k] = cp(sv);
    any = true;
  }
  if (any) this.syncEvents.push(ch);
};
// تعديلات المستخدم
Device.prototype.userSet = function (key, value) {
  var K = this.W.K;
  var ov = cp(this.local[K.OVERRIDES] || {});
  ov.ar = ov.ar || {};
  var old = cp(this.local[K.OVERRIDES] || {});
  ov.ar[key] = value;
  this.local[K.OVERRIDES] = ov;
  this.W.ops.push({ dev: this.id, kind: "set", key: key, value: value, seq: this.W.seq++ });
  this.onLocalChanged(kvCh(K.OVERRIDES, old, ov));
};
Device.prototype.userDel = function (key) {
  var K = this.W.K;
  var ov = cp(this.local[K.OVERRIDES] || {});
  if (!ov.ar || ov.ar[key] === undefined) return false;
  var old = cp(this.local[K.OVERRIDES]);
  delete ov.ar[key];
  this.local[K.OVERRIDES] = ov;
  this.W.ops.push({ dev: this.id, kind: "del", key: key, seq: this.W.seq++ });
  this.onLocalChanged(kvCh(K.OVERRIDES, old, ov));
  return true;
};
function kvCh(k, o, n) { var c = {}; c[k] = { oldValue: o, newValue: n }; return c; }
// القواعد الذكية بترتيب صفحة الإعدادات (ترتيبها كما يكتبه المستخدم)
Device.prototype.userRules = function (list) {
  var K = this.W.K, old = cp(this.local[K.USER_PATTERNS] || []);
  this.local[K.USER_PATTERNS] = cp(list);
  this.onLocalChanged(kvCh(K.USER_PATTERNS, old, list));
};
Device.prototype.keys = function () { return Object.keys(((this.local[this.W.K.OVERRIDES] || {}).ar) || {}).sort(); };
Device.prototype.ov = function () { return ((this.local[this.W.K.OVERRIDES] || {}).ar) || {}; };

World.prototype.step = function () {
  // خطوةٌ عشوائية واحدة؛ تُعاد وعدًا يكتمل حين تسكن سلاسلها
  var W = this, r = W.rng(), d = W.devs[Math.floor(W.rng() * W.devs.length)];
  W.clock += Math.floor(W.rng() * 4000);
  var acts = [];
  if (r < 0.22) {
    var key = "k" + Math.floor(W.rng() * 12);
    d.userSet(key, key + "@" + d.name + "#" + W.seq);
  } else if (r < 0.30) {
    var ks = d.keys(); if (ks.length) d.userDel(ks[Math.floor(W.rng() * ks.length)]);
  } else if (r < 0.40) {
    d.online = !d.online || W.rng() < 0.3;
  } else if (r < 0.55) {
    if (d.localTask) acts.push(d.runLocal());
  } else if (r < 0.70) {
    if (d.online && d.outbox.length) d.deliverOut();
  } else if (r < 0.82) {
    if (d.online && d.inbox.length) d.deliverIn();
  } else if (r < 0.95) {
    if (d.syncEvents.length) acts.push(d.runSyncEvent());
    // أحيانًا جولتان معًا على الجهاز نفسه (فيُمتحن التأجيل والتصريف)
    if (W.rng() < 0.3 && d.localTask) acts.push(d.runLocal());
  } else {
    if (d.retry && d.retry.at <= W.clock) acts.push(d.runRetry());
  }
  return Promise.all(acts);
};
World.prototype.quiesce = function () {
  var W = this, rounds = 0;
  W.devs.forEach(function (d) { d.online = true; });
  function busy() {
    return W.devs.some(function (d) {
      return d.localTask || d.outbox.length || d.inbox.length || d.syncEvents.length || d.retry || (d.pendingTombs && d.pendingTombs.length) ||
        (d.local[W.K.SYNC_PENDING] && !d.localTask);
    });
  }
  function once() {
    rounds++;
    if (rounds > 400 || !busy()) return Promise.resolve(rounds);
    var acts = [];
    W.clock += 3000;
    W.devs.forEach(function (d) {
      while (d.outbox.length) d.deliverOut();
    });
    W.devs.forEach(function (d) { while (d.inbox.length) d.deliverIn(); });
    var chain = Promise.resolve();
    W.devs.forEach(function (d) {
      chain = chain.then(function () {
        // عددٌ مُثبَّت: الطابور لا ينقص إلا حين تجري الوعود، فالشرط عليه حلقةٌ لا تنتهي
        var c = Promise.resolve(), n = d.syncEvents.length;
        for (var q = 0; q < n; q++) c = c.then(function () { return d.runSyncEvent(); });
        return c;
      }).then(function () {
        if (d.localTask) return d.runLocal();
        if (d.local[W.K.SYNC_PENDING]) return d.flushTombs().then(function () { return d.S.handleLocalChange(d.env, null); }).then(function (r) { d.noteRetry(r); });
      }).then(function () {
        if (d.retry) {
          if (d.retry.at > W.clock) W.clock = d.retry.at + 1;
          return d.runRetry();
        }
      });
    });
    return chain.then(once);
  }
  return once();
};
World.prototype.enableAll = function () {
  var W = this;
  W.devs.forEach(function (d) { d.local[W.K.SYNC_ENABLED] = true; d.local[W.K.SYNC_DEVICE] = "dev" + d.id; });
};
// الثوابت
World.prototype.verdict = function () {
  var W = this, S = W.devs[0].S, K = W.K;
  var hashes = W.devs.map(function (d) { return S.hashPayload(S.sanitizePayload({ overrides: d.local[K.OVERRIDES] || {}, patterns: d.local[K.USER_PATTERNS] || [] })); });
  var converged = hashes.every(function (h) { return h === hashes[0]; });
  var snap = S.unpack(cp(W.server));
  var cloudOk = !!snap && S.hashPayload(S.sanitizePayload(snap.payload)) === hashes[0];
  // لا فقد: عنصرٌ لم يحذفه أحدٌ قط موجودٌ بإحدى قيمه
  var deleted = {}, values = {};
  W.ops.forEach(function (o) {
    if (o.kind === "del") deleted[o.key] = 1;
    else (values[o.key] = values[o.key] || {})[o.value] = 1;
  });
  var lost = [], d0 = W.devs[0].ov();
  Object.keys(values).forEach(function (k) {
    if (deleted[k]) return;
    if (d0[k] === undefined || !values[k][d0[k]]) lost.push(k);
  });
  return { converged: converged, cloudOk: cloudOk, lost: lost };
};

// ===== الحالات =====
async function frames(n) { var out = []; for (var i = 0; i < n; i++) out.push(await makeFrame()); return out; }
function freshFramesEach(n) { return frames(n); }

async function namedCases() {
  var K;
  // (أ) إضافةٌ دون اتصال تغلبها لقطةُ جهازٍ لم يرها (الخادم يأخذ آخر واصل): لا تضيع
  {
    var W = new World(2, await freshFramesEach(2), 11); K = W.K; W.enableAll();
    var A = W.devs[0], B = W.devs[1];
    A.userSet("x", "إكس"); await W.quiesce();
    A.online = false;
    A.userSet("a", "أ"); await A.runLocal();           // يدفع إلى نسخته وحدها
    B.userSet("b", "ب"); await B.runLocal(); B.deliverOut(); // يصل الخادمَ أولًا
    A.online = true; A.deliverOut();                    // يصل بعده فيغلبه
    // ثم عكسُ الترتيب في جولةٍ ثانية: لقطةُ B تصل آخِرًا فتغلب لقطةَ A
    A.userSet("a2", "أ٢"); await A.runLocal();
    B.userSet("b2", "ب٢"); await B.runLocal();
    A.deliverOut(); B.deliverOut();
    await W.quiesce();
    var v = W.verdict();
    check("★ (أ) الإضافة دون اتصال والتعارض بالترتيبين: تقارب ولا فقد", "true/true/-",
      v.converged + "/" + v.cloudOk + "/" + (v.lost.join(",") || "-"));
  }
  // (ب) المسح ثم جهازٌ جديد بلا تصحيحات يفعّل المزامنة: تصحيحات البقية لا تُمحى
  {
    var W2 = new World(3, await freshFramesEach(3), 12); K = W2.K;
    var A2 = W2.devs[0], B2 = W2.devs[1], N2 = W2.devs[2];
    [A2, B2].forEach(function (d) { d.local[K.SYNC_ENABLED] = true; d.local[K.SYNC_DEVICE] = "dev" + d.id; });
    A2.userSet("x", "إكس"); A2.userSet("y", "واي");
    await W2.quiesce();
    var wr = await A2.S.admin(A2.env, "reset", { wipe: true });
    A2.deliverOut(); await W2.quiesce();
    N2.local[K.SYNC_ENABLED] = true; N2.local[K.SYNC_DEVICE] = "devN";
    N2.localTask = {}; await W2.quiesce();
    A2.local[K.SYNC_ENABLED] = true; A2.local[K.SYNC_DEVICE] = "devA2"; A2.localTask = {}; await W2.quiesce();
    var bk = B2.keys().join(",");
    check("★ (ب) ضبطٌ مع مسح ثم أجهزةٌ فارغة تفعّل: B يبقى بـx,y وتعود السحابة بهما", "true/x,y/x,y",
      !!(wr && wr.reset) + "/" + bk + "/" + Object.keys((W2.devs[0].S.unpack(cp(W2.server)) || { payload: { overrides: {} } }).payload.overrides.ar || {}).sort().join(","));

function oracleOf(ops) {

  return m;
}

function oracleOk(W) {
  var want = stateStr(oracleOf(W.ops));
  return W.devs.every(function (d) { return stateStr(d.ov()) === want; });
}

// محاكاةٌ تسلسلية بمقارنةٍ بالمتوقَّع: كاتبٌ واحد في كل طور، وسكونٌ تام بين الأطوار، وأجهزةٌ
// خاملة قد تغيب عن طورٍ كامل، وساعاتٌ منحرفة — والناتج يجب أن يساوي العمليات بترتيبها
async function seqFuzz() {
  var runs = 14, phases = 12, bad = [], dels = 0;

    fr = await frames(3);

    W.devs.forEach(function (d, i) { d.skew = (i - 1) * 7 * 60 * 1000 * (s % 2 ? 1 : 0); });
    for (var ph = 0; ph < phases; ph++) {

      var nops = 1 + Math.floor(W.rng() * 5);

        var ks = w.keys();

        else { var k = "k" + Math.floor(W.rng() * 8); w.userSet(k, k + "@" + w.name + "#" + W.seq); }
        await w.runLocal();

    if (!oracleOk(W)) bad.push("seed " + (3000 + s) + ": " + W.devs.map(function (d) { return stateStr(d.ov()); }).join(" | ") + " ≠ " + stateStr(oracleOf(W.ops)));

        bad.length + (bad.length ? " | " + bad.slice(0, 2).join(" ; ") : ""));
  check("والتسلسلية امتحنت الحذف فعلًا", "true", dels > 20);
}

  {

    A8.userSet("x", "X"); await W8.quiesce();
    B8.swapCore(await v2f()); C8.swapCore(await v2f());
    for (var q = 0; q < 6; q++) { W8.clock += 30000; B8.userSet("k", "B" + q); await W8.quiesce(); }
    W8.clock += 60000;
    A8.userSet("z", "Z"); await W8.quiesce();          // آخرُ دفعةٍ من A وهو على 1.0.0 (بلا x)
    A8.swapCore(await v2f());
    W8.clock += 60000;
    A8.userSet("k", "A-بعد-الترقية"); await W8.quiesce();
    check("★ (ق) أول كتابةٍ بعد الترقية في المكان تغلب الأقدم منها", "A-بعد-الترقية|A-بعد-الترقية|A-بعد-الترقية",
          [A8, B8, C8].map(function (d) { return d.ov().k; }).join("|"));
  }
  // (ر) مجموعةٌ تسعها المساحة بلا x ولا تسعها معه: تُدفع بلا x ولا «فيض»
  {
    var fr9 = [await makeFrame(), await makeFrame()];
    var W9 = new World(2, fr9, 39); W9.enableAll();
    var A9 = W9.devs[0], B9 = W9.devs[1], S9 = A9.S, n = 0, ov = { ar: {} };
    // نملأ حتى تفيض مع x وتسع بدونها (قياسٌ لا تخمين)
    while (true) {
      ov.ar["Key number " + n + " with some text"] = "قيمة عربية للمفتاح رقم " + n;
      var bare = S9.pack({ overrides: ov, patterns: [] }, { cap: 92000 });
      if (!bare.fits) { delete ov.ar["Key number " + n + " with some text"]; break; }
      n++;
    }
    var dots = {}, vvx = {}; vvx["dev0"] = 3000000;
    Object.keys(ov.ar).forEach(function (k) { dots["ar|" + k] = ["dev0", 3000000]; });
    var withX = S9.pack({ overrides: ov, patterns: [] }, { cap: 92000, x: S9.encodeX({ overrides: ov, patterns: [] }, dots, vvx) });
    A9.local[W9.K.OVERRIDES] = ov;
    A9.onLocalChanged(kvCh(W9.K.OVERRIDES, {}, ov));
    await W9.quiesce();
    var st = A9.local[W9.K.SYNC_STATE] || {};
    check("★ (ر) قرب السقف: ما يسعه 1.0.0 يُدفع بلا x بدل «فيض» ويصل الآخر", "false/ok/" + Object.keys(ov.ar).length,
          withX.fits + "/" + st.status + "/" + B9.keys().length);
  }
}

async function fuzz() {
  var runs = 24, steps = 60, bad = [], dels = 0;
  var fr = null;
  for (var s = 1; s <= runs; s++) {
    // إطاراتٌ جديدة لكل جولة: حالة الوحدة (القفل والعلامات) في ذاكرة كل جهاز
    if (fr) fr.forEach(function (f) { f.remove(); });
    fr = await frames(3);
    var W = new World(3, fr, 1000 + s);
    W.enableAll();
    for (var i = 0; i < steps; i++) await W.step();
    await W.quiesce();
    var v = W.verdict();
    dels += W.ops.filter(function (o) { return o.kind === "del"; }).length;
    if (!v.converged || !v.cloudOk || v.lost.length) bad.push("seed " + (1000 + s) + ": " + JSON.stringify(v));
  }
  check("★ (ث١+ث٢) محاكاة عشوائية: " + runs + " جولة × " + steps + " خطوة بثلاثة أجهزة — تقارب ولا فقد", "0",
    bad.length + (bad.length ? " | " + bad.slice(0, 3).join(" ; ") : ""));
  check("والمحاكاة امتحنت الحذف فعلًا", "true", dels > 10);
}

(async function () {
  try {
    await namedCases();
    await causalCases();
    await review3Cases();
    await seqFuzz();
    await fuzz();
  } catch (e) {
    check("استثناء غير متوقع", "(لا شيء)", String(e && e.stack || e).slice(0, 400));
  }
  check("لا أخطاء JS غير ملتقطة", "0", jsErrors);
  document.title = "syncsim " + pass + "/" + total;
  var h = document.createElement("p");
  h.className = pass === total ? "ok" : "bad";
  h.textContent = "SYNCSIM: " + pass + "/" + total + (pass === total ? " — all pass" : " — FAIL");
  document.body.appendChild(h);
})();
</script>
