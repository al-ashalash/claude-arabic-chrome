<!--
  ★ (ر29-د، ١٣ جمادى الأولى ١٤٤٨هـ) صمّام «nosel» (engine.js): أعاد موقعٌ بناء صفحاته فلم يطابق محدِّد المتن شيئًا (ر29-أ F1: الوثائق القانونية
  الخمس في 2.0.0 أسبوعًا: فقراتٌ إنجليزية من اليمين ومقاطع معرَّبة داخل جملها). بجدول النطاقات الحقيقي (meta النطاق legal، ومنه bodyRoutes)
  وصفحةٍ بالبنية القديمة (LegalPageDetail) لا يطابقها محدِّد المتن الحالي، بأسماء وحداتٍ وجزءٍ مجزَّأ مختلَق ونصٍّ تجريبي:
   ١) الجدول: مسارات المتن في النطاقات المشحونة (مقالات مركزي المساعدة والخصوصية، والوثائق الخمس، ووثائق المطوّرين وClaude Code)، ولا صمّام
      في الأكاديمية ولا claude.ai ولا claude.com.
   ٢) متنٌ لا يظهر أبدًا: لا حكم قبل استقرار الصفحة، ثم حجزٌ «nosel» — الصفحة كما هي (لا اتجاه ولا lang ولا ترجمة، ولا عنوانٌ في جملة ولا
      عنوانٌ يطابق القاموس)، والفقرة القديمة LTR، والنافذة تقول السبب، وتصحيح الفقرة يقول «محجوبة».
   ٣) التنقّل الناعم إلى مسارٍ ليس مسار متن (يمثّل الفهارس والقوائم: يُخرَج ‎/legal/aup‎ من bodyRoutes هنا وحده) يرفع الحجز، ولا يُحجز هناك.
   ٤) الرجوع إلى مسار المتن بلا متن: حجزٌ بعد السقف لا قبله؛ ثم يظهر المتن بعد 3 ث فيُرفع الحجز وحده ويُحكم للصفحة بقطعتها.
   ٥) صفحةٌ يطابق محدِّدُ متنها: لا حجز أبدًا.
   ٦) طافر ر29-ج M6: عنصر منتقي اللغة (siteLangSel) لا يُترجم ولو خرج من محدِّدات الإبقاء وطابق نصُّه القاموس، فلا يتقاذف الحارس.
   ٧) خلايا الجدول المبنيّ بعناصر div (role=cell وcolumnheader): الخليّة الإنجليزية الخالصة في متنٍ معرَّب LTR بنصّها.
   ٨) (مراجعة ر29-د) الحجز وصفُ الصفحة لا حالُ الإضافة: إطفاء الإضافة أو الموقع ثم تشغيله (وطفرةٌ من الموقع بينهما) لا يرفعه، وصفحةٌ
      بلا متنٍ استقرّت والإضافة مطفأة تُحجز فور تشغيلها — لا قلب ولا ترجمة لحظةً (كانا يقلبانها 2.5 ث).
  النصوص العربية هنا تجريبيةٌ للاختبار لا ترجمات. العقد: document.title الختامي = "nosel N/N".
-->

<script>
var tb = document.querySelector("#tbl tbody"), pass = 0, total = 0;
function check(name, expect, got) {
  total++; var ok = String(expect) === String(got); if (ok) pass++;
  var tr = document.createElement("tr");
  [name, expect, got].forEach(function (v) { var td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
  var s = document.createElement("td"); s.className = ok ? "ok" : "bad"; s.textContent = ok ? "✓" : "✗"; tr.appendChild(s);
  tb.appendChild(tr);
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
var MARKS = new RegExp("[" + String.fromCharCode(0x200E) + String.fromCharCode(0x200F) + String.fromCharCode(0x2066) + "-" + String.fromCharCode(0x2069) + "]", "g");
var AR = /[؀-ۿ]/;
function $(id) { return document.getElementById(id); }
function txt(id) { return $(id).textContent.replace(MARKS, "").replace(/\s+/g, " ").trim(); }
function dirOf(id) { return getComputedStyle($(id)).direction; }
function T() { return document.title.replace(MARKS, ""); }
var H = document.documentElement;
function attrs() { return ["dir", "lang", "data-cml", "data-cml-body"].map(function (a) { return H.getAttribute(a) || "-"; }).join("|"); }
function heldAttr() { return H.getAttribute("data-cml-held") || "-"; }
function hello() { var r = null; if (HELLO) HELLO({ type: "cml-hello" }, {}, function (x) { r = x; }); return r; }
function blockAt() { var r = null; if (HELLO) HELLO({ type: "cml-block-at" }, {}, function (x) { r = x; }); return r; }
function go(p) { history.pushState({}, "", p); $("wake").textContent = p; }
function setLocal(k, v) { var o = {}; o[k] = { oldValue: MOCK.localStore[k], newValue: v }; MOCK.localStore[k] = v; MOCK.fireChanged(o, "local"); }
// سجلّ الحجز: كل تبدّلٍ لسمة data-cml-held بلحظته من بدء المرحلة
var heldLog = [];
new MutationObserver(function () { heldLog.push(heldAttr()); }).observe(H, { attributes: true, attributeFilter: ["data-cml-held"] });
var cmlFlips = 0;
new MutationObserver(function () { cmlFlips++; }).observe(H, { attributes: true, attributeFilter: ["data-cml"] });

(async function () {
  // ١) الجدول
  var RM = function (d, p) { var m = CMLConst.domain(d).meta; return m.bodyRoutes ? CMLShared.routeMode(m.bodyRoutes, p) : "none"; };
  check("★ الجدول: مسارات المتن — المقالات لا الرئيسة ولا المجموعات، والوثائق الخمس، ووثائق المطوّرين (لا رئيستها) وClaude Code (لا الجذر ولا سجلّ الإصدارات)",
        "full,inactive,inactive|full,inactive|full,full,full,full,full,inactive|full,inactive,shell|full,inactive",
        [RM("support", "/en/articles/123-zq"), RM("support", "/en/"), RM("support", "/en/collections/1-zq")].join(",") + "|" +
        [RM("privacy", "/en/articles/9-zq"), RM("privacy", "/en/")].join(",") + "|" +
        ["/legal/privacy", "/legal/non-user-privacy-policy", "/legal/cookies", "/legal/aup", "/legal/consumer-terms", "/legal/archive/zq"].map(function (p) { return RM("legal", p); }).join(",") + "|" +
        [RM("docs", "/docs/en/intro"), RM("docs", "/settings/billing"), RM("docs", "/docs/en/home")].join(",") + "|" +
        [RM("code", "/docs/en/overview"), RM("code", "/docs")].join(","));
  check("★ الجدول: لا صمّام في الأكاديمية ولا claude.ai ولا claude.com", "none/none/none",
        ["academy", "app", "com"].map(function (d) { return CMLConst.domain(d).meta.bodyRoutes ? "set" : "none"; }).join("/"));
  check("القاموس المبنيّ يحمل مسارات المتن من الجدول (build.mjs يحقن meta)", "true", JSON.stringify(BUILT.meta.bodyRoutes) === JSON.stringify(LM.bodyRoutes));

  // ٢) متنٌ لا يظهر أبدًا
  await wait(1000);
  check("★ لا حكم قبل استقرار الصفحة: بعد 1 ث لا حجز (السقف 2.5 ث من التحميل)", "-", heldAttr());
  await wait(2300);

  check("★ ولا شيء مترجَمٌ فيها: العنوان الكامل، والرابط داخل الجملة، والعنوان، وعنوان التبويب", "Settings|Settings|Zq Policy|Zq Policy \\ Anthropic|false",
        txt("oh") + "|" + txt("ol") + "|" + txt("h1") + "|" + T() + "|" + AR.test($("art").textContent));
  check("★ والفقرة القديمة تُقرأ من اليسار، والصفحة كذلك", "ltr|ltr", dirOf("op") + "|" + getComputedStyle(H).direction);
  var hl = hello(), ba = blockAt();

        hl.enabled + "|" + hl.route + "|" + hl.bodies.guard.held + "/" + hl.bodies.guard.why + "|" + ba.error + "/" + ba.why);

  // ٨أ) (مراجعة ر29-د) إطفاء الإضافة ثم الموقع وتشغيلهما والصفحة محجوزة، وطفرةٌ من الموقع أثناء الإطفاء: تبقى محجوزةً فور التشغيل
  var KSITE = ((CMLConst.K && CMLConst.K.SITE_ON) || "cml_site") + ".legal", sw = [];
  for (var sk of ["cml_enabled", KSITE]) {
    setLocal(sk, false);
    await wait(250);
    $("main").appendChild(document.createElement("i")).textContent = "zq";
    await wait(400);
    sw.push(attrs() + "/" + heldAttr());
    var fl = cmlFlips;

    await wait(400);
    sw.push(attrs() + "/" + heldAttr() + "/" + txt("oh") + "/" + (cmlFlips - fl));
  }
  check("★ (مراجعة ر29-د) إطفاء الإضافة أو الموقع وتشغيله والصفحة محجوزة (وطفرةٌ أثناءه): مطفأةٌ بلا سمة حجز، ثم محجوزةٌ «nosel» فورًا بلا قلبٍ ولا ترجمة ولا تبدّلٍ في data-cml",
        "-|en|-|-/-,-|en|-|held/nosel/Settings/0,-|en|-|-/-,-|en|-|held/nosel/Settings/0", sw.join(","));

  check("★ بعد التنقّل: لا حجز قبل السقف (1 ث)", "-|on", heldAttr() + "|" + (H.getAttribute("data-cml") || "-"));
  await wait(1700);
  check("★ ثم حجزٌ «nosel» بعد السقف", "nosel|-", heldAttr() + "|" + (H.getAttribute("data-cml") || "-"));
  await wait(300);
  $("art").appendChild(NEW_BODY);   // رسمٌ متأخر: المتن بعد 3 ث من التنقّل
  await wait(900);
  check("★ المتن ظهر بعد 3 ث: يُرفع الحجز وحده، وتُقلب الصفحة، ويُحكم للمتن بقطعته", "rtl|ar|on|tr|-|عنوانٌ تجريبي للسياسة|فقرةٌ تجريبية من السياسة.",
        attrs() + "|" + heldAttr() + "|" + txt("b1") + "|" + txt("b2"));
  check("★ (ر29-د — ر29-ج §٨) خليّة الجدول المبنيّ بعناصر div الإنجليزية الخالصة LTR، ورأس العمود المعرَّب RTL", "ltr|rtl|رأس عمودٍ تجريبي",
        dirOf("c1") + "|" + dirOf("ch1") + "|" + txt("ch1"));
  var hl2 = hello();
  check("جواب النافذة بعد الرفع: عاملة، والحارس حكم «لا حجب» (وسببه لو حُجبت: لها قطعة)", "true|true/false/drift", hl2.enabled + "|" + hl2.bodies.guard.judged + "/" + hl2.bodies.guard.held + "/" + hl2.bodies.guard.why);

  // ٥) صفحةٌ يطابق محدِّد متنها
  heldLog = [];
  go("/legal/cookies");
  $("body").innerHTML = NEW_HTML;   // React يرسم متن الوثيقة الأخرى بعقدٍ جديدة
  await wait(3300);
  check("★ صفحةٌ يطابق محدِّد متنها: لا حجز أبدًا (3.3 ث)، ومتنها مترجَمٌ بقطعتها", "-||on|tr|عنوانٌ تجريبي للسياسة",
        heldAttr() + "|" + heldLog.filter(function (v) { return v === "nosel"; }).join(",") + "|" + (H.getAttribute("data-cml") || "-") + "|" +
        (H.getAttribute("data-cml-body") || "-") + "|" + txt("b1"));

  // ٦) طافر M6: منتقي اللغة خارج الإبقاء ونصُّه في القاموس
  var f0 = cmlFlips;
  await wait(800);
  var hl3 = hello();
  check("★ (طافر ر29-ج M6) قيمة منتقي اللغة لا تُترجم أبدًا ولو خرجت من الإبقاء وطابقت القاموس، فلا يتقاذف حارس اللغة", "English|true|null|0|false/false/true",
        txt("langVal") + "|" + hl3.enabled + "|" + hl3.siteLangBy + "|" + (cmlFlips - f0) + "|" +
