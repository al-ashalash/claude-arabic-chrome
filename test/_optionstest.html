<title>options test</title>
<!--
  اختبار صفحة الخيارات الحقيقية (options.html + options.js) وعامل الخدمة الحقيقي (sw.js) في إطارٍ
  بقشرة chrome — يُثبت أن شكاوى المالك الأربع أُصلحت (v2-scope/options-page.md):
   ١) «المواقع كلها» أولًا وافتراضيًّا.
   ٢) الربط: إطفاء الرئيس يوقف مفاتيح المواقع عرضًا وتعطيلًا دون كتابتها، والتجميع المعاكس
      («لا موقع مفعّل» / «يعمل في N من M»)، والتحديث الحيّ، وبقاء التركيز.
   ٣) الأقسام نفسها في كل اختيار، وما لا ينطبق معطّلٌ بسببٍ مكتوب خارج حقله.
   ٤) «الكل» يعمل على المواقع كلها: فحصٌ بالتتابع يشمل التطبيق والوثائق، وإضافةٌ تطلب الموقع،
      وتصديرٌ يحمل النطاق، وحذفٌ يشمل الفقرات، وإعادة ضبط موقعٍ تُبقي مفاتيح غيره.
  والنافذة: البوابة على مفتاح التبويب، والتحديث الحيّ، وفتح الإعدادات على موقع التبويب.
  والخط العربي (DESIGN-fonts §٥.٤): البطاقة بخياراتها ومعايناتها وحالها، ونسخة العامل الحقيقي، وسطور التبويبات، و«حول»، وسطر النافذة.
  ★ (ر8-د، ١ جمادى الأولى ١٤٤٨هـ) وملاحظات النسخة التجريبية 2: النافذة بلا سطر «اللغة» (N1)، والترحيب بلفظ المالك وحالِ كل موقعٍ من الجدول
  (N2)، و«المواقع» بعد «التشغيل» بأعمدته الثلاثة ومحرّك الاتجاه ومصدره في قسم الاتجاه والمسارات معزولة (N3)، وتسميات الفحص ومضيفوه
  معزولون (N4)، وحجم الترجمة من الأعداد المشحونة (N5).
  العقد: document.title = "options N/N".
-->

<h1>اختبار صفحة الخيارات: الموقع و«المواقع كلها»</h1>
<table id="tbl"><thead><tr><th>الحالة</th><th>المتوقَّع</th><th>الناتج</th><th></th></tr></thead><tbody></tbody></table>
<div id="frames"></div>
<script>var jsErrors = 0; window.onerror = function () { jsErrors++; };</script>
<script src="_chrome-mock.js"></script>
<script src="../extension/cml-const.js"></script>
<script>var TEST_NAME = "options";</script>
<script src="_options-harness.js"></script>
<script>
(async function () {
  try {
    OPTS_HTML = await fetch(EXT + "options.html").then(function (r) { return r.text(); });
    POPUP_HTML = await fetch(EXT + "popup.html").then(function (r) { return r.text(); });
    var IDS = CMLConst.DOMAINS.map(function (d) { return d.id; });
    try { localStorage.removeItem("cml_ui_domain"); } catch (e) {}

    // ══ ١) «المواقع كلها» أولًا وافتراضيًّا ══
    var E = await makeFrame("options.html", {});
    await until(function () { return E.$("masterState").textContent.length > 0; });
    var sel = E.$("domainSel");
    check("★ «المواقع كلها» هي الخيار الأول", "all", sel.options[0].value);
    check("★ والافتراضي حين لا اختيار محفوظ", "all", sel.value);
    check("عدد الخيارات = المواقع + «الكل» (من الجدول)", IDS.length + 1, sel.options.length);
    check("المواقع في مجموعةٍ بعد «الكل»", "OPTGROUP/" + IDS.join(","),
      sel.options[1].parentNode.tagName + "/" + [].slice.call(sel.options).slice(1).map(function (o) { return o.value; }).join(","));

    // ══ ٢) الربط: البوابة والتجميع المعاكس والتحديث الحيّ ══
    check("التجميع: كلها تعمل", "يعمل في المواقع كلها (" + IDS.length + " مواقع).", E.$("masterState").textContent);
    await toggle(E, "enabled", false);
    await until(function () { return E.$("siteOn_app").disabled; });
    check("★ إطفاء الرئيس: مفاتيح المواقع كلها تُعرض مطفأةً ومعطّلة", IDS.map(function () { return "false/true"; }).join(","),
      IDS.map(function (d) { var i = E.$("siteOn_" + d); return i.checked + "/" + i.disabled; }).join(","));
    check("★ والحال المكتوبة «موقوف بالمفتاح الرئيس» وشريط البوابة ظاهر", "موقوف بالمفتاح الرئيس/true",
      E.$("siteSt_docs").textContent + "/" + visible(E.$("gateBar")));
    check("★ البوابة لا تكتب مفاتيح المواقع (اختياراتها محفوظة)", "false/0",
      E.store.cml_enabled + "/" + Object.keys(E.store).filter(function (k) { return k.indexOf("cml_site.") === 0; }).length);
    await toggle(E, "enabled", true);
    await until(function () { return !E.$("siteOn_app").disabled; });
    check("إعادة الرئيس تعيد كل موقعٍ إلى اختياره", IDS.map(function () { return "true/false"; }).join(","),
      IDS.map(function (d) { var i = E.$("siteOn_" + d); return i.checked + "/" + i.disabled; }).join(","));
    // ★ (ل٧) تبديل مفتاح موقعٍ لا يهدم الصفوف ولا يُسقط التركيز
    var priv = E.$("siteOn_privacy");
    await toggle(E, "siteOn_privacy", false);
    await sleep(150);
    check("★ تبديل مفتاح موقع يُبقي التركيز على العنصر نفسه", "true/true",
      (E.w.document.activeElement === priv) + "/" + (E.$("siteOn_privacy") === priv));
    check("التجميع: «يعمل في N−1 من N مواقع» (من الجدول: خمسة)", "يعمل في " + (IDS.length - 1) + " من " + IDS.length + " مواقع.", E.$("masterState").textContent);
    for (var i = 0; i < IDS.length; i++) await toggle(E, "siteOn_" + IDS[i], false);
    await until(function () { return E.$("masterState").textContent.indexOf("لا موقع") === 0; });
    check("★ التجميع المعاكس: المواقع كلها مطفأة ⇒ «لا موقع مفعّل» وشريطٌ بزرّ التفعيل",
      "true/true/true", (E.$("masterState").textContent.indexOf("لا موقع مفعّل") === 0) + "/" + visible(E.$("allOffBar")) + "/" + E.$("enabled").checked);
    E.$("enableAllSites").focus();
    E.$("enableAllSites").click();
    await until(function () { return E.$("siteOn_support").checked; });
    await sleep(120);
    check("«تفعيل المواقع كلها» يعيدها كلها", "true/0", IDS.every(function (d) { return E.$("siteOn_" + d).checked; }) + "/" +
      Object.keys(E.store).filter(function (k) { return k.indexOf("cml_site.") === 0; }).length);
    check("★ والتركيز بعده على مفتاح أول موقع (لا يسقط إلى body مع الشريط المخفي)", "siteOn_" + IDS[0] + "/false",
      (E.w.document.activeElement && E.w.document.activeElement.id) + "/" + visible(E.$("allOffBar")));
    // (ج٢) الصفحة تتابع التخزين حيًّا: كتابةٌ من النافذة تنعكس بلا إعادة تحميل
    E.mock.chrome.storage.local.set({ cml_enabled: false, cml_rtl: false, cml_chatrtl: false });
    await until(function () { return !E.$("enabled").checked; });
    check("★ تحديثٌ حيّ لكتابةٍ من خارج الصفحة (الرئيس والاتجاه والمحادثة)", "false/false/false/true",
      E.$("enabled").checked + "/" + E.$("rtl").checked + "/" + E.$("chatrtl").checked + "/" + E.$("siteOn_app").disabled);
    check("(ل٥) «عكس الاتجاه» مطفأ ⇒ قسم الاتجاه معطّلٌ بسببٍ ظاهر", "true/true/true",
      E.$("rtlFs").disabled + "/" + visible(E.$("rtlOffWhy")) + "/" + E.$("siteEng_docs").disabled);
    E.mock.chrome.storage.local.set({ cml_enabled: true, cml_rtl: true, cml_chatrtl: true });
    await until(function () { return E.$("enabled").checked && !E.$("rtlFs").disabled; });

    // ══ ٣) الأقسام نفسها في كل اختيار — وما لا ينطبق معطّلٌ بسببٍ مكتوب ══
    var sets = {}, allShown = true;
    for (var j = 0; j < ["all"].concat(IDS).length; j++) {
      var v = ["all"].concat(IDS)[j];
      await pick(E, v);
      sets[v] = sectionsShown(E);
      if (sets[v].indexOf("مخفي") >= 0) allShown = false;
    }
    check("★ مجموعة الأقسام واحدة في الاختيارات كلها", "true",
      Object.keys(sets).every(function (k) { return sets[k] === sets.all; }));
    check("★ لا قسم مخفيٌّ في أي اختيار", "true", allShown);
    // ★ (DESIGN-fonts §٣.٢) بطاقة «الخط العربي» بعد «التشغيل»؛ ★ (ر8-د، N3) و«المواقع» بعد «التشغيل» مباشرةً وقبل «الخط العربي» (طلب المالك)
    check("★ الأقسام بترتيبها", "run,sites,font,scan,rtl,dict,blocks,sync,reset,about", sets.all);
    await pick(E, "support");
    check("★ مركز المساعدة: الفحص معطّلٌ بسببٍ مكتوب خارج حقله", "true/true/false/true",
      E.$("scanFs").disabled + "/" + (visible(E.$("scanWhy")) && E.$("scanWhy").textContent.length > 20) + "/" +
      E.$("scanFs").contains(E.$("scanWhy")) + "/" + (E.$("scanFs").getAttribute("aria-describedby") === "scanWhy"));
    check("مركز المساعدة: اتجاه المحادثة معطّلٌ بسببه، والورقة الحيّة كذلك", "true/true/true/true",
      E.$("chatrtl").disabled + "/" + visible(E.$("chatWhy")) + "/" + E.$("rtlLiveRebuild").disabled + "/" + visible(E.$("rtlLiveWhy")));
    await until(function () { return E.$("statLine").textContent.indexOf("مركز المساعدة") >= 0; }, 3000);
    check("★ (§٥-٤) موقعٌ بلا فحص: لا دوائر فارغة، وسطرُ القاموس ظاهر", "false/false/true",
      visible(E.$("donutBoxT")) + "/" + visible(E.$("donutBoxU")) + "/" + (E.$("statLine").textContent.indexOf("قاموس «مركز المساعدة»") === 0));
    check("★ «تنزيل أمر الترجمة» معطّلٌ حيث لا فحص، وسببُه بجواره خارج أي حقلٍ معطّل", "true/true/false/scanExportWhy",
      E.$("scanExport").disabled + "/" + (visible(E.$("scanExportWhy")) && E.$("scanExportWhy").textContent.indexOf("«مركز المساعدة»") >= 0) + "/" +
      !!E.$("scanExportWhy").closest("fieldset[disabled]") + "/" + E.$("scanExport").getAttribute("aria-describedby"));
    check("شارة الاتجاه بلا لامٍ ملصقةٍ باسم الموقع", "الافتراضي عام · الضبط لهذا الموقع", E.$("rtlScope").textContent);
    await pick(E, "app");
    await until(function () { return E.$("pctT").textContent === "؟"; }, 3000);
    check("(ع٢) موقعٌ له فحص ولم يُفحص: الدائرتان ظاهرتان بلا قوسٍ صفري مرسوم", "true/true/true",
      visible(E.$("donutBoxT")) + "/" + E.$("donutT").classList.contains("zero") + "/" + (E.w.getComputedStyle(E.$("donutT")).visibility === "hidden"));
    check("«تنزيل أمر الترجمة» متاحٌ في التطبيق", "false/false", E.$("scanExport").disabled + "/" + visible(E.$("scanExportWhy")));
    check("التطبيق: تصحيحات الفقرات معطّلةٌ بسببها (لا مخفية)", "true/true/true",
      visible(E.$("blkSection")) + "/" + E.$("blkFs").disabled + "/" + visible(E.$("blkWhy")));
    await pick(E, "docs");
    check("الوثائق: الفحص متاح (ماسح llms) وفحص الاتجاه معطّلٌ بسببه", "false/true/true",
      E.$("scanFs").disabled + "/" + E.$("rtlDocFs").disabled + "/" + visible(E.$("rtlDocWhy")));
    check("(ع٣) رسالة الفحص باسم مضيف الموقع المختار", "true", E.$("scanWarn").textContent.indexOf("platform.claude.com") >= 0);
    // (ع١) الشروح الخافتة كلها بحجمٍ واحد أينما وقعت
    var sizes = [].slice.call(E.w.document.querySelectorAll(".card .desc")).filter(visible)
      .map(function (el) { return E.w.getComputedStyle(el).fontSize; });
    check("(ع١) كل ‎.desc‎ في البطاقات بخطّ 12.5px", "true", sizes.length > 5 && sizes.every(function (s) { return s === "12.5px"; }));

    // ══ (ل٦) لا مستمع يتضاعف بعد عشرة تبديلات ══
    E.mock.chrome.storage.local.set({ "cml_rtl_live.docs": { fp: "f", css: "x{}", at: Date.now(), sources: 1, bytes: 10, flipped: 1 } });
    var l0 = E.L.changed;
    var seq = ["app", "support", "all", "privacy", "docs", "app", "all", "support", "privacy", "docs"];
    for (var s2 = 0; s2 < seq.length; s2++) await pick(E, seq[s2]);
    var r0 = E.removes.filter(function (k) { return k === "cml_rtl_live.docs"; }).length;
    E.$("rtlLiveRebuild").click();
    await sleep(200);
    check("★ عشرة تبديلات ثم ضغطةٌ واحدة = نداءُ حذفٍ واحد", "1",
      E.removes.filter(function (k) { return k === "cml_rtl_live.docs"; }).length - r0);
    check("ولا مستمع تخزينٍ جديد بعد التبديلات", "0", E.L.changed - l0);

    // ══ ٤) «الكل» يعمل على المواقع كلها ══
    await pick(E, "all");
    E.$("newSrc").value = "Zzq all-view term"; E.$("newDst").value = "مصطلح";
    E.$("addTerm").click();
    await sleep(250);
    check("★ الإضافة في «الكل» بلا موقع تُرفض ولا تكتب شيئًا", "true/false/true",
      (E.$("termsStatus").textContent.indexOf("اختر الموقع") === 0) + "/" +
      Object.keys(E.store).some(function (k) { return k.indexOf("cml_overrides") === 0; }) + "/" + visible(E.$("newDomain")));
    E.$("newDomain").value = "support";
    E.$("addTerm").click();
    await until(function () { return E.store["cml_overrides.support"]; }, 3000);
    check("★ ومع اختيار الموقع تُكتب له وحده (عبر العامل)", "مصطلح/false",
      ((E.store["cml_overrides.support"] || {}).ar || {})["Zzq all-view term"] + "/" + ("cml_overrides" in E.store));
    check("ورسالة النجاح تسمّي الموقع", "true",
      await until(function () { return E.$("termsStatus").textContent.indexOf("«مركز المساعدة»") >= 0; }, 2000));
    // فحص المواقع كلها: بالتتابع، ويشمل التطبيق والوثائق (ماسح llms)، ونتائج مفصولة
    var asked = [];
    E.mock.chrome.storage.onChanged.addListener(function (ch2, area) {
      if (area !== "session" || !ch2.cml_scan_request || !ch2.cml_scan_request.newValue) return;
      var d2 = ch2.cml_scan_request.newValue.d;
      asked.push(d2);
      setTimeout(function () {
        var w = {};
        w[CMLConst.key("cml_scan_result", d2)] = { status: "done", fetched: 1, found: 20, missing: 3, shown: 3,
          list: ["Zq1 " + d2, "Zq2 " + d2, "Zq3 " + d2], varList: [], at: Date.now(), seconds: 1, source: d2 === "docs" ? "llms" : undefined };
        E.mock.chrome.storage.local.set(w);
      }, 80);
    });
    check("«الكل»: زرّ الفحص يفحص المواقع كلها", "فحص المواقع كلها", E.$("startScan").textContent);
    E.$("startScan").click();
    await until(function () { return asked.length >= 2 && E.store["cml_scan_result.docs"] && !E.$("startScan").disabled; }, 9000);
    var scannable = IDS.filter(function (d) { return CMLConst.caps(d).scan.on; });
    check("★ «فحص المواقع كلها» يمرّ بالتتابع على كل موقعٍ له ماسح (التطبيق ثم الوثائق)", scannable.join(","), asked.join(","));
    check("★ النتائج مفصولة لكل موقع في صفّه", "true/true/true",
      (E.$("scanRes_app").textContent.indexOf("وجد") === 0) + "/" + (E.$("scanRes_docs").textContent.indexOf("وجد") === 0) + "/" +
      (E.$("scanRes_support").textContent.indexOf("بلا فحص") < 0));
    // (ع) مطابقة المعدود بعد «وجد» (مفعول به)، وأرقامُ سطرٍ فيه تاريخٌ هجري هنديةٌ كتاريخه
    check("★ «وجد ٢٠ نصًّا» و«وجد ٢٠ عنوانًا» — لا «وجد 20 نصّ» ولا رقمان في سطر", "true/true/false",
      (E.$("scanRes_app").textContent.indexOf("وجد ٢٠ نصًّا") === 0) + "/" + (E.$("scanRes_docs").textContent.indexOf("وجد ٢٠ عنوانًا") === 0) + "/" +
      /[0-9]/.test(E.$("scanRes_app").textContent));
    await until(function () { return E.$("statLine").textContent.indexOf("العناوين") >= 0; }, 3000);
    // (ر8-د، N5) وصدرُ السطر حجمُ الترجمة («… نصًّا للواجهة …») — فـ«لا تُجمع في نصًّا واحدة» تُمتحن في جزء الدائرتين وحده
    var scanPart = E.$("statLine").textContent.split("الدائرتان")[1] || "";
    check("سطر الإحصاء في «الكل»: نصوص التطبيق وعناوين الوثائق كلٌّ باسمه", "true/true/false",
      (scanPart.indexOf("«تطبيق Claude»: النصوص 20") >= 0) + "/" +
      (scanPart.indexOf("«وثائق المطوّرين»: العناوين 20") >= 0) + "/" + (scanPart.indexOf("نصًّا") >= 0));
    check("★ زرّ فحص موقعٍ بلا ماسح يُوصف بسبب تعطيله لا بخانة النتيجة", "true/true",
      (E.$("scanBtn_support").getAttribute("aria-describedby") === "scanNoWhy_support") + "/" +
      (E.$("scanNoWhy_support").textContent === CMLConst.caps("support").scan.why));
    check("زرّ الفحص لموقعٍ بلا ماسح معطّل", "true", E.$("scanBtn_privacy").disabled);
    // أمر الترجمة في «الكل»: ملفٌّ واحد بأقسامٍ لكل موقعٍ له نتيجة، والردّ المطلوب يحمل مواقعه
    E.$("scanExport").click();
    await sleep(200);
    var prompt = await blobText(E);
    check("أمر الترجمة في «الكل» بأقسام المواقع وصيغة domains", "true/true/true",
      (prompt.indexOf("Zq1 app") >= 0) + "/" + (prompt.indexOf("Zq1 docs") >= 0) + "/" + (prompt.indexOf('{"domains"') >= 0));
    // تصدير المصدر في «الكل»: domains لكل المواقع
    E.$("exportSrcBare").click();
    await until(function () { return E.blobs.length >= 2; }, 5000);
    var srcAll = JSON.parse(await blobText(E));
    check("★ تصدير المصدر في «الكل» يحمل domains بالمواقع كلها", IDS.join(","), Object.keys(srcAll.domains || {}).join(","));
    check("وبلا ترجمة فعلًا، وبإصدار الصيغة", "true/2", (srcAll.domains.support.terms.every(function (t) { return t.ar === ""; })) + "/" + srcAll._version);
    // إعادة ضبط موقع في «الكل» تطلب اختياره صراحةً
    check("إعادة ضبط موقعٍ في «الكل»: الزرّ معطّل حتى يُختار الموقع", "true", E.$("resetSite").disabled);

    // ══ الموقع المختار: التصدير يحمل نطاقه، والاستيراد بلا نطاق يسأل، والحذف يشمل الفقرات ══
    var FP = "0123456789abcdef";
    FIX["bodies/support/ar/index.json"] = { v: 1, shards: ["a"], pages: 120, harvested: 361, harvestedAt: "2026-09-24" };
    try { localStorage.setItem("cml_ui_domain", "support"); } catch (e) {}
    var seed2 = {
      "cml_overrides.support": { ar: { "Zzq sup": "تصحيح", "A guide for internal champions driving adoption": "دليل للمناصرين الداخليين الذين يقودون التبنّي" } },
      "cml_block_ov.support": { ar: {} },
    };
    seed2["cml_block_ov.support"].ar[FP] = "فقرةٌ مصحّحة للاختبار";

    // ★ (ر8-ب) التسمية بما يُمتحن فعلًا (مراجعة ر8-أ، F1؛ كانت «ولا تُقرأ»): نصّ المحادثات «لا تلمسه الترجمة» ويُرسم بالخط المختار —
    // ومفتاح «ضبط اتجاه نص المحادثة» يقرؤه قراءةً عابرة (القرار 16)، فلا تقول «حول» ولا بطاقة «الخط العربي» إن الإضافة لا تقرؤه
    var fontCardT = FT.$("fontSection").textContent;
    check("«حول»: نصّ المحادثات لا تلمسه الترجمة ويُرسم بالخط المختار، والإذن يحفظ نسخة الخط، ولا ادّعاء «لا تقرؤه» فيها ولا في بطاقة الخط", "true/true/true/false",
      (aboutT.indexOf("وإنما يرسم متصفحك حروفه العربية بالخط الذي تختاره في «الخط العربي»") >= 0) + "/" +
      (aboutT.indexOf("ونسخةٍ من ملف الخط الذي تختاره ليُرسم مع الصفحة من أول لحظة") >= 0) + "/" +
      (aboutT.indexOf("لا تلمسه الترجمة") >= 0) + "/" + /لا تقرؤه|ولا تقرأ الإضافة/.test(aboutT + " " + fontCardT));
    // ★ (ر8-ب) سطر الرخصة يحدّ MIT بما أنشأه المشروع (مراجعة ر8-أ، F12): التعليمات البرمجية والترجمة العربية، والخطوط برخصة SIL،
    // ونصوص المواقع الإنجليزية التي تطابقها الإضافة لـ Anthropic — لا «والإضافة نفسها مفتوحة المصدر برخصة MIT» كلّها
    var licT = FT.$("licenseLine").textContent;
    check("«حول»: سطر الرخصة — MIT للتعليمات البرمجية والترجمة العربية، والخطوط برخصة SIL، ونصوص المواقع الإنجليزية لـ Anthropic", "true/true/true/false",
      (licT.indexOf("تعليماتها البرمجية وترجمتها العربية برخصة MIT") >= 0) + "/" + (licT.indexOf("برخصة SIL للخطوط المفتوحة") >= 0) + "/" +
      (licT.indexOf("نصوص المواقع الإنجليزية التي تطابقها الإضافة فحقوقها لشركة Anthropic") >= 0) + "/" +
      (licT.indexOf("والإضافة نفسها مفتوحة المصدر برخصة MIT") >= 0));
    // ★ (ر8-أ) أصحاب حقوق الخطوط في «حول» مكتوبون في الصفحة نفسها: هم خطوط الفهرس كلها بمعرّفاتها، وكل سطر حقوقٍ في سطر خطّه من CREDITS.txt حرفًا
    var credTxt = await fetch(EXT + "fonts/CREDITS.txt").then(function (r) { return r.ok ? r.text() : ""; }, function () { return ""; });
    var holders = [].slice.call(FT.w.document.querySelectorAll("#fontHolders [data-font]"));
    check("«حول»: أصحاب حقوق الخطوط هم خطوط الفهرس، وكلٌّ في سطر خطّه من CREDITS.txt", FONTS.map(function (e) { return e.id; }).join("|") + "/true",
      holders.map(function (h) { return h.getAttribute("data-font"); }).join("|") + "/" + (holders.length > 0 && holders.every(function (h) {
        var cr = (h.querySelector(".cr") || {}).textContent || "", fam = (h.querySelector(".fam") || {}).textContent || "";
        var line = credTxt.split("\n").filter(function (l) { return l.indexOf(h.getAttribute("data-font") + ".woff2 ") === 0; })[0] || "";
        return !!cr && !!fam && line.indexOf(cr) >= 0 && line.indexOf(fam) >= 0;
      })));
    // ★ (ر8-أ) قائمة المعاجم والمصادر: كل عددٍ بين قوسين عددُ بنود قائمته، والعنوان مجموعهما، والقائمة مطويّة افتراضيًّا
    var lexN = [].slice.call(FT.w.document.querySelectorAll("#lexSources .n")).map(function (s) { return s.textContent; });
    var nSa = FT.w.document.querySelectorAll("#lexSaudi > li").length, nOt = FT.w.document.querySelectorAll("#lexOther > li").length;
    check("«حول»: أعداد المعاجم والمصادر تطابق بنود قوائمها، والقائمة مطويّة", (nSa + nOt) + "/" + nSa + "/" + nOt + "/false",
      lexN.join("/") + "/" + FT.$("lexSources").open);
    check("الترحيب: سطر الخط باسم الافتراضي من الفهرس وزرّ «اختيار الخط»", "true/true",
      (FT.$("welcomeFont").textContent.indexOf("بخط " + DEF.family + "،") >= 0) + "/" + visible(FT.$("welcomeFontBtn")));
    // النصوص التي تسمّي الافتراضي تتبع C.FONT_DEFAULT إن غُيِّر (قاعدة ق١)
    var OPTS_SAVED = OPTS_HTML;
    OPTS_HTML = OPTS_HTML.replace('<script src="cml-const.js"><\/script>', '<script src="cml-const.js"><\/script><script>CMLConst.FONT_DEFAULT = "markazi-text";<\/script>');
    var FD = await makeFrame("options.html", {});
    OPTS_HTML = OPTS_SAVED;
    check("الخط: الوسم والترحيب والجملة الأولى تتبع C.FONT_DEFAULT إذا غُيِّر", "markazi-text/true/true/Markazi Text",
      (FD.w.document.querySelector('#fontList input[name="font"]:checked') || {}).value + "/" +
      (FD.$("font_markazi-text").closest("label").querySelector(".tag") !== null && !FD.$("font_cairo").closest("label").querySelector(".tag")) + "/" +
      (FD.$("welcomeFont").textContent.indexOf("بخط Markazi Text،") >= 0 && FD.$("font_markazi-textWhy").textContent.indexOf("أكثر الخطوط العربية طلبًا") === 0) + "/" +
      FD.$("fontDefaultName").textContent);
    // النافذة: سطر حال الخط من ردّ cml-hello، ولا يظهر مع «خط الموقع» ولا مع الخمول، وارتفاعها دون 600
    async function popFont(font, enabled) {
      var Q = await makeFrame("popup.html", {}, { tabs: {
        query: function (q, cb) { setTimeout(function () { cb([{ id: 8 }]); }, 0); },
        sendMessage: function (id, msg, o, cb) { setTimeout(function () { cb(msg.type === "cml-hello" ? { domain: "app", route: "full", enabled: enabled !== false, font: font, bodies: null } : null); }, 0); },
      } });
      await until(function () { return Q.$("tabLabel").textContent.indexOf("تطبيق") >= 0; }, 4000);
      await sleep(120);
      return { t: Q.$("fontNote").textContent, v: visible(Q.$("fontNote")), h: Math.ceil(Q.w.document.documentElement.getBoundingClientRect().height) };
    }
    var pOk = await popFont({ reach: "ok" }), pNone = await popFont({ reach: "none" }), pErr = await popFont({ reach: "err" });
    var pOff = await popFont({ reach: "off" }), pIdle = await popFont({ reach: "ok" }, false);
    check("★ النافذة: سطر الخط «مطبَّق» و«لم يجد خطوط هذا الموقع» و«تعذّر تحميله»، ولا سطر مع off ولا مع الخمول",
      "الخط: مطبَّق/الخط: لم يجد خطوط هذا الموقع/الخط: تعذّر تحميله؛ أعد تحميل الصفحة/false/false",
      pOk.t + "/" + pNone.t + "/" + pErr.t + "/" + pOff.v + "/" + pIdle.v);
    check("النافذة: سطر الخط لا يتجاوز بها سقف كروم (600 بكسل) — تبويب التطبيق والخط مطبَّق", "true", pOk.h <= 600 || "h=" + pOk.h + " off=" + pOff.h);
    // ★ (ر8-ب) اسم الإضافة في «حول»: short_name من المانيفست، واحتياطُه حين يغيب short_name وname معًا هو short_name الحقيقي في
    // manifest.json لا اسم 1.0.0 (مراجعة ر8-أ، F17) — بإطارٍ يُرجع مانيفستًا بلا اسم
    var MF = await fetch(EXT + "manifest.json").then(function (r) { return r.json(); }, function () { return {}; });
    var NM = await makeFrame("options.html", {}, { manifest: { version: "2.0.0" } });
    check("★ «حول»: الاسم المختصر من المانيفست، واحتياطه (مانيفستٌ بلا اسم) اسمُ 2.0.0 المختصر في manifest.json",
      MF.short_name + "/" + MF.short_name + "/v2.0.0", aboutNameE + "/" + NM.$("aboutName").textContent + "/" + NM.$("aboutVersion").textContent);
    // ★ (ر9-أ) version_name (يُعرض تحت اسم الإضافة في chrome://extensions وفي «حول»): «<الإصدار> — قاموس <العدد> <المعدود>» بعددٍ مجمَّع
    // المراتب ومعدودٍ بصيغته بعد العدد (قاعدة arCount، والعدد مضافٌ إليه)، والعدد مفاتيح النصوص في قواميس المواقع المبنيّة كلها
    function phrasesN(n) {
      var m = n % 100, ns = n.toLocaleString("en");
      return n === 1 ? "عبارة واحدة" : n === 2 ? "عبارتين" : (n === 0 || (m >= 3 && m <= 10)) ? ns + " عبارات" : (m >= 11 && m <= 99) ? ns + " عبارةً" : ns + " عبارة";
    }
    check("★ (ر9-أ) version_name في المانيفست: «الإصدار — قاموس» ثم عدد مفاتيح القواميس المبنيّة كلها مجمَّع المراتب، والمعدود بعده بصيغته العربية (مثل «40,219 عبارةً»)",
      MF.version + " — قاموس " + phrasesN(KEYS_N) + "/true",
      MF.version_name + "/" + (KEYS_N > 1000 && /^\d+\.\d+\.\d+ — قاموس \d{1,3}(,\d{3})+ (عبارة|عبارةً|عبارات)$/.test(MF.version_name)));
    // ★ (ر9-ج، ٥ جمادى الأولى ١٤٤٨هـ — القرار 100) اسم الإضافة بقرار المالك حرفًا بحرف: name الكامل، وshort_name المختصر (عشرة أحرف،
    // وكروم يوصي باثني عشر فأقل)، وتلميح أيقونتها action.default_title بالمختصر؛ ونسخُه الثابتة في الصفحتين، فهي لا تُقرأ من المانيفست:
    // عنوان الإعدادات ورأسها، واسمها في «حول» قبل أن يكتبه options.js، ورأس النافذة. فإن بقي اسمٌ سابق في موضعٍ منها أخفق هذا
    var NAME_FULL = "تعريب كلود (Claude) لنسخة الويب (غير رسمي)", NAME_SHORT = "تعريب كلود";
    function tagText(html, re) { var mt = re.exec(html); return mt ? mt[1].replace(/\s+/g, " ").trim() : "(غائب)"; }
    check("★ (ر9-ج) اسم الإضافة بالقرار 100: name وshort_name (12 حرفًا فأقل) وaction.default_title في المانيفست، وعنوان الإعدادات ورأسها واسمها في «حول»، ورأس النافذة",
      [NAME_FULL, NAME_SHORT, NAME_SHORT, true, "إعدادات " + NAME_SHORT, NAME_FULL, NAME_SHORT, NAME_SHORT].join("/"),
      [MF.name, MF.short_name, (MF.action || {}).default_title, String(MF.short_name || "").length <= 12,
       tagText(OPTS_HTML, /<title>([^<]*)<\/title>/), tagText(OPTS_HTML, /<h1 id="appName">([^<]*)<\/h1>/),
       tagText(OPTS_HTML, /<strong id="aboutName">([^<]*)<\/strong>/), tagText(POPUP_HTML, /<h1>([^<]*)<\/h1>/)].join("/"));
    check("لا أخطاء جافاسكربت في الصفحة", 0, jsErrors);
  } catch (e) {
    check("استثناء في الاختبار", "", String(e && (e.stack || e.message) || e).slice(0, 400));
  }
  document.title = "options " + pass + "/" + total;
  var h = document.createElement("p");
  h.className = pass === total ? "ok" : "bad";
  h.textContent = "OPTIONS: " + pass + "/" + total + (pass === total ? " — all pass" : " — FAIL");
  document.body.appendChild(h);
  try { localStorage.removeItem("cml_ui_domain"); } catch (e) {}
})();
</script>
