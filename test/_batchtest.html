<!--
  ★ (ر24-ج2، ١٠ جمادى الأولى ١٤٤٨هـ) دفعة الطفرات:
   ١) مراجعة Codex AD-001 — جذور الدفعة: أصغرُ مجموعةٍ من العقد المضافة تغطّيها. دفعةٌ كبيرة في مهمةٍ واحدة (آباءٌ وأبناؤهم وأحفادهم، وإخوةٌ، وعقدةٌ
      أُضيفت ثم أُزيلت، وأخرى أُضيفت ثم أُزيلت ثم أُعيدت، وعقدةُ نصٍّ في أبٍ مضاف، وسلسلةٌ بعمق 40): كلُّ عقدةٍ يمرّ بها المشي مرّةً واحدة (عدّادٌ على
      مرشِّح المشي)، والناتج هو ناتجُ المرور الكامل على الشجرة نفسها (الإطفاء ثم التشغيل) حرفًا بحرف — والمقارنة بالمحرّك السابق في تقرير المرحلة.
   ٢) ما حملته ر24-ج1 — عنصرٌ معرَّب (لا عقدةُ نصٍّ مجرّدة) نُقل إلى محادثةٍ أو إلى حاوٍ قابلٍ للتحرير: يُرجع ما كتبناه فيه نصًّا وسمة، ومنه جذرٌ جديد فيه
      محادثةٌ نُقل إليها عنصرٌ في الدفعة نفسها؛ والضابط: المنقول إلى حاوٍ عاديّ يبقى معرَّبًا. وجوابٌ يُبثّ في المحادثة (2,000 قطعة نصُّها من القاموس) لا
      يُعرَّب منه شيء. وجاسوسٌ عامّ على القراءة (نموذج _blockprotspytest): 0 قراءةٍ لنصّ المستخدم في المحادثة والمحرِّر.
  العقد: document.title = "batch N/N".
-->

<script>
var jsErrors = 0; window.onerror = function () { jsErrors++; };
// عدّاد الزيارات: كل نداءٍ لمرشِّح مشيٍ بالعناصر والنصوص (مشي walk) لكل عقدة — يُركَّب قبل المحرّك
var VISITS = new Map(), COUNT = false, CTW = Document.prototype.createTreeWalker;
Document.prototype.createTreeWalker = function (root, what, filter) {
  if (COUNT && filter && typeof filter.acceptNode === "function" && what === (NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT)) {
    var f = filter.acceptNode;
    filter = { acceptNode: function (n) { VISITS.set(n, (VISITS.get(n) || 0) + 1); return f.call(this, n); } };
  }
  return CTW.call(this, root, what, filter);
};
// الجاسوس العامّ: كل getter يقرأ نصًّا، وكل عنصرٍ يحوي نصَّ المستخدم (فتُرى قراءة السلف)
var SENT = new Set(), SPY_ON = false, HITS = {};
function hit(where, t) {
  if (!SPY_ON) return;
  var ok = false;
  if (t && t.nodeType === 3) ok = SENT.has(t);
  else if (t && t.contains) SENT.forEach(function (s) { if (!ok && t !== s && t.contains(s)) ok = true; });
  if (ok) HITS[where] = (HITS[where] || 0) + 1;
}
[[Node.prototype, "nodeValue"], [CharacterData.prototype, "data"], [Node.prototype, "textContent"], [HTMLElement.prototype, "innerText"],
 [Element.prototype, "innerHTML"], [Element.prototype, "outerHTML"], [Text.prototype, "wholeText"], [HTMLElement.prototype, "outerText"]].forEach(function (x) {
  var d = Object.getOwnPropertyDescriptor(x[0], x[1]); if (!d || !d.get) return;
  Object.defineProperty(x[0], x[1], { configurable: true, enumerable: d.enumerable, get: function () { hit(x[1], this); return d.get.call(this); }, set: d.set });
});
function spyReport() { return JSON.stringify(HITS) === "{}" ? "0" : JSON.stringify(HITS); }
["chatDst", "edDst"].forEach(function (id) {
  var w = document.createTreeWalker(document.getElementById(id), NodeFilter.SHOW_TEXT), t; while ((t = w.nextNode())) SENT.add(t);
});
</script>

<script>

  var tr = document.createElement("tr");

  var s = document.createElement("td"); s.className = ok ? "ok" : "bad"; s.textContent = ok ? "✓" : "✗"; tr.appendChild(s);
  tb.appendChild(tr);

function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      G.appendChild(document.createTextNode(KEYS[(i * 7 + j) % KEYS.length]));

  COUNT = false;
  var all = [], tw = CTW.call(document, arena, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, null), n, maxV = 0, multi = 0, unseen = 0;
  while ((n = tw.nextNode())) all.push(n);

  check("★ (ر24-ج2، AD-001) دفعةٌ كبيرة متداخلة (آباءٌ وأبناءٌ وأحفاد، وإخوة، ومُزالٌ لا يُمسّ، ومُعادٌ مرّتين، ونصٌّ في أبٍ مضاف، وسلسلةٌ بعمق 40): كلُّ عقدةٍ يمرّ بها المشي مرّةً واحدة",
        "1|0|0|" + all.length + "|Settings", maxV + "|" + multi + "|" + unseen + "|" + all.length + "|" + txt(R));
  var H1 = quiet(function () { return arena.innerHTML; }), tr1 = (H1.match(/الإعدادات|بحث|نسخ|حفظ|إلغاء/g) || []).length;
  // المرجع: المرور الكامل على الشجرة نفسها (الإطفاء يُرجع الإنجليزية كلّها، والتشغيل يمشي الصفحة كلّها)
  master(false);
  var EN = quiet(function () { return /[؀-ۿ]/.test(arena.textContent) || /[؀-ۿ]/.test(arena.innerHTML); });
  master(true);
  await wait(300);
  var H2 = quiet(function () { return arena.innerHTML; });
  check("★ (ر24-ج2، AD-001) وناتج الدفعة هو ناتج المرور الكامل على الشجرة نفسها حرفًا بحرف (نصوصًا وسمات)، والإطفاء بينهما يُرجعها كلَّها", "true|true|false",
        (H1 === H2) + "|" + (tr1 > 300) + "|" + EN);
  // ٢ب) جزيرةٌ غير قابلةٍ للتحرير داخل حاوٍ قابل (كما يعرّبها مسار العقدة: أبوها غير قابل): إعادةُ إدراج الحاوي لا تُرجعها — الإرجاع كقاعدة translateText
  var isl = $("islS").firstChild; quiet(function () { isl.nodeValue = "Delete"; });
  await wait(700);
  var islBefore = txt(isl.parentNode), islW = 0, islO = new MutationObserver(function (l) { islW += l.length; });
  islO.observe(isl, { characterData: true });
  $("islBox").parentNode.appendChild($("islBox"));
  await wait(900);
  islO.disconnect();
  check("والضابط: جزيرةٌ غير قابلةٍ للتحرير داخل حاوٍ قابل معرَّبةٌ بمسار العقدة تبقى معرَّبةً بعد إعادة إدراج الحاوي بلا كتابةٍ فيها ولو عابرة (الإرجاع لنصٍّ أبوه قابلٌ للتحرير وحده، كقاعدة translateText)", "حذف|حذف|0", islBefore + "|" + txt(isl.parentNode) + "|" + islW);
  // ٢) عنصرٌ معرَّب نُقل إلى محادثةٍ أو إلى حاوٍ قابلٍ للتحرير
  $("chatDst").appendChild($("mvA"));
  $("edDst").appendChild($("mvB"));
  var W = document.createElement("div"), CC = document.createElement("div"); CC.className = "prose"; W.appendChild(CC);
  document.body.appendChild(W); CC.appendChild($("mvC"));
  $("chatDst").appendChild($("mvE"));
  $("plainDst").appendChild($("mvD"));
  await wait(900);
  check("★ (ر24-ج2) عنصرٌ معرَّب نُقل إلى محادثةٍ يُرجع نصُّه وسمتُه (title)، ونُقل إلى حاوٍ قابلٍ للتحرير يُرجع نصُّه",
        "Settings|Copy|Share|New chat", [$("mvA"), $("mvE")].map(txt).join("|") + "|" + $("mvE").getAttribute("title") + "|" + txt($("mvB")));
  check("★ (ر24-ج2) وجذرٌ جديد فيه محادثةٌ نُقل إليها عنصرٌ معرَّب في الدفعة نفسها: يُرجع (المشي يُرجع ما يرفضه في الدفعة)", "Search", txt($("mvC")));
  check("والضابط: المنقول إلى حاوٍ عاديّ يبقى معرَّبًا", "المساعدة", txt($("mvD")));
  // ٢ج) (المراجعة المستقلة لـر24-ج2) العقدة المغطّاة لا تُسقط إلا إن بلغها مشيُ سلفها: (أ) محرِّرٌ فيه جزيرةٌ غير قابلةٍ للتحرير أُدرج في الدفعة داخل جذرٍ
  // أُدرج فيها قبله — المحرّك السابق كان يمشي المحرِّر وحده فيعرّب الجزيرة، ومشيُ السلف يرفض المحرِّر كلَّه؛ (ب) عنصرٌ معرَّب نُقل إلى ‎<pre>‎ تحت
  // ‎.ProseMirror‎ مع جذرٍ جديد — المشي يرفض ‎<pre>‎ وسمًا متخطًّى قبل المستثنى فلا يُرجعه
  var W3 = document.createElement("div"); document.body.appendChild(W3);
  var ctl3 = document.createElement("span"); ctl3.textContent = "Upgrade"; W3.appendChild(ctl3);
  var E3 = document.createElement("div"); E3.setAttribute("contenteditable", "true");
  var I3 = document.createElement("span"); I3.setAttribute("contenteditable", "false"); I3.textContent = "Upgrade"; E3.appendChild(I3);
  W3.appendChild(E3);

  PM4.className = "ProseMirror"; PM4.setAttribute("contenteditable", "false"); PM4.appendChild(PRE4); W4.appendChild(PM4);
  document.body.appendChild(W4); PRE4.appendChild($("mvD"));
  await wait(900);

  // ٢د) (المراجعة المستقلة لـر24-ج2) عناصرُ معرَّبة نُقلت إلى محادثةٍ وإلى محرِّرٍ وإلى كتلةٍ تحت ‎.ProseMirror‎ داخل فرعٍ مفصول، ثم أُلحق الفرع: لا سجلَّ
  // إضافةٍ لها هي (النقل إلى المفصول لا يُرى)، فمشيُ الجذر وحده يُرجعها بما يرفضه (walkPruned)
  var F5 = $("mvF"), G5 = $("mvG"), H5 = $("mvH");
  var D5 = document.createElement("div"), C5 = document.createElement("div"), E5 = document.createElement("div"), P5 = document.createElement("div"), B5 = document.createElement("p");
  C5.className = "prose"; E5.setAttribute("contenteditable", "true"); P5.className = "ProseMirror"; P5.setAttribute("contenteditable", "false"); P5.appendChild(B5);
  D5.appendChild(C5); D5.appendChild(E5); D5.appendChild(P5);
  C5.appendChild(F5); E5.appendChild(G5); B5.appendChild(H5);
  await wait(300);
  document.body.appendChild(D5);
  await wait(900);
  check("★ (مراجعة ر24-ج2) عنصرٌ معرَّب نُقل داخل فرعٍ مفصول إلى محادثةٍ وإلى محرِّرٍ وإلى كتلةٍ تحت ‎.ProseMirror‎ ثم أُلحق الفرع: يُرجع كلٌّ منها", "Retry|Rename|Cancel", [F5, G5, H5].map(txt).join("|"));
